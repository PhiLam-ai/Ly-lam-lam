name: Blender 3.6 Avatar Validation

on:
  workflow_dispatch:
    inputs:
      builder_script:
        description: "Optional path to an avatar builder .py already committed to the repository"
        required: false
        type: string
        default: ""
  push:
    paths:
      - ".github/workflows/blender36-avatar-check.yml"
      - "tools/blender36_smoke_test.py"
      - "tools/blender36_model_audit.py"
      - "tools/blender36_arm_alignment_candidate.py"
      - "tools/blender36_geometry_gap_audit.py"
      - "tools/blender36_coherent_body_candidate.py"
      - "tools/blender36_v313_coordinate_rig_audit.py"
      - "tools/blender36_v313_skin_weight_audit.py"
      - "tools/blender36_v313_bindpose_audit.py"
      - "tools/blender36_v313_mesh_localization.py"
      - "tools/blender36_v313_transform_bind_audit.py"
      - "tools/blender36_v313_evaluated_mesh_audit.py"
      - "tools/blender36_v313_unskinned_diagnostic.py"
      - "tools/blender36_v314_coherent_avatar_candidate.py"
      - "tools/v314_candidate_webgl_smoke.cjs"
      - "tools/blender36_v313_rest_pose_comparison.py"
      - "tools/blender36_v313_pose_reset_experiment.py"
      - "tools/blender36_v313_named_weight_audit.py"
      - "tools/blender36_v313_face_weight_experiment.py"
      - "tools/avatar-builder.py"
      - "lam-default.glb"

permissions:
  contents: read

concurrency:
  group: blender36-avatar-check
  cancel-in-progress: true

jobs:
  blender36-headless:
    name: Blender 3.6 real model audit
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils libxi6 libxrender1 libxfixes3 \
            libxkbcommon0 libsm6 libgl1 libegl1 libx11-6 libxxf86vm1 \
            libxcb1 libxext6 libdbus-1-3
          sudo rm -rf /var/lib/apt/lists/*

      - name: Download pinned Blender 3.6 LTS
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://download.blender.org/release/Blender3.6/blender-3.6.23-linux-x64.tar.xz \
            --output /tmp/blender.tar.xz
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf /tmp/blender.tar.xz -C "$RUNNER_TEMP/blender" --strip-components=1
          "$RUNNER_TEMP/blender/blender" --background --factory-startup --python-expr \
            "import bpy; print('BLENDER_VERSION=' + bpy.app.version_string)"
          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"

      - name: Run real Lam GLB audit, render three views, and round-trip export
        run: |
          set -euo pipefail
          mkdir -p artifacts/model-audit
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender36_model_audit.py -- \
            --input "$GITHUB_WORKSPACE/lam-default.glb" \
            --output-dir "$GITHUB_WORKSPACE/artifacts/model-audit"
          test -s artifacts/model-audit/blender36-model-audit.json
          test -s artifacts/model-audit/lam-default-front.png
          test -s artifacts/model-audit/lam-default-side.png
          test -s artifacts/model-audit/lam-default-three-quarter.png
          test -s artifacts/model-audit/lam-default-roundtrip.glb
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/model-audit/blender36-model-audit.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report.get("status") == "PASS", report
          assert report.get("source_unchanged") is True, report
          assert report.get("mesh_count", 0) > 0, report
          print("REAL_MODEL_AUDIT_GATE=PASS")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Audit body-part adjacency using world-space bounds
        run: |
          set -euo pipefail
          mkdir -p artifacts/geometry-gap-audit
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender36_geometry_gap_audit.py -- \
            --input "$GITHUB_WORKSPACE/lam-default.glb" \
            --output-dir "$GITHUB_WORKSPACE/artifacts/geometry-gap-audit"
          test -s artifacts/geometry-gap-audit/geometry-gap-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/geometry-gap-audit/geometry-gap-audit.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report["mesh_count"] > 0, report
          assert all(x["status"] == "MEASURED" for x in report["pairs"]), report
          print("GEOMETRY_GAP_AUDIT=PASS_DIAGNOSTIC_ONLY")
          PY

      - name: Run isolated smoke test
        run: |
          set -euo pipefail
          mkdir -p artifacts/smoke-test
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender36_smoke_test.py -- \
            --output-dir "$GITHUB_WORKSPACE/artifacts/smoke-test"

      - name: Build isolated experimental arm-alignment candidate
        run: |
          set -euo pipefail
          mkdir -p artifacts/arm-alignment-candidate
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender36_arm_alignment_candidate.py -- \
            --output-dir "$GITHUB_WORKSPACE/artifacts/arm-alignment-candidate"
          test -s artifacts/arm-alignment-candidate/lam-arm-alignment-candidate.glb
          test -s artifacts/arm-alignment-candidate/arm-alignment-candidate-front.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/arm-alignment-candidate/arm-alignment-candidate-report.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report["source_unchanged"] is True, report
          assert report["candidate_bytes"] > 1024, report
          print("ARM_ALIGNMENT_CANDIDATE_EXPORTED=PASS")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Build isolated coherent-body prototype candidate
        run: |
          set -euo pipefail
          mkdir -p artifacts/coherent-body-candidate
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender36_coherent_body_candidate.py -- \
            --output-dir "$GITHUB_WORKSPACE/artifacts/coherent-body-candidate"
          test -s artifacts/coherent-body-candidate/lam-coherent-body-candidate.glb
          test -s artifacts/coherent-body-candidate/coherent-body-front.png
          test -s artifacts/coherent-body-candidate/coherent-body-three-quarter.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/coherent-body-candidate/coherent-body-candidate.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report["status"] == "EXPERIMENTAL_CANDIDATE_NOT_APPROVED", report
          assert report["bytes"] > 1024, report
          height = report.get("measured_bounds_m", {}).get("size", [0, 0, 0])[2]
          assert abs(height - 1.60) < 0.03, report
          # Inspect the actual GLB JSON chunk: the studio floor must not ship with the character.
          import struct
          glb = Path("artifacts/coherent-body-candidate/lam-coherent-body-candidate.glb").read_bytes()
          assert glb[:4] == b"glTF" and struct.unpack_from("<I", glb, 4)[0] == 2, "Invalid GLB header"
          chunk_len, chunk_type = struct.unpack_from("<II", glb, 12)
          assert chunk_type == 0x4E4F534A, "First GLB chunk is not JSON"
          doc = json.loads(glb[20:20 + chunk_len].decode("utf-8"))
          names = [node.get("name", "") for node in doc.get("nodes", [])]
          assert "StudioFloor" not in names, "Studio floor leaked into candidate GLB"
          print("COHERENT_BODY_CANDIDATE_EXPORTED=PASS_EXPERIMENTAL")
          print("CANDIDATE_HEIGHT_GATE=PASS")
          print("GLB_HEADER_AND_NO_STUDIO_FLOOR_GATE=PASS")
          PY

      - name: Optionally run another committed avatar builder
        if: ${{ inputs.builder_script != '' }}
        run: |
          set -euo pipefail
          test -f "${{ inputs.builder_script }}"
          mkdir -p artifacts/builder
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python "${{ inputs.builder_script }}" -- \
            --output-dir "$GITHUB_WORKSPACE/artifacts/builder"

      - name: Run V313 coordinate, skin and morph diagnostic
        run: |
          set -euo pipefail
          mkdir -p artifacts/v313-coordinate-audit
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender36_v313_coordinate_rig_audit.py -- \
            --input "$GITHUB_WORKSPACE/lam-default.glb" \
            --output-dir "$GITHUB_WORKSPACE/artifacts/v313-coordinate-audit"
          test -s artifacts/v313-coordinate-audit/v313-coordinate-rig-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/v313-coordinate-audit/v313-coordinate-rig-audit.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report["mesh_count"] > 0, report
          assert report["all_vertex_coordinates_finite"] is True, report
          print("V313_STRUCTURAL_AUDIT=PASS")
          print(json.dumps({
              "mesh_count": report["mesh_count"],
              "armature_count": report["armature_count"],
              "found_expected_morph_names": report["found_expected_morph_names"],
              "missing_expected_morph_names": report["missing_expected_morph_names"],
              "source_sha256": report["source_sha256"]
          }, ensure_ascii=False, indent=2))
          PY

      - name: Run V313 vertex-weight and bone mapping diagnostic
        run: |
          set -euo pipefail
          mkdir -p artifacts/v313-skin-weight-audit
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender36_v313_skin_weight_audit.py -- \
            --input "$GITHUB_WORKSPACE/lam-default.glb" \
            --output-dir "$GITHUB_WORKSPACE/artifacts/v313-skin-weight-audit"
          test -s artifacts/v313-skin-weight-audit/v313-skin-weight-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/v313-skin-weight-audit/v313-skin-weight-audit.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          assert len(report.get("meshes", [])) > 0, report
          print("V313_SKIN_WEIGHT_DIAGNOSTIC=PASS_DIAGNOSTIC_ONLY")
          print(json.dumps({
              "mesh_count": len(report["meshes"]),
              "bone_count": report["bone_count"],
              "unweighted_meshes": [m["name"] for m in report["meshes"] if m["unweighted_vertex_count"] > 0],
              "meshes_without_armature_modifier": [m["name"] for m in report["meshes"] if not m["armature_modifiers"]],
              "groups_missing_bones": {m["name"]: m["group_names_missing_matching_bone"] for m in report["meshes"] if m["group_names_missing_matching_bone"]}
          }, ensure_ascii=False, indent=2))
          PY

      - name: Run V313 bind-pose spatial diagnostic
        run: |
          set -euo pipefail
          mkdir -p artifacts/v313-bindpose-audit
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender36_v313_bindpose_audit.py -- \
            --input "$GITHUB_WORKSPACE/lam-default.glb" \
            --output-dir "$GITHUB_WORKSPACE/artifacts/v313-bindpose-audit"
          test -s artifacts/v313-bindpose-audit/v313-bindpose-audit.json

      - name: Localize V313 bind-pose anomalies per mesh
        run: |
          set -euo pipefail
          mkdir -p artifacts/v313-mesh-localization
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender36_v313_mesh_localization.py -- \
            --input "$GITHUB_WORKSPACE/lam-default.glb" \
            --output-dir "$GITHUB_WORKSPACE/artifacts/v313-mesh-localization"
          test -s artifacts/v313-mesh-localization/v313-mesh-localization.json

      - name: Audit V313 object transforms and bind relationships
        run: |
          set -euo pipefail
          mkdir -p artifacts/v313-transform-bind-audit
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender36_v313_transform_bind_audit.py -- \
            --input "$GITHUB_WORKSPACE/lam-default.glb" \
            --output-dir "$GITHUB_WORKSPACE/artifacts/v313-transform-bind-audit"
          test -s artifacts/v313-transform-bind-audit/v313-transform-bind-audit.json

      - name: Audit evaluated mesh bounds after skin and armature modifiers
        run: |
          set -euo pipefail
          mkdir -p artifacts/v313-evaluated-mesh-audit
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender36_v313_evaluated_mesh_audit.py -- \
            --input "$GITHUB_WORKSPACE/lam-default.glb" \
            --output-dir "$GITHUB_WORKSPACE/artifacts/v313-evaluated-mesh-audit"
          test -s artifacts/v313-evaluated-mesh-audit/v313-evaluated-mesh-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/v313-evaluated-mesh-audit/v313-evaluated-mesh-audit.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report["status"] == "DIAGNOSTIC_ONLY_NO_MESH_OR_WEIGHT_CHANGES", report
          assert report["source_unchanged"] is True, report
          assert report["mesh_count"] == 85, report
          assert report["armature_count"] == 1, report
          assert report["missing_expected_morphs"] == [], report
          assert all(pair["status"] == "MEASURED" for pair in report["critical_adjacency_pairs"]), report
          print("V313_EVALUATED_MESH_AUDIT=PASS_DIAGNOSTIC_ONLY")
          print(json.dumps({"mesh_count": report["mesh_count"], "source_unchanged": report["source_unchanged"],
            "largest_evaluated_gaps": report["largest_evaluated_gaps"][:8]}, ensure_ascii=False, indent=2))
          PY

      - name: Render unskinned normalized diagnostic to isolate base-mesh gaps
        run: |
          set -euo pipefail
          mkdir -p artifacts/v313-unskinned-diagnostic
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender36_v313_unskinned_diagnostic.py -- \
            --input "$GITHUB_WORKSPACE/lam-default.glb" \
            --output-dir "$GITHUB_WORKSPACE/artifacts/v313-unskinned-diagnostic"
          test -s artifacts/v313-unskinned-diagnostic/v313-unskinned-diagnostic.json
          test -s artifacts/v313-unskinned-diagnostic/unskinned-front.png
          test -s artifacts/v313-unskinned-diagnostic/unskinned-three-quarter.png
          test -s artifacts/v313-unskinned-diagnostic/unskinned-side.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/v313-unskinned-diagnostic/v313-unskinned-diagnostic.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report["status"] == "DIAGNOSTIC_ONLY_NOT_APPROVED", report
          assert report["source_unchanged"] is True, report
          assert report["mesh_count"] == 85, report
          assert report["morph_count"] >= 12, report
          assert abs(report["bounds_after_normalization"]["size"][2] - 1.6) < 0.02, report
          print("V313_UNSKINNED_DIAGNOSTIC=PASS_DIAGNOSTIC_ONLY")
          print(json.dumps({
              "mesh_count": report["mesh_count"],
              "removed_armature_count": report["removed_armature_count"],
              "morph_count": report["morph_count"],
              "normalization_factor": report["normalization_factor"],
              "bounds_after_normalization": report["bounds_after_normalization"],
              "candidate_bytes": report["candidate_bytes"]
          }, ensure_ascii=False, indent=2))
          PY

      - name: Build V317 refined browser-visible candidate and export rigged debug copy
        run: |
          set -euo pipefail
          mkdir -p artifacts/v314-coherent-avatar-candidate
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender36_v314_coherent_avatar_candidate.py -- \
            --output-dir "$GITHUB_WORKSPACE/artifacts/v314-coherent-avatar-candidate"
          test -s artifacts/v314-coherent-avatar-candidate/lam-v314-candidate-report.json
          test -s artifacts/v314-coherent-avatar-candidate/lam-v314-front.png
          test -s artifacts/v314-coherent-avatar-candidate/lam-v314-three-quarter.png
          test -s artifacts/v314-coherent-avatar-candidate/lam-v314-side.png
          test -s artifacts/v314-coherent-avatar-candidate/lam-v316-root-animated-front.png
          test -s artifacts/v314-coherent-avatar-candidate/lam-v316-root-sway-frame13.png
          test -s artifacts/v314-coherent-avatar-candidate/lam-v315-rigged-debug-front.png
          test -s artifacts/v314-coherent-avatar-candidate/lam-v315-rigged-debug-three-quarter.png
          test -s artifacts/v314-coherent-avatar-candidate/lam-v314-coherent-avatar-candidate.glb
          test -s artifacts/v314-coherent-avatar-candidate/lam-v315-rigged-debug-candidate.glb
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/v314-coherent-avatar-candidate/lam-v314-candidate-report.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report["status"] == "EXPERIMENTAL_VISIBLE_ROOT_ANIMATED_CANDIDATE_NOT_APPROVED", report
          assert report["candidate_version"] == "V317", report
          assert report["candidate_skin_count"] == 0, report
          assert report["candidate_animation_count"] == 1, report
          assert "Lam_Idle_GentleSway" in report["candidate_animation_names"], report
          assert report["rig_debug_armature_count"] == 1, report
          assert report["rig_debug_bone_count"] == 17, report
          assert report["rigged_debug_skin_count"] == 1, report
          assert report["rigged_debug_max_tee_deformation_m_frame_1_to_13"] > 0.0001, report
          assert report["missing_expected_morphs"] == [], report
          assert abs(report["candidate_bounds_m"]["size"][2] - 1.60) < 0.04, report
          assert report["candidate_bytes"] > 20000, report
          print("V317_VISIBLE_CANDIDATE=PASS_EXPERIMENTAL_ONLY")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Install isolated Playwright dependencies for candidate browser test
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/v314-playwright" --no-save --package-lock=false playwright pngjs
          "$RUNNER_TEMP/v314-playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: Load the V317 refined visible candidate and verify idle playback in mobile-sized Three.js viewer
        env:
          NODE_PATH: ${{ runner.temp }}/v314-playwright/node_modules
          V314_VIEWER_ROOT: ${{ runner.temp }}/v314-viewer
          V314_VIEWER_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/v314-browser-test
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v314-viewer" artifacts/v314-browser-test
          cp -a v312-work/. "$RUNNER_TEMP/v314-viewer/"
          cp "$GITHUB_WORKSPACE/artifacts/v314-coherent-avatar-candidate/lam-v314-coherent-avatar-candidate.glb" "$RUNNER_TEMP/v314-viewer/lam-default.glb"
          node --check tools/v314_candidate_webgl_smoke.cjs
          node tools/v314_candidate_webgl_smoke.cjs
          test -s artifacts/v314-browser-test/v314-candidate-browser-report.json
          test -s artifacts/v314-browser-test/v314-candidate-browser.png
          test -s artifacts/v314-browser-test/v314-candidate-canvas.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/v314-browser-test/v314-candidate-browser-report.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report["status"] == "PASS_BROWSER_WEBGL_CANDIDATE_ONLY", report
          assert report["state"]["booted"] is True, report
          assert report["state"]["rendererReady"] is True, report
          assert report["state"]["webgl"] is True, report
          assert report["state"]["canvasCount"] == 1, report
          assert "12 morph" in report["state"]["status"], report
          assert report["state"]["activeAnimationName"] == "Lam_Idle_GentleSway", report
          assert report["state"]["animationTime"] > 0.05, report
          assert any(item["status"] == 200 for item in report["glbResponses"]), report
          assert report["pageErrors"] == [], report
          assert report["consoleErrors"] == [], report
          assert report["visualFraming"] is not None, report
          print("V317_BROWSER_WEBGL_AND_IDLE_PLAYBACK=PASS_EXPERIMENTAL_ONLY")
          print(json.dumps({"state": report["state"], "visualFraming": report["visualFraming"],
            "glbResponses": report["glbResponses"],
            "requiredLocalAssetResponses": report["requiredLocalAssetResponses"],
            "failedRequests": report["failedRequests"]}, ensure_ascii=False, indent=2))
          PY

      - name: Control experiment using unskinned normalized source model
        env:
          NODE_PATH: ${{ runner.temp }}/v314-playwright/node_modules
          V314_VIEWER_ROOT: ${{ runner.temp }}/v314-unskinned-viewer
          V314_VIEWER_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/v314-unskinned-browser-control
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v314-unskinned-viewer" artifacts/v314-unskinned-browser-control
          cp -a v312-work/. "$RUNNER_TEMP/v314-unskinned-viewer/"
          cp "$GITHUB_WORKSPACE/artifacts/v313-unskinned-diagnostic/lam-unskinned-normalized-diagnostic.glb" "$RUNNER_TEMP/v314-unskinned-viewer/lam-default.glb"
          node tools/v314_candidate_webgl_smoke.cjs
          test -s artifacts/v314-unskinned-browser-control/v314-candidate-browser-report.json
          test -s artifacts/v314-unskinned-browser-control/v314-candidate-canvas.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/v314-unskinned-browser-control/v314-candidate-browser-report.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report["status"] == "PASS_BROWSER_WEBGL_CANDIDATE_ONLY", report
          assert report["state"]["rendererReady"] is True, report
          assert report["visualFraming"] is not None, report
          print("V313_UNSKINNED_BROWSER_CONTROL=PASS_TECHNICAL_ONLY")
          print(json.dumps({"state": report["state"], "visualFraming": report["visualFraming"]}, ensure_ascii=False, indent=2))
          PY

      - name: Compare V313 rest pose with mesh bounds
        run: |
          set -euo pipefail
          mkdir -p artifacts/v313-rest-pose-comparison
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender36_v313_rest_pose_comparison.py -- \
            --input "$GITHUB_WORKSPACE/lam-default.glb" \
            --output-dir "$GITHUB_WORKSPACE/artifacts/v313-rest-pose-comparison"
          test -s artifacts/v313-rest-pose-comparison/v313-rest-pose-comparison.json

      - name: Map named meshes to expected bone families (heuristic)
        run: |
          set -euo pipefail
          mkdir -p artifacts/v313-named-weight-audit
          "$RUNNER_TEMP/blender/blender" --background --factory-startup --python tools/blender36_v313_named_weight_audit.py -- --input "$GITHUB_WORKSPACE/lam-default.glb" --output-dir "$GITHUB_WORKSPACE/artifacts/v313-named-weight-audit"
          test -s artifacts/v313-named-weight-audit/v313-named-weight-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/v313-named-weight-audit/v313-named-weight-audit.json")
          r = json.loads(p.read_text(encoding="utf-8"))
          assert r["mesh_count"] == 85, r
          assert r["source_sha256"] == "0aa06eb23754d72eec1e7b6db91c72014b0f4dd571dd2625d9d7e6b9c886b37a", r
          print("V313_NAMED_WEIGHT_AUDIT=PASS_DIAGNOSTIC_ONLY")
          print(json.dumps({"mesh_count": r["mesh_count"], "mismatch_count": r["mismatch_count"],
            "mismatches": [{"mesh": x["mesh"], "expected": x["expected_bone_family"],
              "dominant": x["dominant_weight_groups"][0]["bone"] if x["dominant_weight_groups"] else None}
              for x in r["mismatches"]]}, ensure_ascii=False, indent=2))
          PY

      - name: Build isolated V313 facial-weight experiment candidate
        run: |
          set -euo pipefail
          mkdir -p artifacts/v313-face-weight-experiment
          "$RUNNER_TEMP/blender/blender" --background --factory-startup --python tools/blender36_v313_face_weight_experiment.py -- --input "$GITHUB_WORKSPACE/lam-default.glb" --output-dir "$GITHUB_WORKSPACE/artifacts/v313-face-weight-experiment"
          test -s artifacts/v313-face-weight-experiment/face-weight-candidate-front.png
          test -s artifacts/v313-face-weight-experiment/lam-face-weight-experiment.glb
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/v313-face-weight-experiment/face-weight-experiment-report.json")
          r = json.loads(p.read_text(encoding="utf-8"))
          assert r["status"] == "EXPERIMENT_ONLY_NOT_APPROVED", r
          assert r["source_unchanged"] is True, r
          assert len(r["targets"]) == 5, r
          assert r["morph_count"] >= 12, r
          print("V313_FACE_WEIGHT_EXPERIMENT=PASS_DIAGNOSTIC_ONLY")
          print(json.dumps({"targets": r["targets"], "morph_count": r["morph_count"], "source_unchanged": r["source_unchanged"], "candidate_sha256": r["candidate_sha256"]}, ensure_ascii=False, indent=2))
          PY

      - name: Run isolated V313 pose-reset experiment
        run: |
          set -euo pipefail
          mkdir -p artifacts/v313-pose-reset-experiment
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender36_v313_pose_reset_experiment.py -- \
            --input "$GITHUB_WORKSPACE/lam-default.glb" \
            --output-dir "$GITHUB_WORKSPACE/artifacts/v313-pose-reset-experiment"
          test -s artifacts/v313-pose-reset-experiment/pose-reset-experiment-report.json
          test -s artifacts/v313-pose-reset-experiment/pose-reset-front.png
          test -s artifacts/v313-pose-reset-experiment/lam-pose-reset-experiment.glb

      - name: Package V317 experimental Windows preview and SHA-256
        if: success()
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/ly-lam-lam-v317-experimental-stage"
          package="$RUNNER_TEMP/ly-lam-lam-v317-experimental-windows.zip"
          mkdir -p "$stage/v312-work"
          cp -a v312-work/. "$stage/v312-work/"
          cp "artifacts/v314-coherent-avatar-candidate/lam-v314-coherent-avatar-candidate.glb" "$stage/v312-work/lam-default.glb"
          cat > "$stage/v312-work/V317-EXPERIMENTAL-AVATAR.md" <<'MD'
          # V317 Experimental Avatar Preview — Not the Production Avatar

          This separate Windows preview package uses the V317 procedural stylized avatar candidate so the whole figure can be seen in the browser.

          - It is an experimental stylized blockout, not the final photorealistic Lam avatar.
          - The preview candidate intentionally has no skeletal skin. The small `Lam_Idle_GentleSway` clip is a subtle whole-root sway, not joint articulation.
          - Twelve facial morph names are present, but visual quality for each expression is not yet approved.
          - AI conversation/API and voice features are not integrated.
          - This package replaces `lam-default.glb` only inside this ZIP. The original repository GLB remains unchanged.
          - Launch by double-clicking `START-LAM-WINDOWS.bat` after installing Node.js LTS. Keep its console open while using the preview.
          MD
          (
            cd "$stage/v312-work"
            node --check tools/start-windows-preview.cjs
            node tools/start-windows-preview.cjs --check
          )
          python3 - "$stage" "$package" <<'PY'
          import pathlib, sys, zipfile, hashlib
          stage = pathlib.Path(sys.argv[1])
          package = pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(package, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=8) as archive:
              for path in sorted(stage.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(stage).as_posix())
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          package.with_suffix(package.suffix + ".sha256").write_text(
              f"{digest}  {package.name}\n", encoding="ascii"
          )
          with zipfile.ZipFile(package, "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"ZIP integrity failed at {bad}")
              names = archive.namelist()
              for required in (
                  "v312-work/START-LAM-WINDOWS.bat",
                  "v312-work/V317-EXPERIMENTAL-AVATAR.md",
                  "v312-work/lam-default.glb",
                  "v312-work/vendor/three/build/three.module.js",
              ):
                  if required not in names:
                      raise SystemExit(f"Missing package entry: {required}")
          print(f"V317_WINDOWS_PREVIEW_ZIP={package}")
          print(f"V317_WINDOWS_PREVIEW_SHA256={digest}")
          print(f"V317_WINDOWS_PREVIEW_BYTES={package.stat().st_size}")
          print("V317_WINDOWS_PREVIEW_ZIP_INTEGRITY=PASS")
          PY

      - name: Upload V317 experimental Windows preview ZIP and checksum
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ly-lam-lam-v317-experimental-windows-preview-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ly-lam-lam-v317-experimental-windows.zip
            ${{ runner.temp }}/ly-lam-lam-v317-experimental-windows.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload real-model renders, candidate GLB and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender36-avatar-validation
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
