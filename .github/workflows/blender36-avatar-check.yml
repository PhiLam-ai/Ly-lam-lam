name: Blender 3.6 Avatar Validation

on:
  workflow_dispatch:
    inputs:
      builder_script:
        description: "Optional path to an additional avatar builder .py already committed to the repository"
        required: false
        type: string
        default: ""
  push:
    paths:
      - ".github/workflows/blender36-avatar-check.yml"
      - "tools/blender36_smoke_test.py"
      - "tools/lam_step1_body_builder.py"
      - "tools/avatar-builder.py"

permissions:
  contents: read

concurrency:
  group: blender36-avatar-check
  cancel-in-progress: true

jobs:
  blender36-headless:
    name: Blender 3.6 headless smoke test and Step 1 body validation
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils libxi6 libxrender1 libxfixes3 \
            libxkbcommon0 libsm6 libgl1 libegl1 libx11-6 libxxf86vm1 \
            libxcb1 libxext6 libdbus-1-3
          sudo rm -rf /var/lib/apt/lists/*

      - name: Download pinned Blender 3.6 LTS
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://download.blender.org/release/Blender3.6/blender-3.6.23-linux-x64.tar.xz \
            --output /tmp/blender.tar.xz
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf /tmp/blender.tar.xz -C "$RUNNER_TEMP/blender" --strip-components=1
          "$RUNNER_TEMP/blender/blender" --background --factory-startup --python-expr \
            "import bpy; print('BLENDER_VERSION=' + bpy.app.version_string)"
          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"

      - name: Run diagnostic Blender smoke test (render + GLB export)
        run: |
          set -euo pipefail
          mkdir -p artifacts/smoke-test
          "$RUNNER_TEMP/blender/blender" --background --factory-startup --python-exit-code 1 \
            --python tools/blender36_smoke_test.py -- \
            --output-dir "$GITHUB_WORKSPACE/artifacts/smoke-test"

      - name: Build and validate Lam Step 1 unified base body
        run: |
          set -euo pipefail
          mkdir -p artifacts/step1-body
          "$RUNNER_TEMP/blender/blender" --background --factory-startup --python-exit-code 1 \
            --python tools/lam_step1_body_builder.py -- \
            --output-dir "$GITHUB_WORKSPACE/artifacts/step1-body"

      - name: Optionally run an additional committed avatar builder
        if: ${{ inputs.builder_script != '' }}
        run: |
          set -euo pipefail
          test -f "${{ inputs.builder_script }}"
          mkdir -p artifacts/additional-builder
          "$RUNNER_TEMP/blender/blender" --background --factory-startup --python-exit-code 1 \
            --python "${{ inputs.builder_script }}" -- \
            --output-dir "$GITHUB_WORKSPACE/artifacts/additional-builder"

      - name: Generate automatic test report
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("artifacts")
          out = root / "automatic-test-report.md"
          status = os.environ.get("JOB_STATUS", "unknown").upper()
          lines = [
              "# LÝ LÂM LAM — Báo cáo kiểm thử tự động", "",
              f"- **Kết quả tổng thể:** {status}",
              f"- **Workflow run:** #{os.environ.get('RUN_NUMBER', '?')}",
              f"- **Nhánh:** {os.environ.get('BRANCH_NAME', '?')}",
              f"- **Sự kiện:** {os.environ.get('EVENT_NAME', '?')}",
              f"- **Commit:** `{os.environ.get('COMMIT_SHA', '?')}`",
              f"- **Chi tiết lần chạy:** {os.environ.get('RUN_URL', '')}", "",
              "## Tệp đầu ra đã tạo",
          ]
          files = sorted(p for p in root.rglob("*") if p.is_file() and p != out)
          if files:
              for p in files:
                  lines.append(f"- `{p.as_posix()}` — {p.stat().st_size:,} byte")
          else:
              lines.append("- Chưa có tệp đầu ra nào được tạo; xem log workflow để biết bước lỗi.")
          lines += ["", "## Báo cáo JSON", ""]
          reports = sorted(p for p in root.rglob("*.json") if p != out)
          if reports:
              for p in reports:
                  lines.append(f"### `{p.as_posix()}`")
                  try:
                      data = json.loads(p.read_text(encoding="utf-8"))
                      if isinstance(data, dict):
                          for k, v in data.items():
                              if isinstance(v, (str, int, float, bool)) or v is None:
                                  lines.append(f"- **{k}:** {v}")
                          if not data: lines.append("- JSON hợp lệ nhưng không có trường dữ liệu.")
                      else: lines.append(f"- JSON hợp lệ; kiểu dữ liệu gốc: {type(data).__name__}.")
                  except Exception as exc: lines.append(f"- Không đọc được JSON: {exc}")
                  lines.append("")
          else:
              lines.append("Chưa tìm thấy báo cáo JSON.")
          lines += ["", "## Lưu ý",
                    "- Báo cáo này phản ánh trạng thái job của GitHub Actions và các tệp thực tế được tạo.",
                    "- PASS không đồng nghĩa avatar đã hoàn thiện hoặc đã chạy ổn định trên iPhone; cần kiểm tra riêng việc hiển thị trên trình duyệt."]
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text(out.read_text(encoding="utf-8"), encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Upload render, GLB, blend and diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender36-avatar-validation
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
