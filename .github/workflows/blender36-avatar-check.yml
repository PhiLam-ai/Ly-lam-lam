name: Blender 3.6 Avatar Validation

on:
  workflow_dispatch:
    inputs:
      builder_script:
        description: "Optional path to an avatar builder .py already committed to the repository"
        required: false
        type: string
        default: ""
  push:
    paths:
      - ".github/workflows/blender36-avatar-check.yml"
      - "tools/blender36_smoke_test.py"
      - "tools/blender36_model_audit.py"
      - "tools/blender36_arm_alignment_candidate.py"
      - "tools/blender36_geometry_gap_audit.py"
      - "tools/blender36_coherent_body_candidate.py"
      - "tools/blender36_v313_coordinate_rig_audit.py"
      - "tools/blender36_v313_skin_weight_audit.py"
      - "tools/blender36_v313_bindpose_audit.py"
      - "tools/avatar-builder.py"
      - "lam-default.glb"

permissions:
  contents: read

concurrency:
  group: blender36-avatar-check
  cancel-in-progress: true

jobs:
  blender36-headless:
    name: Blender 3.6 real model audit
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils libxi6 libxrender1 libxfixes3 \
            libxkbcommon0 libsm6 libgl1 libegl1 libx11-6 libxxf86vm1 \
            libxcb1 libxext6 libdbus-1-3
          sudo rm -rf /var/lib/apt/lists/*

      - name: Download pinned Blender 3.6 LTS
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://download.blender.org/release/Blender3.6/blender-3.6.23-linux-x64.tar.xz \
            --output /tmp/blender.tar.xz
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf /tmp/blender.tar.xz -C "$RUNNER_TEMP/blender" --strip-components=1
          "$RUNNER_TEMP/blender/blender" --background --factory-startup --python-expr \
            "import bpy; print('BLENDER_VERSION=' + bpy.app.version_string)"
          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"

      - name: Run real Lam GLB audit, render three views, and round-trip export
        run: |
          set -euo pipefail
          mkdir -p artifacts/model-audit
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender36_model_audit.py -- \
            --input "$GITHUB_WORKSPACE/lam-default.glb" \
            --output-dir "$GITHUB_WORKSPACE/artifacts/model-audit"
          test -s artifacts/model-audit/blender36-model-audit.json
          test -s artifacts/model-audit/lam-default-front.png
          test -s artifacts/model-audit/lam-default-side.png
          test -s artifacts/model-audit/lam-default-three-quarter.png
          test -s artifacts/model-audit/lam-default-roundtrip.glb
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/model-audit/blender36-model-audit.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report.get("status") == "PASS", report
          assert report.get("source_unchanged") is True, report
          assert report.get("mesh_count", 0) > 0, report
          print("REAL_MODEL_AUDIT_GATE=PASS")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Audit body-part adjacency using world-space bounds
        run: |
          set -euo pipefail
          mkdir -p artifacts/geometry-gap-audit
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender36_geometry_gap_audit.py -- \
            --input "$GITHUB_WORKSPACE/lam-default.glb" \
            --output-dir "$GITHUB_WORKSPACE/artifacts/geometry-gap-audit"
          test -s artifacts/geometry-gap-audit/geometry-gap-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/geometry-gap-audit/geometry-gap-audit.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report["mesh_count"] > 0, report
          assert all(x["status"] == "MEASURED" for x in report["pairs"]), report
          print("GEOMETRY_GAP_AUDIT=PASS_DIAGNOSTIC_ONLY")
          PY

      - name: Run isolated smoke test
        run: |
          set -euo pipefail
          mkdir -p artifacts/smoke-test
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender36_smoke_test.py -- \
            --output-dir "$GITHUB_WORKSPACE/artifacts/smoke-test"

      - name: Build isolated experimental arm-alignment candidate
        run: |
          set -euo pipefail
          mkdir -p artifacts/arm-alignment-candidate
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender36_arm_alignment_candidate.py -- \
            --output-dir "$GITHUB_WORKSPACE/artifacts/arm-alignment-candidate"
          test -s artifacts/arm-alignment-candidate/lam-arm-alignment-candidate.glb
          test -s artifacts/arm-alignment-candidate/arm-alignment-candidate-front.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/arm-alignment-candidate/arm-alignment-candidate-report.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report["source_unchanged"] is True, report
          assert report["candidate_bytes"] > 1024, report
          print("ARM_ALIGNMENT_CANDIDATE_EXPORTED=PASS")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Build isolated coherent-body prototype candidate
        run: |
          set -euo pipefail
          mkdir -p artifacts/coherent-body-candidate
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender36_coherent_body_candidate.py -- \
            --output-dir "$GITHUB_WORKSPACE/artifacts/coherent-body-candidate"
          test -s artifacts/coherent-body-candidate/lam-coherent-body-candidate.glb
          test -s artifacts/coherent-body-candidate/coherent-body-front.png
          test -s artifacts/coherent-body-candidate/coherent-body-three-quarter.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/coherent-body-candidate/coherent-body-candidate.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report["status"] == "EXPERIMENTAL_CANDIDATE_NOT_APPROVED", report
          assert report["bytes"] > 1024, report
          height = report.get("measured_bounds_m", {}).get("size", [0, 0, 0])[2]
          assert abs(height - 1.60) < 0.03, report
          # Inspect the actual GLB JSON chunk: the studio floor must not ship with the character.
          import struct
          glb = Path("artifacts/coherent-body-candidate/lam-coherent-body-candidate.glb").read_bytes()
          assert glb[:4] == b"glTF" and struct.unpack_from("<I", glb, 4)[0] == 2, "Invalid GLB header"
          chunk_len, chunk_type = struct.unpack_from("<II", glb, 12)
          assert chunk_type == 0x4E4F534A, "First GLB chunk is not JSON"
          doc = json.loads(glb[20:20 + chunk_len].decode("utf-8"))
          names = [node.get("name", "") for node in doc.get("nodes", [])]
          assert "StudioFloor" not in names, "Studio floor leaked into candidate GLB"
          print("COHERENT_BODY_CANDIDATE_EXPORTED=PASS_EXPERIMENTAL")
          print("CANDIDATE_HEIGHT_GATE=PASS")
          print("GLB_HEADER_AND_NO_STUDIO_FLOOR_GATE=PASS")
          PY

      - name: Optionally run another committed avatar builder
        if: ${{ inputs.builder_script != '' }}
        run: |
          set -euo pipefail
          test -f "${{ inputs.builder_script }}"
          mkdir -p artifacts/builder
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python "${{ inputs.builder_script }}" -- \
            --output-dir "$GITHUB_WORKSPACE/artifacts/builder"

      - name: Run V313 coordinate, skin and morph diagnostic
        run: |
          set -euo pipefail
          mkdir -p artifacts/v313-coordinate-audit
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender36_v313_coordinate_rig_audit.py -- \
            --input "$GITHUB_WORKSPACE/lam-default.glb" \
            --output-dir "$GITHUB_WORKSPACE/artifacts/v313-coordinate-audit"
          test -s artifacts/v313-coordinate-audit/v313-coordinate-rig-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/v313-coordinate-audit/v313-coordinate-rig-audit.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report["mesh_count"] > 0, report
          assert report["all_vertex_coordinates_finite"] is True, report
          print("V313_STRUCTURAL_AUDIT=PASS")
          print(json.dumps({
              "mesh_count": report["mesh_count"],
              "armature_count": report["armature_count"],
              "found_expected_morph_names": report["found_expected_morph_names"],
              "missing_expected_morph_names": report["missing_expected_morph_names"],
              "source_sha256": report["source_sha256"]
          }, ensure_ascii=False, indent=2))
          PY

      - name: Run V313 vertex-weight and bone mapping diagnostic
        run: |
          set -euo pipefail
          mkdir -p artifacts/v313-skin-weight-audit
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender36_v313_skin_weight_audit.py -- \
            --input "$GITHUB_WORKSPACE/lam-default.glb" \
            --output-dir "$GITHUB_WORKSPACE/artifacts/v313-skin-weight-audit"
          test -s artifacts/v313-skin-weight-audit/v313-skin-weight-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/v313-skin-weight-audit/v313-skin-weight-audit.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          assert len(report.get("meshes", [])) > 0, report
          print("V313_SKIN_WEIGHT_DIAGNOSTIC=PASS_DIAGNOSTIC_ONLY")
          print(json.dumps({
              "mesh_count": len(report["meshes"]),
              "bone_count": report["bone_count"],
              "unweighted_meshes": [m["name"] for m in report["meshes"] if m["unweighted_vertex_count"] > 0],
              "meshes_without_armature_modifier": [m["name"] for m in report["meshes"] if not m["armature_modifiers"]],
              "groups_missing_bones": {m["name"]: m["group_names_missing_matching_bone"] for m in report["meshes"] if m["group_names_missing_matching_bone"]}
          }, ensure_ascii=False, indent=2))
          PY

      - name: Run V313 bind-pose spatial diagnostic
        run: |
          set -euo pipefail
          mkdir -p artifacts/v313-bindpose-audit
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender36_v313_bindpose_audit.py -- \
            --input "$GITHUB_WORKSPACE/lam-default.glb" \
            --output-dir "$GITHUB_WORKSPACE/artifacts/v313-bindpose-audit"
          test -s artifacts/v313-bindpose-audit/v313-bindpose-audit.json

      - name: Upload real-model renders, candidate GLB and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender36-avatar-validation
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
