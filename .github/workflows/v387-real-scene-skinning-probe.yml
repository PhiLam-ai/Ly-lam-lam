name: V387 Real Scene Skinning Probe

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful V386 build run ID containing the candidate .blend"
        required: true
        type: string
        default: "38997553610"

permissions:
  actions: read
  contents: read

jobs:
  probe-source-scene:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out V387 prototype
        uses: actions/checkout@v4
        with:
          ref: avatar/v387-rig-preserving-export-prototype

      - name: Download V386 candidate artifact
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: ly-lam-lam-v386-r9-profile-integrated-overlap-*
          path: source-artifact
          merge-multiple: true

      - name: Locate candidate scene
        id: scene
        shell: bash
        run: |
          set -euo pipefail
          scene="$(find source-artifact -type f -name 'lam-v386-gltf-materials-full-face-candidate.blend' -print -quit)"
          test -n "$scene"
          echo "path=$scene" >> "$GITHUB_OUTPUT"
          echo "Found candidate scene: $scene"

      - name: Install Blender 4.5.3 LTS
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl xz-utils libxrender1 libxi6 libxkbcommon0 libsm6 libgl1 libegl1
          curl --fail --location --retry 3 \
            https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz \
            --output /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C /tmp
          echo "/tmp/blender-4.5.3-linux-x64" >> "$GITHUB_PATH"
          /tmp/blender-4.5.3-linux-x64/blender --version | head -n 3

      - name: Audit source scene without modifying it
        shell: bash
        run: |
          set -euo pipefail
          blender --background "${{ steps.scene.outputs.path }}" \
            --python tools/probe_blend_skinning_v387.py -- \
            --output "$GITHUB_WORKSPACE/v387-source-scene-skinning-probe.json"

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v387-source-scene-skinning-probe-${{ inputs.source_run_id }}
          path: v387-source-scene-skinning-probe.json
          if-no-files-found: warn
          retention-days: 14
