name: Free TripoSR CPU detailed-head experiment

on:
  push:
    branches:
      - experiment/github-auto-avatar
    paths:
      - ".github/workflows/try-triposr-face-detail-cpu.yml"
      - "references/lam-reference.png.png"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lam-triposr-face-detail-cpu
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout experiment branch only
        uses: actions/checkout@v4
        with:
          ref: experiment/github-auto-avatar

      - name: Crop the dedicated face panel from the reference sheet
        run: |
          python -m pip install --upgrade pillow
          python - <<'PY'
          import os
          from PIL import Image
          src = "references/lam-reference.png.png"
          im = Image.open(src).convert("RGB")
          print("REFERENCE_SIZE=%s" % (im.size,))
          if im.width < 900 or im.height < 1400:
              raise SystemExit("The multi-view reference sheet is smaller than expected.")
          # Crop only the close-up face panel, excluding its border and caption.
          face = im.crop((666, 503, 994, 689))
          if face.width < 300 or face.height < 170:
              raise SystemExit("Face detail crop validation failed.")
          os.makedirs("output", exist_ok=True)
          out = "output/lam-face-detail-reference.png"
          face.save(out)
          print("FACE_DETAIL_REFERENCE_OK=1")
          print("FACE_DETAIL_SIZE=%s" % (face.size,))
          PY

      - name: Install headless OpenGL display for texture baking
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libgl1-mesa-glx

      - name: Install TripoSR and CPU dependencies
        run: |
          git clone --depth 1 https://github.com/VAST-AI-Research/TripoSR.git /tmp/TripoSR
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install "numpy<2" "cmake<4" ninja scikit-build-core pybind11 "huggingface-hub==0.25.2"
          python -m pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu
          grep -vE 'torchmcubes|^gradio' /tmp/TripoSR/requirements.txt > /tmp/triposr-requirements.txt
          python -m pip install -r /tmp/triposr-requirements.txt
          python -m pip install "numpy==1.26.4" "opencv-python-headless==4.10.0.84" "huggingface-hub==0.25.2" pybind11 "onnxruntime==1.20.1"
          export CMAKE_PREFIX_PATH="$(python -m pybind11 --cmakedir):${CMAKE_PREFIX_PATH:-}"
          python -m pip install --no-build-isolation git+https://github.com/tatsy/torchmcubes.git
          python -m pip install trimesh pillow pygltflib
          python - <<'PY'
          import numpy, torch, cv2, transformers
          print("NUMPY_VERSION=" + numpy.__version__)
          print("TORCH_VERSION=" + torch.__version__)
          print("OPENCV_VERSION=" + cv2.__version__)
          print("TRANSFORMERS_VERSION=" + transformers.__version__)
          PY

      - name: Generate a dedicated head candidate on CPU
        run: |
          mkdir -p output/triposr-face-detail
          cd /tmp/TripoSR
          xvfb-run -a -s "-screen 0 1024x768x24" python run.py /home/runner/work/Ly-lam-lam/Ly-lam-lam/output/lam-face-detail-reference.png \
            --output-dir /home/runner/work/Ly-lam-lam/Ly-lam-lam/output/triposr-face-detail \
            --device cpu --mc-resolution 256 --model-save-format obj --bake-texture --texture-resolution 2048
          echo "TRIPOSR_FACE_DETAIL_RUN_COMPLETE=1"

      - name: Convert to upright textured GLB and validate output
        run: |
          python - <<'PY'
          import os, glob, json, math
          import trimesh
          from PIL import Image
          root = "output/triposr-face-detail"
          objs = glob.glob(root + "/**/*.obj", recursive=True)
          textures = glob.glob(root + "/**/texture.png", recursive=True)
          if not objs:
              raise SystemExit("No face-detail OBJ mesh produced.")
          if not textures:
              raise SystemExit("No baked face-detail texture.png produced.")
          loaded = trimesh.load(objs[0], force="scene", process=False)
          if not loaded.geometry:
              raise SystemExit("Face-detail OBJ has no geometry.")
          texture = Image.open(textures[0]).convert("RGBA")
          for mesh in loaded.geometry.values():
              uv = getattr(mesh.visual, "uv", None)
              if uv is None or len(uv) != len(mesh.vertices):
                  raise SystemExit("Face-detail OBJ UV coordinates are missing.")
              mesh.apply_transform(trimesh.transformations.rotation_matrix(math.pi, [0, 1, 0]))
              mat = trimesh.visual.material.PBRMaterial(
                  name="Lam TripoSR face-detail baked texture",
                  baseColorTexture=texture.copy(),
                  metallicFactor=0.0,
                  roughnessFactor=0.85,
                  alphaMode="OPAQUE",
              )
              mesh.visual = trimesh.visual.texture.TextureVisuals(uv=uv, material=mat)
          out = "output/lam-triposr-face-detail-candidate.glb"
          loaded.export(out)
          check = trimesh.load(out, force="scene", process=False)
          meshes = [g for g in check.geometry.values() if isinstance(g, trimesh.Trimesh)]
          if not meshes:
              raise SystemExit("GLB validation failed: no face-detail mesh.")
          vertices = sum(len(m.vertices) for m in meshes)
          faces = sum(len(m.faces) for m in meshes)
          sizes = []
          for mesh in meshes:
              mat = getattr(mesh.visual, "material", None)
              img = getattr(mat, "baseColorTexture", None) if mat else None
              sizes.append(list(img.size) if img is not None else None)
          if vertices < 10000 or faces < 10000:
              raise SystemExit("Face-detail mesh below minimum geometry thresholds.")
          if not all(size and size[0] >= 1024 and size[1] >= 1024 for size in sizes):
              raise SystemExit("Embedded face-detail texture missing or below 1024x1024: " + str(sizes))
          if os.path.getsize(out) < 1024:
              raise SystemExit("Face-detail GLB file too small.")
          print("FACE_DETAIL_GLB_VALID=1")
          print("GLB_BYTES=" + str(os.path.getsize(out)))
          print("VERTICES=" + str(vertices))
          print("FACES=" + str(faces))
          print("BOUNDS=" + json.dumps(check.bounds.tolist() if check.bounds is not None else None))
          print("EMBEDDED_TEXTURE_SIZES=" + json.dumps(sizes))
          print("ORIENTATION_FIX=rotate_y_180_degrees")
          PY

      - name: Upload detailed-head candidate only; never touch production avatar
        uses: actions/upload-artifact@v4
        with:
          name: lam-triposr-face-detail-candidate
          path: |
            output/lam-face-detail-reference.png
            output/triposr-face-detail/
            output/lam-triposr-face-detail-candidate.glb
          if-no-files-found: error
          retention-days: 14
