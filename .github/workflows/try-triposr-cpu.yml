name: Free TripoSR CPU avatar experiment

on:
  push:
    branches:
      - experiment/github-auto-avatar
    paths:
      - ".github/workflows/try-triposr-cpu.yml"
      - "references/lam-face-reference.jpg"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lam-triposr-cpu-experiment
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Checkout experiment branch only
        uses: actions/checkout@v4
        with:
          ref: experiment/github-auto-avatar

      - name: Verify locked Lam face reference
        run: |
          python -m pip install --upgrade pillow
          python - <<'PY'
          from PIL import Image
          p = "references/lam-face-reference.jpg"
          im = Image.open(p)
          im.verify()
          im = Image.open(p)
          print("REFERENCE_OK=1")
          print("REFERENCE_SIZE=%s" % (im.size,))
          PY

      - name: Install TripoSR and CPU dependencies
        run: |
          git clone --depth 1 https://github.com/VAST-AI-Research/TripoSR.git /tmp/TripoSR
          python -m pip install --upgrade pip wheel setuptools
          # Pin a mature CPU PyTorch/NumPy pair compatible with this older TripoSR codebase.
          python -m pip install "numpy<2" cmake ninja scikit-build-core "huggingface-hub==0.25.2"
          python -m pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu
          # Build torchmcubes without build isolation so its build can see the installed PyTorch.
          # Gradio is not needed by run.py; omit it to reduce unrelated dependency conflicts.
          grep -vE 'torchmcubes|^gradio' /tmp/TripoSR/requirements.txt > /tmp/triposr-requirements.txt
          python -m pip install -r /tmp/triposr-requirements.txt
          python -m pip install --no-build-isolation git+https://github.com/tatsy/torchmcubes.git
          python -m pip install trimesh pillow pygltflib

      - name: Generate a real volumetric mesh on CPU
        run: |
          mkdir -p output/triposr
          cd /tmp/TripoSR
          python run.py /home/runner/work/Ly-lam-lam/Ly-lam-lam/references/lam-face-reference.jpg \
            --output-dir /home/runner/work/Ly-lam-lam/Ly-lam-lam/output/triposr \
            --device cpu --mc-resolution 128 --model-save-format obj --bake-texture --texture-resolution 1024
          echo "TRIPOSR_RUN_COMPLETE=1"

      - name: Convert textured OBJ to GLB and validate output
        run: |
          python - <<'PY'
          import os, glob, json
          import trimesh
          root = "output/triposr"
          objs = glob.glob(root + "/**/*.obj", recursive=True)
          if not objs:
              raise SystemExit("No OBJ mesh produced by TripoSR.")
          obj = objs[0]
          loaded = trimesh.load(obj, force="scene", process=False)
          if not loaded.geometry:
              raise SystemExit("TripoSR OBJ contains no geometry.")
          out = "output/lam-triposr-cpu-candidate.glb"
          loaded.export(out)
          check = trimesh.load(out, force="scene", process=False)
          meshes = [g for g in check.geometry.values() if isinstance(g, trimesh.Trimesh)]
          if not meshes:
              raise SystemExit("GLB validation failed: no mesh.")
          vertices = sum(len(m.vertices) for m in meshes)
          faces = sum(len(m.faces) for m in meshes)
          bounds = check.bounds.tolist() if check.bounds is not None else None
          if vertices < 1000 or faces < 1000:
              raise SystemExit("GLB geometry below minimum sanity thresholds.")
          if os.path.getsize(out) < 1024:
              raise SystemExit("GLB file too small.")
          print("GLB_VALID=1")
          print("GLB_BYTES=" + str(os.path.getsize(out)))
          print("VERTICES=" + str(vertices))
          print("FACES=" + str(faces))
          print("BOUNDS=" + json.dumps(bounds))
          print("SOURCE_OBJ=" + obj)
          print("TEXTURE_FILES=" + json.dumps(glob.glob(root + "/**/*.png", recursive=True)))
          print("MATERIALS=" + str([getattr(m.visual, "material", None).__class__.__name__ for m in meshes]))
          PY

      - name: Upload candidate only; never touch production avatar
        uses: actions/upload-artifact@v4
        with:
          name: lam-triposr-cpu-candidate
          path: |
            output/triposr/
            output/lam-triposr-cpu-candidate.glb
          if-no-files-found: error
          retention-days: 14
