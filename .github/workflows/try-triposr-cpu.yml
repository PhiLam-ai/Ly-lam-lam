name: Free TripoSR CPU avatar experiment

on:
  push:
    branches:
      - experiment/github-auto-avatar
    paths:
      - ".github/workflows/try-triposr-cpu.yml"
      - "references/lam-face-reference.jpg"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lam-triposr-cpu-experiment
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Checkout experiment branch only
        uses: actions/checkout@v4
        with:
          ref: experiment/github-auto-avatar

      - name: Verify locked Lam face reference
        run: |
          python -m pip install --upgrade pillow
          python - <<'PY'
          from PIL import Image
          p = "references/lam-face-reference.jpg"
          im = Image.open(p)
          im.verify()
          im = Image.open(p)
          print("REFERENCE_OK=1")
          print("REFERENCE_SIZE=%s" % (im.size,))
          PY

      - name: Install headless OpenGL display for texture baking
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libgl1-mesa-glx

      - name: Install TripoSR and CPU dependencies
        run: |
          git clone --depth 1 https://github.com/VAST-AI-Research/TripoSR.git /tmp/TripoSR
          python -m pip install --upgrade pip wheel setuptools
          # Pin a mature CPU PyTorch/NumPy pair compatible with this older TripoSR codebase.
          python -m pip install "numpy<2" "cmake<4" ninja scikit-build-core pybind11 "huggingface-hub==0.25.2"
          python -m pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu
          # Build torchmcubes without build isolation so its build can see the installed PyTorch.
          # Gradio is not needed by run.py; omit it to reduce unrelated dependency conflicts.
          grep -vE 'torchmcubes|^gradio' /tmp/TripoSR/requirements.txt > /tmp/triposr-requirements.txt
          python -m pip install -r /tmp/triposr-requirements.txt
          # Some unconstrained transitive packages select NumPy 2/OpenCV 5; restore
          # the compatible NumPy 1.x + OpenCV 4 pair after installing TripoSR deps.
          python -m pip install "numpy==1.26.4" "opencv-python-headless==4.10.0.84" "huggingface-hub==0.25.2" pybind11 "onnxruntime==1.20.1"
          export CMAKE_PREFIX_PATH="$(python -m pybind11 --cmakedir):${CMAKE_PREFIX_PATH:-}"
          python -m pip install --no-build-isolation git+https://github.com/tatsy/torchmcubes.git
          python -m pip install trimesh pillow pygltflib
          python - <<'PY'
          import numpy, torch, cv2, transformers
          print("NUMPY_VERSION=" + numpy.__version__)
          print("TORCH_VERSION=" + torch.__version__)
          print("OPENCV_VERSION=" + cv2.__version__)
          print("TRANSFORMERS_VERSION=" + transformers.__version__)
          PY

      - name: Generate a real volumetric mesh on CPU
        run: |
          mkdir -p output/triposr
          cd /tmp/TripoSR
          xvfb-run -a -s "-screen 0 1024x768x24" python run.py /home/runner/work/Ly-lam-lam/Ly-lam-lam/references/lam-face-reference.jpg \
            --output-dir /home/runner/work/Ly-lam-lam/Ly-lam-lam/output/triposr \
            --device cpu --mc-resolution 128 --model-save-format obj --bake-texture --texture-resolution 1024
          echo "TRIPOSR_RUN_COMPLETE=1"

      - name: Convert textured OBJ to GLB and validate output
        run: |
          python - <<'PY'
          import os, glob, json, math
          import trimesh
          from PIL import Image
          root = "output/triposr"
          objs = glob.glob(root + "/**/*.obj", recursive=True)
          textures = glob.glob(root + "/**/texture.png", recursive=True)
          if not objs:
              raise SystemExit("No OBJ mesh produced by TripoSR.")
          if not textures:
              raise SystemExit("TripoSR did not produce a baked texture.png.")
          obj = objs[0]
          texture_path = textures[0]
          loaded = trimesh.load(obj, force="scene", process=False)
          if not loaded.geometry:
              raise SystemExit("TripoSR OBJ contains no geometry.")
          texture = Image.open(texture_path).convert("RGBA")
          for mesh in loaded.geometry.values():
              uv = getattr(mesh.visual, "uv", None)
              if uv is None or len(uv) != len(mesh.vertices):
                  raise SystemExit("OBJ UV coordinates are missing or do not match vertices.")
              # TripoSR's mesh comes out upside-down in the Z-up viewer convention.
              # Rotate around the width axis so the head is upright while preserving left/right UV placement.
              mesh.apply_transform(trimesh.transformations.rotation_matrix(math.pi, [0, 1, 0]))
              material = trimesh.visual.material.PBRMaterial(
                  name="Lam TripoSR baked texture",
                  baseColorTexture=texture.copy(),
                  metallicFactor=0.0,
                  roughnessFactor=0.85,
                  alphaMode="OPAQUE",
              )
              mesh.visual = trimesh.visual.texture.TextureVisuals(uv=uv, material=material)
          out = "output/lam-triposr-cpu-candidate.glb"
          loaded.export(out)
          check = trimesh.load(out, force="scene", process=False)
          meshes = [g for g in check.geometry.values() if isinstance(g, trimesh.Trimesh)]
          if not meshes:
              raise SystemExit("GLB validation failed: no mesh.")
          vertices = sum(len(m.vertices) for m in meshes)
          faces = sum(len(m.faces) for m in meshes)
          bounds = check.bounds.tolist() if check.bounds is not None else None
          sizes = []
          for mesh in meshes:
              mat = getattr(mesh.visual, "material", None)
              img = getattr(mat, "baseColorTexture", None) if mat else None
              sizes.append(list(img.size) if img is not None else None)
          if vertices < 1000 or faces < 1000:
              raise SystemExit("GLB geometry below minimum sanity thresholds.")
          if not all(size and size[0] >= 512 and size[1] >= 512 for size in sizes):
              raise SystemExit("Embedded texture missing or too small after GLB export: " + str(sizes))
          if os.path.getsize(out) < 1024:
              raise SystemExit("GLB file too small.")
          print("GLB_VALID=1")
          print("GLB_BYTES=" + str(os.path.getsize(out)))
          print("VERTICES=" + str(vertices))
          print("FACES=" + str(faces))
          print("BOUNDS=" + json.dumps(bounds))
          print("SOURCE_OBJ=" + obj)
          print("SOURCE_TEXTURE=" + texture_path)
          print("ORIENTATION_FIX=rotate_y_180_degrees")
          print("EMBEDDED_TEXTURE_SIZES=" + json.dumps(sizes))
          print("MATERIALS=" + str([getattr(m.visual, "material", None).__class__.__name__ for m in meshes]))
          PY

      - name: Upload candidate only; never touch production avatar
        uses: actions/upload-artifact@v4
        with:
          name: lam-triposr-cpu-candidate
          path: |
            output/triposr/
            output/lam-triposr-cpu-candidate.glb
          if-no-files-found: error
          retention-days: 14
