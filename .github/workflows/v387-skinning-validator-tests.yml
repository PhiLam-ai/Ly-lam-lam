name: V387 Skinning Validator Unit Tests

on:
  push:
    branches:
      - avatar/v387-skinning-prototype
    paths:
      - "tools/validate_gltf_skinning_v387.py"
      - "tools/test_validate_gltf_skinning_v387.py"
      - ".github/workflows/v387-skinning-validator-tests.yml"
  pull_request:
    paths:
      - "tools/validate_gltf_skinning_v387.py"
      - "tools/test_validate_gltf_skinning_v387.py"
      - ".github/workflows/v387-skinning-validator-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Test glTF skinning validator
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validator unit tests
        run: python -m unittest discover -s tools -p 'test_validate_gltf_skinning_v387.py' -v
