      - name: Install browser-test dependencies
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/v314-playwright" --no-save --package-lock=false playwright pngjs
          "$RUNNER_TEMP/v314-playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: Check V370 GLB in mobile-sized Three.js viewer
        env:
          NODE_PATH: ${{ runner.temp }}/v314-playwright/node_modules
          V314_VIEWER_ROOT: ${{ runner.temp }}/v370-viewer
          V314_VIEWER_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/v370-browser-test
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v370-viewer" artifacts/v370-browser-test
          cp -a v312-work/. "$RUNNER_TEMP/v370-viewer/"
          cp artifacts/v370-gltf-face-accessories/lam-v370-gltf-materials-full-face-candidate.glb "$RUNNER_TEMP/v370-viewer/lam-default.glb"
          node --check tools/v352_apply_viewer_fill_lighting.cjs
          V352_VIEWER_ROOT="$RUNNER_TEMP/v370-viewer" \
            V352_PATCH_REPORT_PATH="$GITHUB_WORKSPACE/artifacts/v370-browser-test/viewer-lighting-patch-report.json" \
            node tools/v352_apply_viewer_fill_lighting.cjs
          cp "$RUNNER_TEMP/v370-viewer/index.html" artifacts/v370-browser-test/index-v370-experimental-lighting.html
          node --check tools/v314_candidate_webgl_smoke.cjs
          node tools/v314_candidate_webgl_smoke.cjs
          test -s artifacts/v370-browser-test/v314-candidate-browser-report.json
          test -s artifacts/v370-browser-test/v314-candidate-canvas.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/v370-browser-test/v314-candidate-browser-report.json").read_text(encoding="utf-8"))
          assert report["status"] == "PASS_BROWSER_WEBGL_CANDIDATE_ONLY", report
          assert report["state"]["booted"] is True, report
          assert report["state"]["rendererReady"] is True, report
          assert report["state"]["webgl"] is True, report
          assert report["state"]["activeAnimationName"] == "Lam_Idle_GentleSway", report
          assert report["state"]["animationTime"] > 0.05, report
          assert report["pageErrors"] == [] and report["consoleErrors"] == [], report
          patch = json.loads(Path("artifacts/v370-browser-test/viewer-lighting-patch-report.json").read_text(encoding="utf-8"))
          assert patch["status"] == "V352_TEMP_VIEWER_LIGHTING_PATCH_APPLIED" and patch["replacementCount"] == 1, patch
          assert patch["modelUnchanged"] is True and patch["originalHtmlSha256"] != patch["patchedHtmlSha256"], patch
          patched_html = Path("artifacts/v370-browser-test/index-v370-experimental-lighting.html").read_text(encoding="utf-8")
          assert "const faceFill=new THREE.DirectionalLight(0xfff4e8,0.45)" in patched_html, "V370 browser capture did not use the V353 lighting patch"
          print("V370_BROWSER_WEBGL_LIGHTING_NECKLACE=PASS_EXPERIMENTAL_ONLY")
          print(json.dumps({"state": report["state"], "avatarDiagnostics": report.get("avatarDiagnostics"), "visualFraming": report["visualFraming"]}, ensure_ascii=False, indent=2))
          PY

      - name: Package experimental V370 Windows preview and SHA-256
        if: success()
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/ly-lam-lam-v370-preview-stage"
          package="$RUNNER_TEMP/ly-lam-lam-v370-experimental-windows.zip"
          mkdir -p "$stage/v312-work"
          cp -a "$RUNNER_TEMP/v370-viewer/." "$stage/v312-work/"
          cp artifacts/v370-gltf-face-accessories/lam-v370-gltf-materials-full-face-candidate.glb "$stage/v312-work/lam-default.glb"
          cat > "$stage/v312-work/V370-EXPERIMENTAL-AVATAR.md" <<'MD'
          # V370 Experimental Real Human-Topology Avatar — Not Yet Approved

          This V370 candidate preserves the V365 face, hair, eye materials, silver necklace and body silhouette. Its only intended appearance change is the wardrobe asset swap guided by the saved Lam character sheet: replace the generic casualsuit with the CC0 female sportsuit clothing asset and add a shoes06 footwear asset. Clothing colors and silhouette must be judged from the included renders; the script does not claim the base sportsuit already matches cargo pants exactly. The V352 fill-light patch is preview-only and production main branch is unchanged. This is a diagnostic candidate, not the final avatar.

          - This is an experimental human-mesh candidate, not a claim of final photorealism.
          - It includes a subtle Lam_Idle_GentleSway common-root animation and 12 base-mesh facial morph names. The five separate face accessory meshes are restored with export-safe materials so the browser image can be compared against the V335 texture-only diagnostic.
          - Voice/chat integration is not included in this avatar-only package.
          - The production lam-default.glb in the main branch is unchanged.
          - Compare V370 front/side/full-body, face/eye close-ups, necklace-closeup and browser capture against V365. Check whether the sportsuit gives a shorter sleeveless top and suitable lower-body silhouette, whether shoes sit on the floor, and whether the necklace/logo and face/hair are unchanged. Do not call the outfit reference-matched until the rendered silhouette, colors and footwear are reviewed. Do not promote without visual approval.
          - Launch on Windows by double-clicking START-LAM-WINDOWS.bat after installing Node.js LTS; keep the console open.
          MD
          (
            cd "$stage/v312-work"
            node --check tools/start-windows-preview.cjs
            node tools/start-windows-preview.cjs --check
          )
          python3 - "$stage" "$package" <<'PY'
          import hashlib, pathlib, sys, zipfile
          stage, package = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(package, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=8) as archive:
              for path in sorted(stage.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(stage).as_posix())
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          package.with_suffix(package.suffix + ".sha256").write_text(f"{digest}  {package.name}\n", encoding="ascii")
          with zipfile.ZipFile(package, "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"ZIP integrity failed: {bad}")
              names = archive.namelist()
              for required in (
                "v312-work/START-LAM-WINDOWS.bat",
                "v312-work/V370-EXPERIMENTAL-AVATAR.md",
                "v312-work/lam-default.glb",
                "v312-work/vendor/three/build/three.module.js",
              ):
                  if required not in names:
                      raise SystemExit(f"Missing package file: {required}")
              html = archive.read("v312-work/index.html").decode("utf-8")
              if "const faceFill=new THREE.DirectionalLight(0xfff4e8,0.45)" not in html:
                  raise SystemExit("V370 packaged preview is missing the V353/V352 fill-lighting patch")
          print(f"V370_WINDOWS_PREVIEW_BYTES={package.stat().st_size}")
          print(f"V370_WINDOWS_PREVIEW_SHA256={digest}")
          print("V370_WINDOWS_PREVIEW_ZIP_INTEGRITY=PASS")
          PY

      - name: Upload V370 model, editable scene, images, reports and preview package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ly-lam-lam-v370-gltf-face-accessory-${{ github.run_id }}
          path: |
            artifacts/v370-gltf-face-accessories/
            artifacts/v370-browser-test/
            ${{ runner.temp }}/ly-lam-lam-v370-experimental-windows.zip
            ${{ runner.temp }}/ly-lam-lam-v370-experimental-windows.zip.sha256
            artifacts-v370-provenance.tmp
          if-no-files-found: warn
          retention-days: 14
