          assert all(abs(item["embedded_rgb_mean_linear"] - item["source_processed_rgb_mean_linear"]) <= 0.08 for item in gltf_wardrobe), gltf_wardrobe
          assert wardrobe["status"] == "APPLIED", wardrobe
