name: Deploy Lam Avatar to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download V386 review candidate artifact (optional)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ly-lam-lam-v386-gltf-face-accessory-38732161896
          path: ${{ runner.temp }}/v386-artifact
          repository: ${{ github.repository }}
          run-id: 38732161896
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download V386-R3 profile-trim review candidate artifact (optional)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ly-lam-lam-v386-r3-armhole-profile-trim-38890795401
          path: ${{ runner.temp }}/v386-r3-artifact
          repository: ${{ github.repository }}
          run-id: 38890795401
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble Pages site and isolated V386 review route
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/lll-pages-site"
          rm -rf "$site"
          mkdir -p "$site"
          cp -a ./v312-work/. "$site/"

          artifact_root="$RUNNER_TEMP/v386-artifact"
          candidate_zip="$(find "$artifact_root" -type f -name 'ly-lam-lam-v386-experimental-windows.zip' -print -quit 2>/dev/null || true)"
          if [[ -z "$candidate_zip" ]]; then
            echo "::warning::V386 candidate artifact is unavailable; deploying the existing production site without a review route."
            exit 0
          fi

          sidecar="${candidate_zip}.sha256"
          if [[ ! -f "$sidecar" ]]; then
            echo "::warning::V386 checksum sidecar is missing; skipping the optional review route."
            exit 0
          fi
          expected="$(awk 'NR==1 {print $1}' "$sidecar")"
          actual="$(sha256sum "$candidate_zip" | awk '{print $1}')"
          if [[ -z "$expected" || "$actual" != "$expected" ]]; then
            echo "::warning::V386 review archive checksum mismatch; skipping the optional review route."
            exit 0
          fi
          if ! unzip -tq "$candidate_zip" >/dev/null; then
            echo "::warning::V386 review archive integrity check failed; skipping the optional review route."
            exit 0
          fi

          review_root="$site/review-v386"
          mkdir -p "$review_root"
          unzip -q "$candidate_zip" -d "$review_root"
          model="$review_root/v312-work/lam-default.glb"
          page="$review_root/v312-work/index.html"
          three="$review_root/v312-work/vendor/three/build/three.module.js"
          if [[ ! -s "$model" || ! -s "$page" || ! -s "$three" ]]; then
            echo "::warning::V386 review archive is missing a required file; skipping the optional review route."
            rm -rf "$review_root"
            exit 0
          fi
          model_hash="$(sha256sum "$model" | awk '{print $1}')"
          if [[ "$model_hash" != "91648abdc2952a8eabf693fba7bed7b48da1f573e7cb792279e471e4ac72f55c" ]]; then
            echo "::warning::V386 model checksum differs from the reviewed candidate; skipping the optional review route."
            rm -rf "$review_root"
            exit 0
          fi

          cat > "$review_root/index.html" <<'HTML'
          <!doctype html>
          <html lang="vi">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="robots" content="noindex,nofollow">
            <meta name="theme-color" content="#101827">
            <title>Lý Lâm Lam — V386 xem thử</title>
            <style>
              *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101827;color:#edf2f7;font:16px/1.55 system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:24px}
              main{width:min(100%,620px);border:1px solid #39465a;border-radius:20px;padding:24px;background:#172235}
              h1{font-size:1.6rem;line-height:1.2;margin:0 0 12px}p{color:#cbd5e1}
              .warning{border-left:4px solid #eab308;padding:10px 12px;background:#202c3d;border-radius:8px}
              a{display:block;text-align:center;margin:22px 0 12px;padding:14px 18px;border-radius:12px;background:#dbeafe;color:#102033;text-decoration:none;font-weight:700;min-height:48px}
              small{color:#9fb0c5}ul{padding-left:22px}li{margin:6px 0}
            </style>
          </head>
          <body><main>
            <h1>Lý Lâm Lam · V386</h1>
            <p>Trang xem thử avatar 3D trên GitHub Pages qua HTTPS, dành cho đánh giá giao diện điện thoại.</p>
            <p class="warning"><strong>Bản ứng viên — chưa phê duyệt.</strong> Đây là đường dẫn thử riêng; avatar sản xuất ở trang gốc không bị thay thế. Hình dáng khuôn mặt, đường may vai/nách, phần eo, giày và chuyển động vẫn cần được đánh giá trực quan.</p>
            <a href="./v312-work/index.html?three=local">Mở avatar 3D</a>
            <ul>
              <li>Vuốt để xoay góc nhìn; dùng hai ngón tay để phóng to/thu nhỏ.</li>
              <li>Dùng nút “Khuôn mặt”, “Toàn thân” và “Đặt lại” để kiểm tra.</li>
              <li>Đây là bản avatar; hội thoại AI và giọng nói chưa được tích hợp.</li>
            </ul>
            <small>Ứng viên GLB SHA-256: 91648abdc2952a8eabf693fba7bed7b48da1f573e7cb792279e471e4ac72f55c</small>
          </main></body>
          </html>
          HTML
          echo "V386_REVIEW_ROUTE_STAGED=https://philam-ai.github.io/Ly-lam-lam/review-v386/"
          echo "V386_REVIEW_MODEL_SHA256=$model_hash"
          echo "Production root source was copied unchanged."

          # Optional R3 candidate is staged on a separate URL, so neither the
          # production root nor the previous V386 review snapshot is overwritten.
          r3_artifact_root="$RUNNER_TEMP/v386-r3-artifact"
          r3_candidate_zip="$(find "$r3_artifact_root" -type f -name 'ly-lam-lam-v386-experimental-windows.zip' -print -quit 2>/dev/null || true)"
          if [[ -z "$r3_candidate_zip" ]]; then
            echo "::warning::V386-R3 candidate artifact is unavailable; continuing without the R3 review route."
          else
            r3_sidecar="\${r3_candidate_zip}.sha256"
            if [[ ! -f "$r3_sidecar" ]]; then
              echo "::warning::V386-R3 checksum sidecar is missing; skipping its review route."
            else
              r3_expected="$(awk 'NR==1 {print $1}' "$r3_sidecar")"
              r3_actual="$(sha256sum "$r3_candidate_zip" | awk '{print $1}')"
              if [[ -z "$r3_expected" || "$r3_actual" != "$r3_expected" ]]; then
                echo "::warning::V386-R3 archive checksum mismatch; skipping its review route."
              elif ! unzip -tq "$r3_candidate_zip" >/dev/null; then
                echo "::warning::V386-R3 archive integrity check failed; skipping its review route."
              else
                r3_review_root="$site/review-v386-r3"
                rm -rf "$r3_review_root"
                mkdir -p "$r3_review_root"
                unzip -q "$r3_candidate_zip" -d "$r3_review_root"
                r3_model="$r3_review_root/v312-work/lam-default.glb"
                r3_page="$r3_review_root/v312-work/index.html"
                r3_three="$r3_review_root/v312-work/vendor/three/build/three.module.js"
                if [[ ! -s "$r3_model" || ! -s "$r3_page" || ! -s "$r3_three" ]]; then
                  echo "::warning::V386-R3 archive is missing a required file; skipping its review route."
                  rm -rf "$r3_review_root"
                else
                  r3_model_hash="$(sha256sum "$r3_model" | awk '{print $1}')"
                  if [[ "$r3_model_hash" != "8569cd9f1bd18f8f4aa89b33ccacfb2d18b132b940ac5671e71b57cfca5b426d" ]]; then
                    echo "::warning::V386-R3 GLB checksum differs from the validated candidate; skipping its review route."
                    rm -rf "$r3_review_root"
                  else
                    cat > "$r3_review_root/index.html" <<'HTML'
          <!doctype html>
          <html lang="vi">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="robots" content="noindex,nofollow">
            <meta name="theme-color" content="#101827">
            <title>Lý Lâm Lam — V386-R3 xem thử</title>
            <style>
              *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101827;color:#edf2f7;font:16px/1.55 system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:24px}
              main{width:min(100%,620px);border:1px solid #39465a;border-radius:20px;padding:24px;background:#172235}
              h1{font-size:1.6rem;line-height:1.2;margin:0 0 12px}p{color:#cbd5e1}
              .warning{border-left:4px solid #eab308;padding:10px 12px;background:#202c3d;border-radius:8px}
              a{display:block;text-align:center;margin:22px 0 12px;padding:14px 18px;border-radius:12px;background:#dbeafe;color:#102033;text-decoration:none;font-weight:700;min-height:48px}
              small{color:#9fb0c5}ul{padding-left:22px}li{margin:6px 0}
            </style>
          </head>
          <body><main>
            <h1>Lý Lâm Lam · V386-R3</h1>
            <p>Ứng viên áo sát nách với đường viền nách được cắt theo profile đo đạc, xem thử bằng HTTPS trên Safari.</p>
            <p class="warning"><strong>Bản xem xét — chưa phê duyệt.</strong> Chỉ dùng để đánh giá hình dáng. Avatar đang chạy ở trang gốc và đường dẫn V386 trước đó không bị thay thế.</p>
            <a href="./v312-work/index.html?three=local">Mở avatar 3D V386-R3</a>
            <ul>
              <li>Vuốt để xoay, dùng hai ngón tay để phóng to/thu nhỏ.</li>
              <li>Kiểm tra đường nách áo ở góc chính diện, nghiêng và ba phần tư.</li>
              <li>Hội thoại AI và giọng nói chưa được tích hợp trong gói này.</li>
            </ul>
            <small>GLB SHA-256: 8569cd9f1bd18f8f4aa89b33ccacfb2d18b132b940ac5671e71b57cfca5b426d</small>
          </main></body>
          </html>
          HTML
                    echo "V386_R3_REVIEW_ROUTE_STAGED=https://philam-ai.github.io/Ly-lam-lam/review-v386-r3/"
                    echo "V386_R3_REVIEW_MODEL_SHA256=$r3_model_hash"
                  fi
                fi
              fi
            fi
          fi

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/lll-pages-site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
