name: Deploy Lam Avatar to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js for pre-deploy regression tests
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Block deployment if core avatar or GLB tests fail
        run: node --test v312-work/tests/avatar-core.test.cjs v312-work/tests/glb-structural-audit.test.cjs

      - name: Block deployment if the actual V312 package checks fail
        run: node --test automation/tests/v312-package-integrity.test.cjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload V312 website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./v312-work

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
