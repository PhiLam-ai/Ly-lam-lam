name: LLL Stable Version Promotion

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "Branch, tag, or commit SHA to package (review application checks before promotion)"
        required: true
        type: string
        default: "main"
      candidate_version:
        description: "Human-readable version label, for example V312-PASS1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: lll-stable-version-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Verify package and update stable/previous pointers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out registry branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve candidate and validate required app files
        id: candidate
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_VERSION" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "Invalid version label. Use letters, numbers, dot, underscore, or hyphen." >&2
            exit 1
          fi
          git fetch --no-tags origin "$CANDIDATE_REF"
          CANDIDATE_SHA="$(git rev-parse FETCH_HEAD)"
          git cat-file -e "${CANDIDATE_SHA}:v312-work/index.html"
          git cat-file -e "${CANDIDATE_SHA}:lam-default.glb"
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$CANDIDATE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Candidate commit: $CANDIDATE_SHA"
          echo "Candidate label: $CANDIDATE_VERSION"

      - name: Build and verify immutable source snapshot
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stable-output
          ARCHIVE="ly-lam-lam-${CANDIDATE_VERSION}-${CANDIDATE_SHA:0:12}.zip"
          git archive --format=zip --output="stable-output/$ARCHIVE" "$CANDIDATE_SHA"
          test -s "stable-output/$ARCHIVE"
          unzip -t "stable-output/$ARCHIVE"
          (
            cd stable-output
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
            sha256sum -c "$ARCHIVE.sha256"
          )
          python3 - <<'PY'
          import struct
          from pathlib import Path
          p = Path("lam-default.glb")
          # Read the exact candidate's GLB from the archive and check the GLB header.
          import zipfile
          z = zipfile.ZipFile(next(Path("stable-output").glob("*.zip")))
          data = z.read("lam-default.glb")
          assert len(data) >= 20, "GLB is too small"
          magic, version, declared_length = struct.unpack_from("<4sII", data, 0)
          assert magic == b"glTF", f"Invalid GLB magic: {magic!r}"
          assert version == 2, f"Expected glTF 2.0, got {version}"
          assert declared_length == len(data), f"GLB length mismatch: {declared_length} != {len(data)}"
          print(f"GLB_HEADER_CHECK=PASS bytes={len(data)} version={version}")
          PY
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "SHA256=$(cut -d ' ' -f 1 "stable-output/$ARCHIVE.sha256")" >> "$GITHUB_ENV"

      - name: Shift stable pointer and record candidate
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
          ARCHIVE: ${{ env.ARCHIVE }}
          ARCHIVE_SHA256: ${{ env.SHA256 }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path("versions/stable.json")
          state = json.loads(path.read_text(encoding="utf-8"))
          old_current = state.get("current")
          new_current = {
              "version": os.environ["CANDIDATE_VERSION"],
              "commit_sha": os.environ["CANDIDATE_SHA"],
              "archive": os.environ["ARCHIVE"],
              "sha256": os.environ["ARCHIVE_SHA256"],
              "promoted_at_utc": datetime.now(timezone.utc).isoformat(),
              "package_checks": ["required app entry file exists", "GLB header/length check", "ZIP integrity", "SHA-256 verification"],
              "application_visual_qa": "NOT_IMPLIED_BY_PACKAGE_CHECKS"
          }
          if old_current and old_current.get("commit_sha") != new_current["commit_sha"]:
              state["previous"] = old_current
          elif old_current and old_current.get("commit_sha") == new_current["commit_sha"]:
              # Re-promoting the same commit refreshes its record without erasing rollback history.
              state["previous"] = state.get("previous")
          state["current"] = new_current
          state["last_updated_utc"] = datetime.now(timezone.utc).isoformat()
          path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions/stable.json
          if ! git diff --cached --quiet; then
            git commit -m "Record stable version ${CANDIDATE_VERSION}"
            git push origin HEAD:main
          else
            echo "Registry already has the requested stable state."
          fi

      - name: Upload stable package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: stable-${{ steps.candidate.outputs.version }}-${{ steps.candidate.outputs.sha }}
          path: |
            stable-output/*.zip
            stable-output/*.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish summary
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
          ARCHIVE: ${{ env.ARCHIVE }}
          ARCHIVE_SHA256: ${{ env.SHA256 }}
        run: |
          {
            echo "## Stable version package verified"
            echo
            echo "- Version: `$CANDIDATE_VERSION`"
            echo "- Candidate commit: `$CANDIDATE_SHA`"
            echo "- ZIP: `$ARCHIVE`"
            echo "- SHA-256: `$ARCHIVE_SHA256`"
            echo "- Package integrity: PASS"
            echo "- Note: package checks do not prove visual quality or successful iPhone rendering."
          } >> "$GITHUB_STEP_SUMMARY"
