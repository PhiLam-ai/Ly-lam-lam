name: LLL Stable Version Rollback

on:
  workflow_dispatch:
    inputs:
      confirm_rollback:
        description: "Set to YES only after reviewing the current and previous versions"
        required: true
        type: choice
        options:
          - NO
          - YES

permissions:
  contents: write

concurrency:
  group: lll-stable-version-promotion
  cancel-in-progress: false

jobs:
  rollback:
    name: Validate previous package and swap stable pointers
    if: inputs.confirm_rollback == 'YES'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate current and previous entries
        id: target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          s = json.loads(Path("versions/stable.json").read_text(encoding="utf-8"))
          cur, prev = s.get("current"), s.get("previous")
          assert cur and prev, "Rollback blocked: both current and previous versions must exist."
          for label, item in (("current", cur), ("previous", prev)):
              assert re.fullmatch(r"[A-Za-z0-9._-]{1,64}", item.get("version", "")), f"{label} version label invalid"
              assert re.fullmatch(r"[0-9a-f]{40}", item.get("commit_sha", "")), f"{label} commit SHA invalid"
          assert cur["commit_sha"] != prev["commit_sha"], "Rollback blocked: current and previous point to the same commit."
          print("ROLLBACK_TARGET=" + prev["version"])
          print("ROLLBACK_COMMIT=" + prev["commit_sha"])
          PY
          PREVIOUS_SHA="$(python3 -c 'import json; print(json.load(open("versions/stable.json"))["previous"]["commit_sha"])')"
          git cat-file -e "${PREVIOUS_SHA}:v312-work/index.html"
          git cat-file -e "${PREVIOUS_SHA}:lam-default.glb"
          echo "sha=$PREVIOUS_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and verify rollback snapshot
        id: package
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_VERSION="$(python3 -c 'import json; print(json.load(open("versions/stable.json"))["previous"]["version"])')"
          mkdir -p rollback-output
          ARCHIVE="ly-lam-lam-${TARGET_VERSION}-rollback-${TARGET_SHA:0:12}.zip"
          git archive --format=zip --output="rollback-output/$ARCHIVE" "$TARGET_SHA"
          unzip -t "rollback-output/$ARCHIVE"
          (
            cd rollback-output
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
            sha256sum -c "$ARCHIVE.sha256"
          )
          python3 - "$ARCHIVE" <<'PY'
          import struct, sys, zipfile
          from pathlib import Path
          archive = Path("rollback-output") / sys.argv[1]
          with zipfile.ZipFile(archive) as z:
              data = z.read("lam-default.glb")
              assert len(data) >= 20, "GLB is too small"
              magic, version, length = struct.unpack_from("<4sII", data, 0)
              assert magic == b"glTF", "Invalid GLB magic"
              assert version == 2, f"Expected glTF 2.0, got {version}"
              assert length == len(data), f"GLB length mismatch: {length} != {len(data)}"
              assert "v312-work/index.html" in z.namelist(), "App entry file missing from rollback ZIP"
          print("ROLLBACK_PACKAGE_CHECKS=PASS")
          PY
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d ' ' -f 1 "rollback-output/$ARCHIVE.sha256")" >> "$GITHUB_OUTPUT"

      - name: Swap current and previous pointers
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          ARCHIVE_SHA256: ${{ steps.package.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path("versions/stable.json")
          state = json.loads(p.read_text(encoding="utf-8"))
          old_current = state["current"]
          target = state["previous"]
          assert target["commit_sha"] == os.environ["TARGET_SHA"], "Rollback target changed during validation"
          target = dict(target)
          target["archive"] = os.environ["ARCHIVE"]
          target["sha256"] = os.environ["ARCHIVE_SHA256"]
          target["rolled_back_to_at_utc"] = datetime.now(timezone.utc).isoformat()
          target["package_checks"] = ["required app entry file exists", "GLB header/length check", "ZIP integrity", "SHA-256 verification"]
          target["application_visual_qa"] = "NOT_IMPLIED_BY_PACKAGE_CHECKS"
          state["current"] = target
          state["previous"] = old_current
          state["last_updated_utc"] = datetime.now(timezone.utc).isoformat()
          p.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions/stable.json
          git commit -m "Roll back stable pointer to previous verified package"
          git push origin HEAD:main

      - name: Upload rollback evidence
        uses: actions/upload-artifact@v4
        with:
          name: stable-rollback-${{ steps.target.outputs.sha }}
          path: |
            rollback-output/*.zip
            rollback-output/*.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish summary
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          ARCHIVE_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          {
            echo "## Stable pointer rollback completed"
            echo
            echo "- Restored commit: `$TARGET_SHA`"
            echo "- Verified ZIP: `$ARCHIVE`"
            echo "- SHA-256: `$ARCHIVE_SHA256`"
            echo "- Package integrity: PASS"
            echo "- Note: package checks do not prove visual quality or successful iPhone rendering."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain safe no-op when not confirmed
        if: inputs.confirm_rollback != 'YES'
        run: echo "No changes made. Set confirm_rollback to YES only after reviewing both version pointers."
