name: LLL Stable Rollback Package Dry Run

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stable-rollback-package-dry-run.yml"
      - ".github/workflows/stable-version-rollback.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lll-stable-rollback-package-dry-run
  cancel-in-progress: false

jobs:
  rollback-package:
    name: Build and verify a rollback package without changing stable registry
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Choose and validate rollback source
        id: target
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD^)"
          git cat-file -e "${TARGET_SHA}:v312-work/index.html"
          git cat-file -e "${TARGET_SHA}:lam-default.glb"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Rollback source commit: $TARGET_SHA"

      - name: Build and verify rollback ZIP
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rollback-dry-run
          ARCHIVE="ly-lam-lam-rollback-dry-run-${TARGET_SHA:0:12}.zip"
          git archive --format=zip --output="rollback-dry-run/$ARCHIVE" "$TARGET_SHA"
          test -s "rollback-dry-run/$ARCHIVE"
          unzip -t "rollback-dry-run/$ARCHIVE"
          (
            cd rollback-dry-run
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
            sha256sum -c "$ARCHIVE.sha256"
          )
          python3 - "$ARCHIVE" <<'PY'
          import struct, sys, zipfile
          from pathlib import Path
          p = Path("rollback-dry-run") / sys.argv[1]
          with zipfile.ZipFile(p) as z:
              names = set(z.namelist())
              assert "v312-work/index.html" in names, "app entry file missing"
              data = z.read("lam-default.glb")
              assert len(data) >= 20, "GLB too small"
              magic, version, length = struct.unpack_from("<4sII", data, 0)
              assert magic == b"glTF", "invalid GLB magic"
              assert version == 2, f"expected GLB v2, got {version}"
              assert length == len(data), f"GLB length mismatch: {length} != {len(data)}"
          print("ROLLBACK_ZIP_INTEGRITY=PASS")
          print("ROLLBACK_SHA256=PASS")
          print("ROLLBACK_APP_ENTRY=PASS")
          print("ROLLBACK_GLB_HEADER=PASS")
          PY
          echo "## Rollback package dry run: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: `$TARGET_SHA`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: `$(cut -d ' ' -f 1 "rollback-dry-run/$ARCHIVE.sha256")`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Registry modified: NO" >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm live registry was not modified
        shell: bash
        run: |
          git diff --exit-code HEAD -- versions/stable.json
          test -z "$(git status --porcelain -- versions/stable.json)"
          echo "REAL_STABLE_REGISTRY_UNCHANGED=PASS"
      - name: Upload dry-run evidence
        uses: actions/upload-artifact@v4
        with:
          name: rollback-package-dry-run-${{ steps.target.outputs.sha }}
          path: |
            rollback-dry-run/*.zip
            rollback-dry-run/*.sha256
          if-no-files-found: error
          retention-days: 14
