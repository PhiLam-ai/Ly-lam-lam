name: Generate Lam head candidate from face reference

on:
  push:
    branches:
      - experiment/github-auto-avatar
    paths:
      - "references/lam-face-reference.jpg"
      - ".github/workflows/generate-lam-head.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lam-head-candidate-preview-v2
  cancel-in-progress: false

jobs:
  generate-head:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4

      - name: Confirm face reference
        run: |
          python -m pip install --upgrade pillow
          python - <<'PY'
          from PIL import Image
          p = "references/lam-face-reference.jpg"
          im = Image.open(p)
          im.verify()
          im = Image.open(p)
          print("LAM_FACE_REFERENCE=PASS")
          print("FORMAT=" + str(im.format))
          print("SIZE=" + str(im.size))
          PY

      - name: Install InstantMesh client
        run: python -m pip install --upgrade gradio_client

      - name: Generate dedicated head/bust candidate via InstantMesh
        run: |
          python - <<'PY'
          import os, json, shutil
          from PIL import Image, ImageOps
          from gradio_client import Client, handle_file

          # Trim leftover character-sheet lettering at the edge, then make a square input.
          source_image = Image.open("references/lam-face-reference.jpg").convert("RGB")
          sw, sh = source_image.size
          source_image = source_image.crop((int(sw * 0.10), 0, sw, sh))
          face_square = Image.new("RGB", (512, 512), (238, 238, 238))
          face_fit = ImageOps.contain(source_image, (430, 512), method=Image.Resampling.LANCZOS)
          face_square.paste(face_fit, ((512-face_fit.width)//2, (512-face_fit.height)//2))
          face_square.save("lam-face-square.png")
          print("FACE_INPUT_SIZE=" + str(face_square.size))
          print("FACE_INPUT_PREPARED=PASS")

          def local_path(value):
              if isinstance(value, str):
                  return value
              if isinstance(value, dict):
                  for key in ("path", "value", "name"):
                      p = value.get(key)
                      if isinstance(p, str):
                          return p
              return None

          client = Client("TencentARC/InstantMesh", verbose=True)
          print("STEP=preprocess_face")
          pre = client.predict(
              input_image=handle_file("lam-face-square.png"),
              do_remove_background=False,
              api_name="/preprocess",
          )
          print("PREPROCESS_RESULT=" + json.dumps(pre, default=str)[:1200])
          processed = local_path(pre[0] if isinstance(pre, (tuple, list)) else pre)
          if not processed or not os.path.isfile(processed):
              raise SystemExit("InstantMesh did not return the preprocessed face image.")

          shutil.copy2(processed, "lam-face-preprocessed.webp")
          print("STEP=generate_head_multiview")
          mvs = client.predict(
              input_image=handle_file(processed),
              sample_steps=75,
              sample_seed=1510,
              api_name="/generate_mvs",
          )
          print("MVS_RESULT=" + json.dumps(mvs, default=str)[:1200])
          mvs_path = local_path(mvs[0] if isinstance(mvs, (tuple, list)) else mvs)
          if not mvs_path or not os.path.isfile(mvs_path):
              raise SystemExit("InstantMesh did not return generated head multi-views.")
          shutil.copy2(mvs_path, "lam-face-generated-multiview.webp")

          print("STEP=make_head_3d")
          result = client.predict(api_name="/make3d")
          print("MAKE3D_RESULT=" + json.dumps(result, default=str)[:2500])
          items = list(result) if isinstance(result, (tuple, list)) else [result]
          glb_path = None
          obj_path = None
          for item in items:
              p = local_path(item)
              if p and os.path.isfile(p):
                  if p.lower().endswith(".glb") and glb_path is None:
                      glb_path = p
                  elif p.lower().endswith(".obj") and obj_path is None:
                      obj_path = p
          if not glb_path:
              raise SystemExit("InstantMesh returned no GLB head candidate.")
          shutil.copy2(glb_path, "lam-head-candidate-colored.glb")
          size = os.path.getsize("lam-head-candidate-colored.glb")
          with open("lam-head-candidate-colored.glb", "rb") as f:
              header = f.read(4)
          if size < 1024 or header != b"glTF":
              raise SystemExit("Head candidate failed GLB integrity check.")
          print("LAM_HEAD_GLB_CREATED=PASS")
          print("HEAD_GLB_BYTES=" + str(size))
          print("HEAD_OBJ_AVAILABLE=" + str(bool(obj_path)))
          PY

      - name: Install Blender 3.6 LTS for texture baking and preview
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl xz-utils libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libgl1 libegl1 libx11-6 libxxf86vm1 libxcb1 libxext6 libdbus-1-3
          sudo rm -rf /var/lib/apt/lists/*
          curl --fail --location --retry 3 https://download.blender.org/release/Blender3.6/blender-3.6.23-linux-x64.tar.xz --output /tmp/blender.tar.xz
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf /tmp/blender.tar.xz -C "$RUNNER_TEMP/blender" --strip-components=1
          "$RUNNER_TEMP/blender/blender" --background --factory-startup --python-expr "import bpy; print('BLENDER_VERSION=' + bpy.app.version_string)"

      - name: Remove corrupt source image references before Blender import
        run: |
          python - <<'PY'
          import json, struct
          src = "lam-head-candidate-colored.glb"
          dst = "lam-head-candidate-untextured-import.glb"
          data = open(src, "rb").read()
          magic, version, total = struct.unpack_from("<4sII", data, 0)
          if magic != b"glTF" or version != 2 or total != len(data):
              raise SystemExit("Source head candidate is not a structurally valid GLB")
          jlen, jtype = struct.unpack_from("<I4s", data, 12)
          if jtype != b"JSON":
              raise SystemExit("Expected JSON chunk at start of GLB")
          doc = json.loads(data[20:20+jlen].decode("utf-8").rstrip("\\x00 "))
          for mat in doc.get("materials", []):
              pbr = mat.get("pbrMetallicRoughness") or {}
              pbr.pop("baseColorTexture", None)
              pbr.pop("metallicRoughnessTexture", None)
              mat.pop("normalTexture", None)
              mat.pop("occlusionTexture", None)
              mat.pop("emissiveTexture", None)
          doc.pop("images", None)
          doc.pop("textures", None)
          doc.pop("samplers", None)
          jdata = json.dumps(doc, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
          while len(jdata) % 4: jdata += b" "
          bin_start = 20 + jlen
          old_bin_len, bin_type = struct.unpack_from("<I4s", data, bin_start)
          bin_data = data[bin_start+8:bin_start+8+old_bin_len]
          new_total = 12 + 8 + len(jdata) + 8 + len(bin_data)
          out = bytearray(struct.pack("<4sII", b"glTF", 2, new_total))
          out.extend(struct.pack("<I4s", len(jdata), b"JSON"))
          out.extend(jdata)
          out.extend(struct.pack("<I4s", len(bin_data), bin_type))
          out.extend(bin_data)
          open(dst, "wb").write(out)
          print("SOURCE_GLB_BYTES=" + str(len(data)))
          print("SANITIZED_GLB_BYTES=" + str(len(out)))
          print("REMOVED_BROKEN_IMAGE_REFERENCES=PASS")
          PY

      - name: Bake vertex colors into standard UV base-color texture
        run: |
          set -euo pipefail
          cat > /tmp/bake_head.py <<'PY'
          import bpy, os, json, struct, traceback
          src=os.path.abspath("lam-head-candidate-untextured-import.glb")
          out=os.path.abspath("lam-head-candidate-textured.glb")
          texpath=os.path.abspath("lam-head-baked-color.png")
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.import_scene.gltf(filepath=src)
          meshes=[o for o in bpy.context.scene.objects if o.type=="MESH"]
          if not meshes: raise RuntimeError("No meshes imported from head candidate")
          bpy.ops.object.select_all(action="DESELECT")
          for o in meshes: o.select_set(True)
          bpy.context.view_layer.objects.active=meshes[0]
          if len(meshes)>1: bpy.ops.object.join()
          obj=bpy.context.view_layer.objects.active
          mesh=obj.data
          attrs=list(mesh.color_attributes) if hasattr(mesh,"color_attributes") else list(mesh.vertex_colors)
          if not attrs: raise RuntimeError("No vertex colors found to bake on the head mesh")
          attr=attrs[0]
          if hasattr(mesh,"uv_layers"):
              for uv_layer in list(mesh.uv_layers):
                  mesh.uv_layers.remove(uv_layer)
              mesh.uv_layers.new(name="UVMap")
          bpy.ops.object.mode_set(mode="EDIT")
          bpy.ops.mesh.select_all(action="SELECT")
          bpy.ops.uv.smart_project(island_margin=0.02)
          bpy.ops.object.mode_set(mode="OBJECT")
          mat=bpy.data.materials.new("Lam head baked base color")
          mat.use_nodes=True
          mesh.materials.clear()
          mesh.materials.append(mat)
          for poly in mesh.polygons: poly.material_index=0
          nodes=mat.node_tree.nodes
          nodes.clear()
          output=nodes.new("ShaderNodeOutputMaterial")
          emission=nodes.new("ShaderNodeEmission")
          try:
              srcnode=nodes.new("ShaderNodeVertexColor")
              srcnode.layer_name=attr.name
          except Exception:
              srcnode=nodes.new("ShaderNodeAttribute")
              srcnode.attribute_name=attr.name
          mat.node_tree.links.new(srcnode.outputs["Color"], emission.inputs["Color"])
          mat.node_tree.links.new(emission.outputs["Emission"], output.inputs["Surface"])
          image=bpy.data.images.new("Lam Head Base Color",width=2048,height=2048,alpha=True)
          image.filepath_raw=texpath
          image.file_format="PNG"
          texnode=nodes.new("ShaderNodeTexImage")
          texnode.image=image
          nodes.active=texnode
          for n in nodes: n.select=False
          texnode.select=True
          scene=bpy.context.scene
          scene.render.engine="CYCLES"
          scene.cycles.samples=1
          scene.render.bake.margin=8
          bpy.ops.object.select_all(action="DESELECT")
          obj.select_set(True)
          bpy.context.view_layer.objects.active=obj
          bpy.ops.object.bake(type="EMIT",use_clear=True,margin=8)
          image.save()
          image.pack()
          nodes.clear()
          output=nodes.new("ShaderNodeOutputMaterial")
          principled=nodes.new("ShaderNodeBsdfPrincipled")
          texnode=nodes.new("ShaderNodeTexImage")
          texnode.image=image
          mat.node_tree.links.new(texnode.outputs["Color"],principled.inputs["Base Color"])
          mat.node_tree.links.new(principled.outputs["BSDF"],output.inputs["Surface"])
          principled.inputs["Roughness"].default_value=0.72
          if hasattr(mesh,"color_attributes"):
              for a in list(mesh.color_attributes): mesh.color_attributes.remove(a)
          elif hasattr(mesh,"vertex_colors"):
              for a in list(mesh.vertex_colors): mesh.vertex_colors.remove(a)
          bpy.ops.object.select_all(action="DESELECT")
          obj.select_set(True)
          bpy.context.view_layer.objects.active=obj
          bpy.ops.export_scene.gltf(filepath=out,export_format="GLB",use_selection=True,export_materials="EXPORT",export_texcoords=True,export_normals=True)
          data=open(out,"rb").read()
          magic,version,total=struct.unpack_from("<4sII",data,0)
          assert magic==b"glTF" and version==2 and total==len(data)
          clen,ctype=struct.unpack_from("<I4s",data,12)
          assert ctype==b"JSON"
          doc=json.loads(data[20:20+clen].decode("utf-8").rstrip("\x00 "))
          textured=bool(doc.get("images") and doc.get("textures") and any((m.get("pbrMetallicRoughness") or {}).get("baseColorTexture") for m in doc.get("materials",[])))
          report={"glb_bytes":len(data),"textures":len(doc.get("textures",[])),"images":len(doc.get("images",[])),"materials":len(doc.get("materials",[])),"meshes":len(doc.get("meshes",[])),"textured":textured}
          print("LAM_HEAD_TEXTURE_AUDIT="+json.dumps(report))
          assert textured, "Baked head GLB missing base-color texture"
          print("LAM_HEAD_TEXTURE_BAKE=PASS")
          PY
          "$RUNNER_TEMP/blender/blender" --background --factory-startup --python /tmp/bake_head.py

      - name: Render head preview from multiple angles and report bounds
        run: |
          set -euo pipefail
          cat > /tmp/render_head.py <<'PY'
          import bpy, os, json, math
          from mathutils import Vector
          src=os.path.abspath("lam-head-candidate-textured.glb")
          outdir=os.path.abspath("lam-head-previews")
          os.makedirs(outdir,exist_ok=True)
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.import_scene.gltf(filepath=src)
          scene=bpy.context.scene
          meshes=[o for o in scene.objects if o.type=="MESH"]
          if not meshes: raise RuntimeError("No head meshes to render")
          coords=[]
          for o in meshes:
              coords.extend([o.matrix_world @ Vector(c) for c in o.bound_box])
          lo=[min(v[i] for v in coords) for i in range(3)]
          hi=[max(v[i] for v in coords) for i in range(3)]
          size=[hi[i]-lo[i] for i in range(3)]
          center=[(lo[i]+hi[i])/2 for i in range(3)]
          up=max(range(3),key=lambda i:size[i])
          remaining=[i for i in range(3) if i!=up]
          front_axis=min(remaining,key=lambda i:size[i])
          side_axis=next(i for i in remaining if i!=front_axis)
          scene.render.engine="BLENDER_WORKBENCH"
          scene.display.shading.light="STUDIO"
          scene.display.shading.color_type="TEXTURE"
          scene.display.shading.show_shadows=True
          scene.display.shading.show_cavity=True
          scene.display.shading.cavity_type="WORLD"
          scene.render.resolution_x=700
          scene.render.resolution_y=700
          scene.render.resolution_percentage=100
          scene.render.image_settings.file_format="PNG"
          scene.render.image_settings.color_mode="RGB"
          scene.render.film_transparent=False
          if scene.world is None: scene.world=bpy.data.worlds.new("LamHeadPreviewWorld")
          scene.world.use_nodes=True
          bg=scene.world.node_tree.nodes.get("Background")
          bg.inputs["Color"].default_value=(0.11,0.13,0.17,1)
          bg.inputs["Strength"].default_value=0.7
          # Studio lights
          for name,loc,power,area in [
              ("Key",(-3,-4,5),600,4),("Fill",(4,-3,2),350,4),("Rim",(0,3,4),700,3)]:
              ld=bpy.data.lights.new(name,"AREA"); ld.energy=power; ld.shape="DISK"; ld.size=area
              ob=bpy.data.objects.new(name,ld); scene.collection.objects.link(ob); ob.location=loc
              ob.rotation_euler=(Vector(center)-ob.location).to_track_quat("-Z","Y").to_euler()
          def camera_at(name,offset,path):
              cd=bpy.data.cameras.new(name); cd.type="ORTHO"
              cd.ortho_scale=max(size)*1.35
              cam=bpy.data.objects.new(name,cd); scene.collection.objects.link(cam)
              pos=list(center); pos[up]+=offset[up]*max(size)*3; pos[front_axis]+=offset[front_axis]*max(size)*3; pos[side_axis]+=offset[side_axis]*max(size)*3
              cam.location=pos; cam.rotation_euler=(Vector(center)-cam.location).to_track_quat("-Z","Y").to_euler()
              scene.camera=cam; scene.render.filepath=path; bpy.ops.render.render(write_still=True)
          camera_at("LamHeadFront",{up:0,front_axis:-1,side_axis:0},os.path.join(outdir,"lam-head-front.png"))
          camera_at("LamHeadThreeQuarter",{up:0,front_axis:-0.85,side_axis:0.52},os.path.join(outdir,"lam-head-three-quarter.png"))
          camera_at("LamHeadBack",{up:0,front_axis:1,side_axis:0},os.path.join(outdir,"lam-head-back.png"))
          report={"source":os.path.basename(src),"glb_bytes":os.path.getsize(src),"bounds_min":lo,"bounds_max":hi,"extents":size,"vertical_axis_index":up,"front_axis_index":front_axis,"side_axis_index":side_axis,"preview_files":["lam-head-front.png","lam-head-three-quarter.png","lam-head-back.png"],"status":"RENDERED_NOT_YET_APPROVED"}
          open(os.path.join(outdir,"lam-head-preview-report.json"),"w").write(json.dumps(report,indent=2))
          print("LAM_HEAD_PREVIEW_REPORT="+json.dumps(report))
          PY
          "$RUNNER_TEMP/blender/blender" --background --factory-startup --python /tmp/render_head.py
          test -s lam-head-previews/lam-head-front.png
          test -s lam-head-previews/lam-head-three-quarter.png
          test -s lam-head-previews/lam-head-back.png

      - name: Upload isolated head candidate, textures and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lam-head-3d-candidate
          path: |
            lam-head-candidate-colored.glb
            lam-head-candidate-untextured-import.glb
            lam-head-candidate-textured.glb
            lam-head-baked-color.png
            lam-face-preprocessed.webp
            lam-face-generated-multiview.webp
            lam-head-previews/
          if-no-files-found: warn
          retention-days: 14
