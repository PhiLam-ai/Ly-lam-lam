      - name: Install browser-test dependencies
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/v314-playwright" --no-save --package-lock=false playwright pngjs
          "$RUNNER_TEMP/v314-playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: Check V386 GLB in mobile-sized Three.js viewer
        env:
          NODE_PATH: ${{ runner.temp }}/v314-playwright/node_modules
          V314_VIEWER_ROOT: ${{ runner.temp }}/v386-viewer
          V314_VIEWER_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/v386-browser-test
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v386-viewer" artifacts/v386-browser-test
          cp -a v312-work/. "$RUNNER_TEMP/v386-viewer/"
          cp artifacts/v386-gltf-face-accessories/lam-v386-gltf-materials-full-face-candidate.glb "$RUNNER_TEMP/v386-viewer/lam-default.glb"
          node --check tools/v352_apply_viewer_fill_lighting.cjs
          V352_VIEWER_ROOT="$RUNNER_TEMP/v386-viewer" \
            V352_PATCH_REPORT_PATH="$GITHUB_WORKSPACE/artifacts/v386-browser-test/viewer-lighting-patch-report.json" \
            node tools/v352_apply_viewer_fill_lighting.cjs
          node --check tools/v386_apply_viewer_camera_fit.cjs
          V386_VIEWER_ROOT="$RUNNER_TEMP/v386-viewer" \
            V386_CAMERA_FIT_REPORT_PATH="$GITHUB_WORKSPACE/artifacts/v386-browser-test/viewer-camera-fit-report.json" \
            node tools/v386_apply_viewer_camera_fit.cjs
          cp "$RUNNER_TEMP/v386-viewer/index.html" artifacts/v386-browser-test/index-v386-experimental-preview.html
          node --check tools/v314_candidate_webgl_smoke.cjs
          node tools/v314_candidate_webgl_smoke.cjs
          test -s artifacts/v386-browser-test/v314-candidate-browser-report.json
          test -s artifacts/v386-browser-test/v314-candidate-canvas.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/v386-browser-test/v314-candidate-browser-report.json").read_text(encoding="utf-8"))
          assert report["status"] == "PASS_BROWSER_WEBGL_CANDIDATE_ONLY", report
          assert report["state"]["booted"] is True, report
          assert report["state"]["rendererReady"] is True, report
          assert report["state"]["webgl"] is True, report
          assert report["state"]["activeAnimationName"] == "Lam_Idle_GentleSway", report
          assert report["state"]["animationTime"] > 0.05, report
          assert report["pageErrors"] == [] and report["consoleErrors"] == [], report
          patch = json.loads(Path("artifacts/v386-browser-test/viewer-lighting-patch-report.json").read_text(encoding="utf-8"))
          assert patch["status"] == "V352_TEMP_VIEWER_LIGHTING_PATCH_APPLIED" and patch["replacementCount"] == 1, patch
          assert patch["modelUnchanged"] is True and patch["originalHtmlSha256"] != patch["patchedHtmlSha256"], patch
          camera_patch = json.loads(Path("artifacts/v386-browser-test/viewer-camera-fit-report.json").read_text(encoding="utf-8"))
          assert camera_patch["status"] == "V386_TEMP_VIEWER_CAMERA_FIT_PATCH_APPLIED", camera_patch
          assert camera_patch["replacementCount"] == 1 and camera_patch["modelGlbUnchanged"] is True, camera_patch
          assert camera_patch["originalHtmlSha256"] != camera_patch["patchedHtmlSha256"], camera_patch
          patched_html = Path("artifacts/v386-browser-test/index-v386-experimental-preview.html").read_text(encoding="utf-8")
          assert "const faceFill=new THREE.DirectionalLight(0xfff4e8,0.45)" in patched_html, "V386 browser capture did not use the V353 lighting patch"
          assert "cameraDistance=Math.max(fitVertical,fitHorizontal,1.0)*1.35;" in patched_html, "V386 mobile preview is missing the extra camera framing margin"
          assert report["avatarDiagnostics"]["framing"]["projectedBoundsNdc"]["minY"] >= -0.98 and report["avatarDiagnostics"]["framing"]["projectedBoundsNdc"]["maxY"] <= 0.98, report["avatarDiagnostics"]
          print("V386_BROWSER_WEBGL_LIGHTING_CAMERA_FIT=PASS_EXPERIMENTAL_ONLY")
          print(json.dumps({"state": report["state"], "avatarDiagnostics": report.get("avatarDiagnostics"), "visualFraming": report["visualFraming"]}, ensure_ascii=False, indent=2))
          PY

      - name: Package experimental V386 Windows preview and SHA-256
        if: success()
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/ly-lam-lam-v386-preview-stage"
          package="$RUNNER_TEMP/ly-lam-lam-v386-experimental-windows.zip"
          mkdir -p "$stage/v312-work"
          cp -a "$RUNNER_TEMP/v386-viewer/." "$stage/v312-work/"
          cp artifacts/v386-gltf-face-accessories/lam-v386-gltf-materials-full-face-candidate.glb "$stage/v312-work/lam-default.glb"
          cat > "$stage/v312-work/V386-EXPERIMENTAL-AVATAR.md" <<'MD'
          # V386-R12 Experimental Real Human-Topology Avatar — Not Yet Approved

          This V386-R12 candidate continues the tested V385 arm-pose baseline (22-degree arm rotation, full hand/finger continuity and protected torso/lower body). It uses five local edge cuts within the measured shoulder/armhole band and preserves UV/material names. R12 retains the shape-preserving PCHIP contour and integrates a smooth shoulder-region offset of at most 6 mm directly into the 14 profile control points before clipping; it does not move individual border vertices outward afterward. The adjusted edge is checked against the PCHIP curve and against the original measured envelope, with the actual offset constrained to 5.5–7.5 mm. Eight bounded depth-only relaxation passes (world Y, factor 0.40), UV/material names, left/right balance and mesh accounting remain gated. The builder exports matched front diagnostics with the armhole binding hidden, shirt visible without skin, and skin visible without the sportsuit so cloth-edge shape can be separated from arm/skin intersection. Visibility flags, camera settings and render resolution are restored before GLB export. The intent is a cleaner sleeveless cropped top closer to Phi's saved reference. The candidate remains experimental and must be compared from front, side and three-quarter images. The body skin, arm geometry, pants/trouser components, shoes, face, eyes/iris, hair, necklace, belt/pockets, morphs and idle animation are preserved. The preview-only camera distance is increased by 12.5% for portrait framing; the browser bounds gate itself is not relaxed. The arm pose rotates about a higher shoulder pivot (z=1.23 m) with a nearer lateral fade (0.18–0.34 m); a separately audited 12 mm maximum skin-cap tuck narrows only the exposed upper-arm/armhole transition and protects the central torso and lower body. The armhole profile adds coverage near the lower upper-arm transition and tapers the outer shoulder tip; the integrated 6 mm offset, smoothed edge and matching bevelled binding are reviewed together. This is a diagnostic candidate, not the final avatar; inspect armhole/shoulder seams from front, side and three-quarter renders before approval.

          - This is an experimental human-mesh candidate, not a claim of final photorealism. R10 keeps the 105-point PCHIP envelope and adds a continuous shoulder-region offset of at most 6 mm into the curve controls before clipping. No extra per-vertex offset is applied afterward, so edge smoothing and binding use the same continuous profile. It audits adjusted-curve fit and the maximum offset from the original measured profile. Compare front, side and three-quarter renders to R9 before approval.
          - It includes a subtle Lam_Idle_GentleSway common-root animation and 12 base-mesh facial morph names. The five separate face accessory meshes are restored with export-safe materials so the browser image can be compared against the V335 texture-only diagnostic.
          - Voice/chat integration is not included in this avatar-only package.
          - The production lam-default.glb in the main branch is unchanged.
          - Compare V386 front/side/full-body, face/eye close-ups, necklace-closeup and browser capture against V365. Check whether the sportsuit gives a shorter sleeveless top and suitable lower-body silhouette, whether shoes sit on the floor, and whether the necklace/logo and face/hair are unchanged. Do not call the outfit reference-matched until the rendered silhouette, colors and footwear are reviewed. Do not promote without visual approval.
          - Launch on Windows by double-clicking START-LAM-WINDOWS.bat after installing Node.js LTS; keep the console open.
          MD
          (
            cd "$stage/v312-work"
            node --check tools/start-windows-preview.cjs
            node tools/start-windows-preview.cjs --check
          )
          python3 - "$stage" "$package" <<'PY'
          import hashlib, pathlib, sys, zipfile
          stage, package = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(package, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=8) as archive:
              for path in sorted(stage.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(stage).as_posix())
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          package.with_suffix(package.suffix + ".sha256").write_text(f"{digest}  {package.name}\n", encoding="ascii")
          with zipfile.ZipFile(package, "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"ZIP integrity failed: {bad}")
              names = archive.namelist()
              for required in (
                "v312-work/START-LAM-WINDOWS.bat",
                "v312-work/V386-EXPERIMENTAL-AVATAR.md",
                "v312-work/lam-default.glb",
                "v312-work/vendor/three/build/three.module.js",
              ):
                  if required not in names:
                      raise SystemExit(f"Missing package file: {required}")
              html = archive.read("v312-work/index.html").decode("utf-8")
              if "const faceFill=new THREE.DirectionalLight(0xfff4e8,0.45)" not in html:
                  raise SystemExit("V386 packaged preview is missing the V353/V352 fill-lighting patch")
              if "cameraDistance=Math.max(fitVertical,fitHorizontal,1.0)*1.35;" not in html:
                  raise SystemExit("V386 packaged preview is missing the portrait camera-fit margin")
          print(f"V386_WINDOWS_PREVIEW_BYTES={package.stat().st_size}")
          print(f"V386_WINDOWS_PREVIEW_SHA256={digest}")
          print("V386_WINDOWS_PREVIEW_ZIP_INTEGRITY=PASS")
          PY

      - name: Upload V386 model, editable scene, images, reports and preview package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ly-lam-lam-v386-r12-offset-diagnostics-${{ github.run_id }}
          path: |
            artifacts/v386-gltf-face-accessories/
            artifacts/v386-browser-test/
            ${{ runner.temp }}/ly-lam-lam-v386-experimental-windows.zip
            ${{ runner.temp }}/ly-lam-lam-v386-experimental-windows.zip.sha256
            artifacts-v386-provenance.tmp
          if-no-files-found: warn
          retention-days: 14
