name: V386-R12 Continuous Shoulder Offset and Shirt/Skin Diagnostics

on:
  push:
    branches:
      - avatar/v386-sleeveless-top-candidate
      - avatar/v386-r2-armhole-refinement
      - avatar/v386-r3-armhole-profile-trim
      - avatar/v386-r4-armhole-boundary-refinement
      - avatar/v386-r5-armhole-smoothing
      - avatar/v386-r6-pretrim-density
      - avatar/v386-r7-profile-bisect-trim
      - avatar/v386-r8-smooth-profile
      - avatar/v386-r9-profile-edge-continuity
      - avatar/v386-r10-smooth-shoulder-offset
      - avatar/v386-r12-offset-diagnostics
    paths:
      - "tools/blender_v386_sleeveless_top.py"
      - "tools/v386_apply_viewer_camera_fit.cjs"
      - ".github/workflows/v386-sleeveless-top-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v386-r12-offset-diagnostics
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build V386-R12 offset-diagnostics armhole candidate and test GLB
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        name: Check out Lam repository

      - name: Install Blender runtime libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils unzip \
            libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 \
            libgl1 libegl1 libx11-6 libxxf86vm1 libxcb1 libxext6 libdbus-1-3
          sudo rm -rf /var/lib/apt/lists/*

      - name: Cache official MakeHuman CC0 asset packs
        uses: actions/cache@v4
        with:
          path: .cache/v331-mpfb-assets
          key: v331-mpfb-assets-${{ runner.os }}-system-b5421278-face-d113107b-visemes-official-v1

      - name: Download and verify official MakeHuman assets
        id: download_assets
        run: |
          set -euo pipefail
          mkdir -p .cache/v331-mpfb-assets
          get_pack() {
            local name="$1" url1="$2" url2="$3"
            local out=".cache/v331-mpfb-assets/$name"
            if [ ! -s "$out" ]; then
              if ! curl -fL --retry 2 --retry-all-errors --connect-timeout 30 --max-time 3600 --speed-time 60 --speed-limit 1024 "$url1" -o "$out"; then
                rm -f "$out"
                curl -fL --retry 2 --retry-all-errors --connect-timeout 30 --max-time 3600 --speed-time 60 --speed-limit 1024 "$url2" -o "$out"
              fi
            fi
            test -s "$out"
          }
          get_pack makehuman_system_assets_cc0.zip \
            https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip \
            https://files.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip
          get_pack faceunits01.zip \
            https://files2.makehumancommunity.org/functional/faceunits01.zip \
            https://files.makehumancommunity.org/functional/faceunits01.zip
          get_pack visemes01.zip \
            https://files2.makehumancommunity.org/functional/visemes01.zip \
            https://files.makehumancommunity.org/functional/visemes01.zip

          echo "b542127a8e25547c7c29c19f2d1d2adb9a664c80396ecd694095dbc8028a0107  .cache/v331-mpfb-assets/makehuman_system_assets_cc0.zip" | sha256sum -c -
          echo "d113107bd7eb59f3af4df6fc0ec29bfcc593f496d0b336aec14f086a80ce7146  .cache/v331-mpfb-assets/faceunits01.zip" | sha256sum -c -
          for archive in .cache/v331-mpfb-assets/*.zip; do unzip -tq "$archive"; done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          root = Path(".cache/v331-mpfb-assets")
          report = {}
          for path in sorted(root.glob("*.zip")):
              with zipfile.ZipFile(path) as archive:
                  bad = archive.testzip()
                  if bad:
                      raise SystemExit(f"Invalid ZIP entry in {path.name}: {bad}")
                  names = archive.namelist()
              report[path.name] = {
                  "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "entries": len(names),
                  "contains_pack_manifest": any(name.startswith("packs/") for name in names),
              }
          assert report["makehuman_system_assets_cc0.zip"]["bytes"] > 250_000_000, report
          assert report["makehuman_system_assets_cc0.zip"]["contains_pack_manifest"], report
          assert report["faceunits01.zip"]["contains_pack_manifest"], report
          print(json.dumps(report, ensure_ascii=False, indent=2))
          Path("artifacts-v386-provenance.tmp").write_text(json.dumps(report, indent=2), encoding="utf-8")
          PY

      - name: Persist verified asset packs even if later build steps fail
        if: steps.download_assets.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .cache/v331-mpfb-assets
          key: v331-mpfb-assets-${{ runner.os }}-system-b5421278-face-d113107b-visemes-official-v1

      - name: Download Blender 4.5.3
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz \
            -o "$RUNNER_TEMP/blender.tar.xz"
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          "$RUNNER_TEMP/blender/blender" --background --factory-startup --python-expr \
            "import bpy; print('BLENDER_VERSION=' + bpy.app.version_string)"
          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"

      - name: Fetch MPFB source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/makehumancommunity/mpfb2.git "$RUNNER_TEMP/mpfb2"
          echo "MPFB_COMMIT=$(git -C "$RUNNER_TEMP/mpfb2" rev-parse HEAD)" >> "$GITHUB_ENV"
          test -s "$RUNNER_TEMP/mpfb2/src/mpfb/blender_manifest.toml"
          test -s "$RUNNER_TEMP/mpfb2/src/mpfb/__init__.py"

      - name: Install MPFB into Blender user extension repository
        run: |
          set -euo pipefail
          extension_root="$HOME/.config/blender/4.5/extensions/user_default"
          extension_package="$extension_root/mpfb"
          mkdir -p "$extension_root"
          rm -rf "$extension_package"
          cp -a "$RUNNER_TEMP/mpfb2/src/mpfb" "$extension_package"
          test -s "$extension_package/blender_manifest.toml"
          test -s "$extension_package/__init__.py"
          printf 'MPFB_EXTENSION_PATH=%s\n' "$extension_package" >> "$GITHUB_ENV"
          echo "Installed MPFB extension at $extension_package"

      - name: Preflight MPFB extension namespace
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender/blender" --background --factory-startup --python-expr \
            "import bpy, importlib.util; module='bl_ext.user_default.mpfb'; spec=importlib.util.find_spec(module); print('MPFB_EXTENSION_SPEC=', spec); assert spec is not None, 'MPFB extension is not discoverable from user_default'; result=bpy.ops.preferences.addon_enable(module=module); print('MPFB_ADDON_ENABLE=', result); assert 'FINISHED' in result; import bl_ext.user_default.mpfb as mpfb; print('MPFB_READY_VERSION=', mpfb.VERSION)"

      - name: Build and bake V386 candidate and render references
        run: |
          set -euo pipefail
          mkdir -p artifacts/v386-gltf-face-accessories
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender_v386_sleeveless_top.py -- \
            --mpfb-src "$RUNNER_TEMP/mpfb2/src" \
            --system-pack "$GITHUB_WORKSPACE/.cache/v331-mpfb-assets/makehuman_system_assets_cc0.zip" \
            --face-pack "$GITHUB_WORKSPACE/.cache/v331-mpfb-assets/faceunits01.zip" \
            --viseme-pack "$GITHUB_WORKSPACE/.cache/v331-mpfb-assets/visemes01.zip" \
            --output-dir "$GITHUB_WORKSPACE/artifacts/v386-gltf-face-accessories" \
            2>&1 | tee artifacts/v386-gltf-face-accessories/v386-build.log
          if grep -q "Traceback (most recent call last)" artifacts/v386-gltf-face-accessories/v386-build.log; then
            echo "Blender Python traceback detected in V386 builder output."
            exit 1
          fi
          test -s artifacts/v386-gltf-face-accessories/lam-v386-candidate-report.json
          test -s artifacts/v386-gltf-face-accessories/lam-v386-gltf-materials-full-face-candidate.glb
          test -s artifacts/v386-gltf-face-accessories/lam-v386-gltf-materials-full-face-candidate.blend
          test -s artifacts/v386-gltf-face-accessories/v386-front.png
          test -s artifacts/v386-gltf-face-accessories/v386-three-quarter.png
          test -s artifacts/v386-gltf-face-accessories/v386-side.png
          test -s artifacts/v386-gltf-face-accessories/v386-face-closeup.png
          test -s artifacts/v386-gltf-face-accessories/v386-eye-closeup.png
          test -s artifacts/v386-gltf-face-accessories/v386-necklace-closeup.png
          test -s artifacts/v386-gltf-face-accessories/v386-front-no-armhole-binding.png
          test -s artifacts/v386-gltf-face-accessories/v386-front-shirt-only-no-skin.png
          test -s artifacts/v386-gltf-face-accessories/v386-front-skin-only-no-shirt.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/v386-gltf-face-accessories/lam-v386-candidate-report.json").read_text(encoding="utf-8"))
          expected = {
            "smile", "blink_left", "blink_right", "mouth_open", "jaw_open", "jaw_hinge",
            "brow_raise", "cheek_raise", "lip_press", "lip_fv", "lip_round", "tongue_tip"
          }
          assert report["status"] == "EXPERIMENTAL_V386_GLTFSKIN_FACE_ACCESSORY_CANDIDATE_NOT_APPROVED", report
          assert report["version"] == "V386", report
          refinement = report["sleeve_removal_audit"].get("armhole_topology_refinement_audit")
          assert refinement and refinement["status"] == "APPLIED", refinement
          assert refinement["cuts_per_edge"] == 5 and refinement["selected_edge_count"] >= 40, refinement
          assert refinement["uv_layer_names_before"] == refinement["uv_layer_names_after"], refinement
          assert refinement["material_names_before"] == refinement["material_names_after"], refinement
          report_sleeves = report["sleeve_removal_audit"]
          report_smoothing = report_sleeves["armhole_boundary_smoothing_audit"]
          expected_smoothing_iterations = 8 if "cut_profile_bisect_audit" in report_sleeves else 12
          assert report_smoothing["iterations"] == expected_smoothing_iterations, report_smoothing
          assert report["skin_count_gltf"] == 0 and report["texture_count_gltf"] >= 1, report
          assert report["excluded_face_accessories"] == [], report
          expected_face_meshes = {"eyebrow001", "eyelashes01", "high-poly", "teeth_base", "tongue01"}
          actual_face_meshes = {item["suffix"] for item in report["face_accessory_material_audits"]}
          assert expected_face_meshes.issubset(actual_face_meshes), {"expected_face_meshes": expected_face_meshes, "actual_face_meshes": actual_face_meshes}
          assert all(item["image_name"] and item["uv_map_name"] and item["export_material"] for item in report["face_accessory_material_audits"]), report
          assert len(report["morph_names_gltf"]) >= 12, report
          skin_uv = report["skin_uv_diagnostic"]
          assert skin_uv["image_name"] and skin_uv["uv_map_name"], skin_uv
          assert skin_uv["export_material"]["image"] == skin_uv["image_name"], skin_uv
          assert skin_uv["export_material"]["uv_map"] == skin_uv["uv_map_name"], skin_uv
          assert skin_uv["export_material"]["name"] == "V386_GltfCompatibleSkin", skin_uv
          assert all(item["alpha_enabled"] in (True, False) for item in report["face_accessory_material_audits"]), report
          assert "baked" in report["body_skinning"].lower(), report
          assert report["material_count_gltf"] >= 1, report
          assert set(report["morph_names_gltf"]).issuperset(expected), report
          assert "Lam_Idle_GentleSway" in report["animation_names_gltf"], report
          assert abs(report["character_bounds_m"]["size"][2] - 1.60) < 0.06, report
          assert 1_000_000 < report["glb_bytes"] < 200_000_000, report
          assert len(report["renders"]) >= 6, report
          render_files = {item["file"] for item in report["renders"]}
          assert {
            "v386-front-no-armhole-binding.png",
            "v386-front-shirt-only-no-skin.png",
            "v386-front-skin-only-no-shirt.png",
          }.issubset(render_files), render_files
          eye_geometry = report["eye_geometry_diagnostic"]
          assert eye_geometry["status"] == "MEASURED_ONLY", eye_geometry
          assert eye_geometry["geometry_changed"] is False, eye_geometry
          assert eye_geometry["eye_object"].endswith("high-poly"), eye_geometry
          assert eye_geometry["vertex_count"] > 100, eye_geometry
          assert eye_geometry["eye_bounds_size_m"][0] > 0, eye_geometry
          assert eye_geometry["eye_bounds_size_m"][1] > 0, eye_geometry
          assert eye_geometry["eye_bounds_size_m"][2] > 0, eye_geometry
          assert eye_geometry["head_band_width_x_m"] > 0, eye_geometry
          assert 0 < eye_geometry["eye_pair_span_to_head_band_width_ratio"] < 1.0, eye_geometry
          frame = report["face_framing_hair_audit"]
          assert frame["status"] == "APPLIED", frame
          assert frame["reference"] == "Bảng giới thiệu nhân vật Lý Lâm Lam.png", frame
          assert frame["reference_dimensions_px"] == [1214, 1295], frame
          assert frame["strand_count"] == 6 and len(frame["strands"]) == 6, frame
          alignment = frame["surface_alignment"]
          assert alignment["status"] == "APPLIED", alignment
          assert alignment["surface_offset_m"] == 0.0012, alignment
          assert alignment["all_points_sampled"] is True, alignment
          assert alignment["control_point_count"] == sum(item["section_count"] for item in frame["strands"]), alignment
          assert 0 <= alignment["max_abs_centerline_y_shift_m"] < 0.052, alignment
          assert all(
            len(item["surface_alignment"]) == item["section_count"]
            and all(
              sample["hit_object_count"] >= 1
              and abs(sample["surface_offset_m"] - 0.0012) < 1e-6
              and abs((sample["aligned_y_m"] - sample["surface_y_m"]) + 0.0012) < 2e-6
              for sample in item["surface_alignment"]
            )
            for item in frame["strands"]
          ), frame

          assert frame["material_settings"]["radius_scale_x"] == 0.70, frame["material_settings"]
          assert frame["material_settings"]["radius_scale_y"] == 0.72, frame["material_settings"]
          assert frame["material_settings"]["base_color_linear_rgba"] == [0.03, 0.011, 0.006, 1.0], frame["material_settings"]
          assert frame["material_settings"]["roughness"] == 0.80, frame["material_settings"]
          assert frame["material_settings"]["specular_ior_level"] == 0.11, frame["material_settings"]
          assert all(
            item["max_half_width_source_m"] > item["max_half_width_m"]
            and item["max_half_depth_source_m"] > item["max_half_depth_m"]
            for item in frame["strands"]
          ), frame
          assert all(
            item["vertex_count"] >= 24
            and item["face_count"] >= 20
            and 0 < item["max_half_width_m"] <= 0.0036
            and 0 < item["max_half_depth_m"] <= 0.0021
            and item["material_name"] == "V386_FaceFrameStrandMaterial"
            for item in frame["strands"]
          ), frame
          gltf_frame = frame["gltf_export"]
          assert gltf_frame["nodes_all_present"] is True, gltf_frame
          assert len(gltf_frame["present_node_names"]) == 6, gltf_frame
          assert gltf_frame["material_name"] == "V386_FaceFrameStrandMaterial", gltf_frame
          assert abs(float(gltf_frame["roughness_factor"]) - 0.80) <= 0.03, gltf_frame
          assert float(gltf_frame["metallic_factor"]) == 0.0, gltf_frame
          expected_frame_sources = {item["name"] for item in frame["strands"]}
          baked_frame_sources = {
            item["source_object"] for item in report["baked_mesh_diagnostics"]
          }
          assert expected_frame_sources.issubset(baked_frame_sources), {
            "expected": expected_frame_sources, "baked": baked_frame_sources
          }
          adjustment = report["body_shape_adjustment"]
          assert adjustment["status"] == "APPLIED", adjustment
          roles = {item["role"] for item in adjustment["edited_meshes"]}
          assert {"body", "clothing"}.issubset(roles), adjustment
          assert all(item["edited_coordinate_count"] > 0 for item in adjustment["edited_meshes"]), adjustment
          zones = adjustment["zones"]
          assert zones["hips"]["max_lateral_scale"] == 1.10, adjustment
          assert zones["upper_thigh"]["max_lateral_scale"] == 1.08, adjustment
          assert zones["mid_thigh"]["max_lateral_scale"] == 1.06, adjustment
          assert zones["posterior_hip_projection"]["max_shift_m"] == 0.025, adjustment
          assert zones["hips"]["central_x_falloff_m"] == [0.22, 0.30], adjustment
          assert zones["upper_thigh"]["central_x_falloff_m"] == [0.21, 0.29], adjustment
          assert zones["mid_thigh"]["central_x_falloff_m"] == [0.20, 0.28], adjustment
          assert zones["posterior_hip_projection"]["x_gated"] is True, adjustment

          assert report["macro_parameters"]["weight"] == 0.56, report["macro_parameters"]
          necklace = report["necklace_accessory_audit"]
          assert necklace["status"] == "APPLIED", necklace
          assert necklace["style"] == "fine silver chain with a circular open pendant, concentric inner ring and restrained center motif guided by the saved Lam reference", necklace
          assert necklace["material"]["name"] == "V386_SilverNecklace", necklace
          assert necklace["material"]["base_color_rgba"] == [0.62, 0.66, 0.72, 1.0], necklace
          assert necklace["material"]["metallic"] == 0.82, necklace
          assert necklace["material"]["roughness"] == 0.23, necklace
          assert necklace["material"]["specular_ior_level"] == 0.48, necklace
          assert necklace["chain_bevel_depth_m"] == 0.0010, necklace
          placement = necklace["placement_revision"]
          assert placement["baseline_version"] == "V364", placement
          assert placement["vertical_offset_m"] == 0.0, placement
          assert placement["candidate_chain_z_m"] == [1.293, 1.296, 1.307, 1.326], placement
          assert placement["pendant_center_z_m"] == 1.283, placement
          necklace_objects = necklace["objects"]
          assert len(necklace_objects) == 2, necklace
          assert {item["object"] for item in necklace_objects} == {"V386_NecklaceChain", "V386_NecklacePendant"}, necklace
          assert all(item["type"] == "MESH" and item["vertex_count"] > 0 and item["polygon_count"] > 0 for item in necklace_objects), necklace
          chain = next(item for item in necklace_objects if item["object"] == "V386_NecklaceChain")
          pendant = next(item for item in necklace_objects if item["object"] == "V386_NecklacePendant")
          assert chain["vertex_count"] >= 100 and chain["polygon_count"] >= 100, chain
          assert pendant["vertex_count"] >= 500 and pendant["polygon_count"] >= 300, pendant
          pendant_geometry = necklace["pendant_geometry"]
          assert pendant_geometry["joined_mesh"] is True and pendant_geometry["component_count"] == 3, pendant_geometry
          assert pendant_geometry["outer_major_radius_m"] == 0.0085 and pendant_geometry["outer_minor_radius_m"] == 0.0009, pendant_geometry
          assert pendant_geometry["inner_major_radius_m"] == 0.0045 and pendant_geometry["inner_minor_radius_m"] == 0.00045, pendant_geometry
          assert pendant_geometry["orientation"] == "X-Z plane facing the camera/front (-Y)", pendant_geometry
          assert len(necklace["chain_surface_samples"]) == 7, necklace
          assert all(item["sample_count"] > 0 for item in necklace["chain_surface_samples"]), necklace
          chain_z = [item["z_m"] for item in necklace["chain_surface_samples"]]
          assert min(chain_z) >= 1.293 and max(chain_z) <= 1.326, chain_z
          assert abs(necklace["pendant_surface_sample"]["z_m"] - 1.283) < 1e-6, necklace
          assert necklace["pendant_surface_sample"]["sample_count"] > 0, necklace
          junction = necklace["chain_junction_audit"]
          assert junction["status"] == "PASS_CONTACT_GEOMETRY", junction
          assert junction["control_point_index"] == 3, junction
          assert abs(junction["nominal_chain_centerline_y_m"] + 0.10413) < 0.0001, junction
          assert abs(junction["chain_centerline_y_m"] - junction["ring_forward_surface_y_m"]) <= 1e-6, junction
          assert 0.0080 <= abs(junction["junction_depth_adjustment_m"]) <= 0.0090, junction
          assert junction["depth_delta_to_ring_centerline_m"] <= 0.00091, junction
          assert junction["centerline_distance_m"] < junction["combined_tube_radii_m"], junction
          assert junction["contact_margin_m"] > 0.0001, junction
          offsets = junction["surface_to_chain_offsets_m"]
          assert len(offsets) == 7 and 0.011 <= offsets[3] <= 0.013, junction
          assert all(0.0030 <= offset <= 0.0040 for i, offset in enumerate(offsets) if i != 3), junction
          necklace_gltf = necklace["gltf_export"]
          assert any("V386_NecklaceChain" in name for name in necklace_gltf["node_names"]), necklace_gltf
          assert any("V386_NecklacePendant" in name for name in necklace_gltf["node_names"]), necklace_gltf
          assert necklace_gltf["material_name"] == "V386_SilverNecklace", necklace_gltf
          assert float(necklace_gltf["metallic_factor"]) >= 0.75, necklace_gltf
          assert 0.18 <= float(necklace_gltf["roughness_factor"]) <= 0.30, necklace_gltf
          hair = report["hair_material_audit"]
          gltf_hair = report["gltf_hair_material_audit"]
          assert hair["image"]["image_name"] == "V386_HairDiffuse_Darkened", hair
          assert hair["image"]["alpha_preserved"] is True, hair
          assert len(hair["hair_objects"]) >= 1, hair
          assert all(item["uv_map_name"] and item["alpha_enabled"] for item in hair["hair_objects"]), hair
          assert all(item["roughness"] == 0.86 and item["specular_ior_level"] == 0.12 for item in hair["hair_objects"]), hair
          assert gltf_hair["name"] == "V386_GltfCompatibleHair", gltf_hair
          assert gltf_hair["base_color_image_name"], gltf_hair
          assert gltf_hair["embedded_darkening_verified"] is True, gltf_hair
          assert gltf_hair["embedded_rgb_mean_linear"] < gltf_hair["source_rgb_mean_linear"] * 0.90, gltf_hair
          assert abs(gltf_hair["embedded_rgb_mean_linear"] - gltf_hair["processed_rgb_mean_linear"]) <= 0.06, gltf_hair
          assert float(gltf_hair["roughness_factor"]) >= 0.80, gltf_hair
          assert gltf_hair["alpha_mode"] == "BLEND", gltf_hair
          face_pose = report["default_face_pose"]
          assert face_pose["status"] == "APPLIED", face_pose
          assert face_pose["expression"] == "gentle_smile", face_pose
          assert face_pose["strength"] == 0.40, face_pose
          assert face_pose["total_vertices_adjusted"] > 0, face_pose
          applied_face_meshes = [item for item in face_pose["objects"] if item["status"] == "APPLIED"]
          assert len(applied_face_meshes) >= 1, face_pose
          assert all(item["smile_endpoint_preserved"] is True for item in applied_face_meshes), face_pose
          human_face = next((item for item in applied_face_meshes if item["object"] == "Human"), None)
          assert human_face is not None, face_pose
          assert human_face["max_neutral_displacement_m"] >= 0.0045, human_face
          assert all("smile" not in item["changed_key_blocks"] for item in applied_face_meshes), face_pose
          assert set(report["morph_names_gltf"]).issuperset({
            "smile", "blink_left", "blink_right", "mouth_open", "jaw_open", "jaw_hinge",
            "brow_raise", "cheek_raise", "lip_press", "lip_fv", "lip_round", "tongue_tip"
          }), report["morph_names_gltf"]
          eye_rows = [item for item in report["face_accessory_material_audits"] if item["suffix"] == "high-poly"]
          assert len(eye_rows) == 1, eye_rows
          eye_response = eye_rows[0]["material_response"]
          assert eye_response["scope"] == "high-poly eye connected components split into base-eye and forward-surface materials", eye_response
          assert eye_response["geometry_changed"] is False, eye_response
          assert eye_response["component_count"] == 4, eye_response
          assert eye_response["front_surface_component_count"] == 2, eye_response
          assert eye_response["front_surface_face_count"] > 0 and eye_response["base_eye_face_count"] > 0, eye_response
          assert eye_response["base_surface_settings"] == {
            "roughness": 0.32,
