name: Auto-generate Lam 3D avatar candidate

on:
  push:
    branches:
      - experiment/github-auto-avatar
    paths:
      - "references/lam-reference.png"
      - "references/lam-reference.png.png"
      - ".github/workflows/auto-generate-lam-avatar.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lam-avatar-candidate
  cancel-in-progress: false

jobs:
  inspect-alternatives:
    name: Check alternative hosted 3D generators
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inspect public Space health and APIs
        run: |
          python -m pip install --upgrade gradio_client
          python - <<'PY'
          import json, urllib.request, urllib.error
          from gradio_client import Client

          spaces = [
              "TencentARC/InstantMesh",
              "hysts/TripoSR",
              "camenduru/TripoSR",
              "numz/TripoSR",
              "tencent/Hunyuan3D-2",
              "stabilityai/TripoSR",
          ]
          for space_id in spaces:
              print("\\n=== SPACE:", space_id, "===")
              req = urllib.request.Request(
                  "https://huggingface.co/api/spaces/" + space_id,
                  headers={"User-Agent": "LyLamLam-space-diagnostic/1.0"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      meta = json.load(response)
                  stage = (meta.get("runtime") or {}).get("stage", "unknown")
                  print("STATUS=AVAILABLE")
                  print("RUNTIME_STAGE=" + str(stage))
                  print("SDK=" + str(meta.get("sdk", "unknown")))
                  if stage != "RUNNING":
                      print("API_DISCOVERY=SKIPPED_RUNTIME_NOT_RUNNING")
                      continue
                  try:
                      client = Client(space_id, verbose=False)
                      info = client.view_api(return_format="dict")
                      print("API_INFO=" + json.dumps(info, default=str)[:12000])
                  except Exception as exc:
                      print("API_DISCOVERY_ERROR=" + repr(exc))
              except urllib.error.HTTPError as exc:
                  print("STATUS=HTTP_ERROR")
                  print("HTTP_CODE=" + str(exc.code))
              except Exception as exc:
                  print("STATUS=ERROR")
                  print("ERROR=" + repr(exc))
          PY

  generate:
    name: Generate isolated Lam 3D candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4

      - name: Locate reference image
        id: reference
        run: |
          if [ -f "references/lam-reference.png" ]; then
            echo "image_path=references/lam-reference.png" >> "$GITHUB_OUTPUT"
          elif [ -f "references/lam-reference.png.png" ]; then
            echo "image_path=references/lam-reference.png.png" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Reference image not found. Expected references/lam-reference.png or references/lam-reference.png.png."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install client and mesh converter
        run: python -m pip install --upgrade gradio_client trimesh pygltflib

      - name: Try Hunyuan3D shape-only endpoint and export a GLB candidate
        env:
          IMAGE_PATH: ${{ steps.reference.outputs.image_path }}
        run: |
          python - <<'PY'
          import os, json, shutil
          from gradio_client import Client, handle_file

          image_path = os.environ["IMAGE_PATH"]
          print("Reference image found:", image_path)
          print("The combined Hunyuan3D endpoint previously failed with a server-side NameError. Trying the shape-only endpoint once.")
          client = Client("tencent/Hunyuan3D-2", verbose=True)
          result = client.predict(
              caption="Lam, realistic female avatar; preserve the reference face, hairstyle and body proportions",
              image=handle_file(image_path),
              mv_image_front=None,
              mv_image_back=None,
              mv_image_left=None,
              mv_image_right=None,
              steps=30,
              guidance_scale=5.0,
              seed=1234,
              octree_resolution=256,
              check_box_rembg=True,
              num_chunks=8000,
              randomize_seed=True,
              api_name="/shape_generation",
          )
          print("SHAPE_RESULT_TYPE=" + type(result).__name__)
          print("SHAPE_RESULT=" + json.dumps(result, default=str)[:5000])
          item = result[0] if isinstance(result, (tuple, list)) and result else result
          path = None
          if isinstance(item, str):
              path = item
          elif isinstance(item, dict):
              for key in ("path", "name"):
                  if isinstance(item.get(key), str):
                      path = item[key]
                      break
          if not path or not os.path.isfile(path):
              raise SystemExit("Shape endpoint did not return a local file. Existing lam-default.glb remains unchanged.")
          if path.lower().endswith(".glb"):
              shutil.copy2(path, "lam-avatar-candidate.glb")
          else:
              import trimesh
              mesh = trimesh.load(path, force="scene", process=False)
              mesh.export("lam-avatar-candidate.glb", file_type="glb")
          size = os.path.getsize("lam-avatar-candidate.glb")
          with open("lam-avatar-candidate.glb", "rb") as f:
              header = f.read(4)
          if size < 1024 or header != b"glTF":
              raise SystemExit("Converted candidate did not pass GLB header/size checks; production avatar remains unchanged.")
          print("GLB_CANDIDATE_CREATED=PASS")
          print("GLB_BYTES=" + str(size))
          print("SOURCE_MESH=" + os.path.basename(path))
          PY

      - name: Upload candidate as artifact (never replace production avatar)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lam-avatar-3d-candidate
          path: lam-avatar-candidate.glb
          if-no-files-found: error
          retention-days: 7
