name: V387 Rig-Preserving Exporter Static Tests

on:
  push:
    branches:
      - avatar/v387-rig-preserving-export-prototype
    paths:
      - "tools/export_skinned_glb_v387.py"
      - "tools/audit_blender_skinning_v387.py"
      - "tools/validate_gltf_skinning_v387.py"
      - "tools/test_validate_gltf_skinning_v387.py"
      - ".github/workflows/v387-rig-preserving-export-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        name: Check out exporter prototype
      - name: Compile Blender-side Python modules
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/export_skinned_glb_v387.py \
            tools/audit_blender_skinning_v387.py \
            tools/validate_gltf_skinning_v387.py
      - name: Run glTF skinning validator unit tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_validate_gltf_skinning_v387.py' -v
