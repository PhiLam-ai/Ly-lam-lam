name: Generate 3D Avatar Candidate

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "Public HTTPS URL of the single reference image (do not use private/personal images)"
        required: true
        type: string
      caption:
        description: "Optional short description for the model"
        required: false
        default: "Realistic female avatar, preserve the reference face, hairstyle and body proportions"
        type: string

permissions:
  contents: read

jobs:
  generate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install client
        run: python -m pip install --upgrade gradio_client requests

      - name: Download reference image
        env:
          IMAGE_URL: ${{ inputs.image_url }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          import requests
          url = os.environ["IMAGE_URL"].strip()
          parsed = urlparse(url)
          if parsed.scheme != "https" or not parsed.hostname:
              raise SystemExit("IMAGE_URL must be a public HTTPS URL.")
          response = requests.get(url, timeout=60, headers={"User-Agent": "Ly-Lam-Lam-avatar-candidate/1.0"})
          response.raise_for_status()
          content_type = response.headers.get("content-type", "").lower()
          if not content_type.startswith("image/"):
              raise SystemExit("The URL did not return an image content type.")
          if len(response.content) > 15 * 1024 * 1024:
              raise SystemExit("Reference image exceeds 15 MB.")
          ext = ".png" if "png" in content_type else ".webp" if "webp" in content_type else ".jpg"
          with open("reference" + ext, "wb") as f:
              f.write(response.content)
          with open("image_path.txt", "w") as f:
              f.write("reference" + ext)
          print("REFERENCE_IMAGE_DOWNLOADED=PASS")
          print("CONTENT_TYPE=" + content_type)
          print("BYTES=" + str(len(response.content)))
          PY

      - name: Generate model and export GLB
        env:
          CAPTION: ${{ inputs.caption }}
        run: |
          python - <<'PY'
          import os, json
          from gradio_client import Client, handle_file
          image_path = open("image_path.txt").read().strip()
          print("Connecting to Hunyuan3D-2 generation API...")
          client = Client("tencent/Hunyuan3D-2", verbose=True)
          result = client.predict(
              caption=os.environ.get("CAPTION", ""),
              image=handle_file(image_path),
              steps=30,
              guidance_scale=5.0,
              seed=1234,
              octree_resolution=256,
              check_box_rembg=True,
              num_chunks=8000,
              randomize_seed=True,
              api_name="/generation_all",
          )
          print("GENERATION_RESULT_TYPE=" + type(result).__name__)
          print("GENERATION_RESULT=" + json.dumps(result, default=str)[:4000])
          if not isinstance(result, (tuple, list)) or len(result) < 2:
              raise SystemExit("Generation API did not return the expected model files.")
          mesh_a, mesh_b = result[0], result[1]
          if not mesh_a or not mesh_b:
              raise SystemExit("Generation API returned empty model file paths.")
          exported = client.predict(
              file_out=mesh_a,
              file_out2=mesh_b,
              file_type="glb",
              reduce_face=True,
              export_texture=True,
              target_face_num=50000,
              api_name="/on_export_click",
          )
          print("EXPORT_RESULT_TYPE=" + type(exported).__name__)
          print("EXPORT_RESULT=" + json.dumps(exported, default=str)[:3000])
          candidates = []
          if isinstance(exported, (tuple, list)):
              candidates.extend(exported)
          else:
              candidates.append(exported)
          import shutil
          copied = False
          for item in candidates:
              if isinstance(item, str) and os.path.isfile(item) and item.lower().endswith((".glb", ".gltf")):
                  shutil.copy2(item, "lam-avatar-candidate.glb")
                  copied = True
                  break
              if isinstance(item, dict):
                  for key in ("path", "name"):
                      p = item.get(key)
                      if isinstance(p, str) and os.path.isfile(p) and p.lower().endswith((".glb", ".gltf")):
                          shutil.copy2(p, "lam-avatar-candidate.glb")
                          copied = True
                          break
          if not copied:
              raise SystemExit("The demo returned an export result, but a local GLB file could not be identified. See logs; existing avatar was not changed.")
          if os.path.getsize("lam-avatar-candidate.glb") < 1024:
              raise SystemExit("Exported GLB is unexpectedly small; refusing to treat it as a valid candidate.")
          print("GLB_CANDIDATE_CREATED=PASS")
          print("GLB_BYTES=" + str(os.path.getsize("lam-avatar-candidate.glb")))
          PY

      - name: Upload candidate artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lam-avatar-3d-candidate
          path: lam-avatar-candidate.glb
          if-no-files-found: error
          retention-days: 7
