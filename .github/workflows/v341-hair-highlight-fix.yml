name: V341 Hair Diffuse Highlight Fix Candidate

on:
  push:
    branches:
      - avatar/v313-repair-candidate-20261014
    paths:
      - "tools/blender_v341_hair_diffuse_highlight_fix.py"
      - ".github/workflows/v341-hair-highlight-fix.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v341-gltf-face-accessory
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build V341 hair-highlight candidate and test GLB
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        name: Check out Lam repository

      - name: Install Blender runtime libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils unzip \
            libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 \
            libgl1 libegl1 libx11-6 libxxf86vm1 libxcb1 libxext6 libdbus-1-3
          sudo rm -rf /var/lib/apt/lists/*

      - name: Cache official MakeHuman CC0 asset packs
        uses: actions/cache@v4
        with:
          path: .cache/v331-mpfb-assets
          key: v331-mpfb-assets-${{ runner.os }}-system-b5421278-face-d113107b-visemes-official-v1

      - name: Download and verify official MakeHuman assets
        id: download_assets
        run: |
          set -euo pipefail
          mkdir -p .cache/v331-mpfb-assets
          get_pack() {
            local name="$1" url1="$2" url2="$3"
            local out=".cache/v331-mpfb-assets/$name"
            if [ ! -s "$out" ]; then
              if ! curl -fL --retry 2 --retry-all-errors --connect-timeout 30 --max-time 3600 --speed-time 60 --speed-limit 1024 "$url1" -o "$out"; then
                rm -f "$out"
                curl -fL --retry 2 --retry-all-errors --connect-timeout 30 --max-time 3600 --speed-time 60 --speed-limit 1024 "$url2" -o "$out"
              fi
            fi
            test -s "$out"
          }
          get_pack makehuman_system_assets_cc0.zip \
            https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip \
            https://files.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip
          get_pack faceunits01.zip \
            https://files2.makehumancommunity.org/functional/faceunits01.zip \
            https://files.makehumancommunity.org/functional/faceunits01.zip
          get_pack visemes01.zip \
            https://files2.makehumancommunity.org/functional/visemes01.zip \
            https://files.makehumancommunity.org/functional/visemes01.zip

          echo "b542127a8e25547c7c29c19f2d1d2adb9a664c80396ecd694095dbc8028a0107  .cache/v331-mpfb-assets/makehuman_system_assets_cc0.zip" | sha256sum -c -
          echo "d113107bd7eb59f3af4df6fc0ec29bfcc593f496d0b336aec14f086a80ce7146  .cache/v331-mpfb-assets/faceunits01.zip" | sha256sum -c -
          for archive in .cache/v331-mpfb-assets/*.zip; do unzip -tq "$archive"; done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          root = Path(".cache/v331-mpfb-assets")
          report = {}
          for path in sorted(root.glob("*.zip")):
              with zipfile.ZipFile(path) as archive:
                  bad = archive.testzip()
                  if bad:
                      raise SystemExit(f"Invalid ZIP entry in {path.name}: {bad}")
                  names = archive.namelist()
              report[path.name] = {
                  "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "entries": len(names),
                  "contains_pack_manifest": any(name.startswith("packs/") for name in names),
              }
          assert report["makehuman_system_assets_cc0.zip"]["bytes"] > 250_000_000, report
          assert report["makehuman_system_assets_cc0.zip"]["contains_pack_manifest"], report
          assert report["faceunits01.zip"]["contains_pack_manifest"], report
          print(json.dumps(report, ensure_ascii=False, indent=2))
          Path("artifacts-v341-provenance.tmp").write_text(json.dumps(report, indent=2), encoding="utf-8")
          PY

      - name: Persist verified asset packs even if later build steps fail
        if: steps.download_assets.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .cache/v331-mpfb-assets
          key: v331-mpfb-assets-${{ runner.os }}-system-b5421278-face-d113107b-visemes-official-v1

      - name: Download Blender 4.5.3
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz \
            -o "$RUNNER_TEMP/blender.tar.xz"
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          "$RUNNER_TEMP/blender/blender" --background --factory-startup --python-expr \
            "import bpy; print('BLENDER_VERSION=' + bpy.app.version_string)"
          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"

      - name: Fetch MPFB source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/makehumancommunity/mpfb2.git "$RUNNER_TEMP/mpfb2"
          echo "MPFB_COMMIT=$(git -C "$RUNNER_TEMP/mpfb2" rev-parse HEAD)" >> "$GITHUB_ENV"
          test -s "$RUNNER_TEMP/mpfb2/src/mpfb/blender_manifest.toml"
          test -s "$RUNNER_TEMP/mpfb2/src/mpfb/__init__.py"

      - name: Install MPFB into Blender user extension repository
        run: |
          set -euo pipefail
          extension_root="$HOME/.config/blender/4.5/extensions/user_default"
          extension_package="$extension_root/mpfb"
          mkdir -p "$extension_root"
          rm -rf "$extension_package"
          cp -a "$RUNNER_TEMP/mpfb2/src/mpfb" "$extension_package"
          test -s "$extension_package/blender_manifest.toml"
          test -s "$extension_package/__init__.py"
          printf 'MPFB_EXTENSION_PATH=%s\n' "$extension_package" >> "$GITHUB_ENV"
          echo "Installed MPFB extension at $extension_package"

      - name: Preflight MPFB extension namespace
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender/blender" --background --factory-startup --python-expr \
            "import bpy, importlib.util; module='bl_ext.user_default.mpfb'; spec=importlib.util.find_spec(module); print('MPFB_EXTENSION_SPEC=', spec); assert spec is not None, 'MPFB extension is not discoverable from user_default'; result=bpy.ops.preferences.addon_enable(module=module); print('MPFB_ADDON_ENABLE=', result); assert 'FINISHED' in result; import bl_ext.user_default.mpfb as mpfb; print('MPFB_READY_VERSION=', mpfb.VERSION)"

      - name: Build and bake V341 candidate and render references
        run: |
          set -euo pipefail
          mkdir -p artifacts/v341-gltf-face-accessories
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender_v341_hair_diffuse_highlight_fix.py -- \
            --mpfb-src "$RUNNER_TEMP/mpfb2/src" \
            --system-pack "$GITHUB_WORKSPACE/.cache/v331-mpfb-assets/makehuman_system_assets_cc0.zip" \
            --face-pack "$GITHUB_WORKSPACE/.cache/v331-mpfb-assets/faceunits01.zip" \
            --viseme-pack "$GITHUB_WORKSPACE/.cache/v331-mpfb-assets/visemes01.zip" \
            --output-dir "$GITHUB_WORKSPACE/artifacts/v341-gltf-face-accessories" \
            2>&1 | tee artifacts/v341-gltf-face-accessories/v341-build.log
          if grep -q "Traceback (most recent call last)" artifacts/v341-gltf-face-accessories/v341-build.log; then
            echo "Blender Python traceback detected in V341 builder output."
            exit 1
          fi
          test -s artifacts/v341-gltf-face-accessories/lam-v341-candidate-report.json
          test -s artifacts/v341-gltf-face-accessories/lam-v341-gltf-materials-full-face-candidate.glb
          test -s artifacts/v341-gltf-face-accessories/lam-v341-gltf-materials-full-face-candidate.blend
          test -s artifacts/v341-gltf-face-accessories/v341-front.png
          test -s artifacts/v341-gltf-face-accessories/v341-three-quarter.png
          test -s artifacts/v341-gltf-face-accessories/v341-side.png
          test -s artifacts/v341-gltf-face-accessories/v341-face-closeup.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/v341-gltf-face-accessories/lam-v341-candidate-report.json").read_text(encoding="utf-8"))
          expected = {
            "smile", "blink_left", "blink_right", "mouth_open", "jaw_open", "jaw_hinge",
            "brow_raise", "cheek_raise", "lip_press", "lip_fv", "lip_round", "tongue_tip"
          }
          assert report["status"] == "EXPERIMENTAL_V341_GLTFSKIN_FACE_ACCESSORY_CANDIDATE_NOT_APPROVED", report
          assert report["version"] == "V341", report
          assert report["skin_count_gltf"] == 0 and report["texture_count_gltf"] >= 1, report
          assert report["excluded_face_accessories"] == [], report
          expected_face_meshes = {"eyebrow001", "eyelashes01", "high-poly", "teeth_base", "tongue01"}
          actual_face_meshes = {item["suffix"] for item in report["face_accessory_material_audits"]}
          assert expected_face_meshes.issubset(actual_face_meshes), {"expected_face_meshes": expected_face_meshes, "actual_face_meshes": actual_face_meshes}
          assert all(item["image_name"] and item["uv_map_name"] and item["export_material"] for item in report["face_accessory_material_audits"]), report
          assert len(report["morph_names_gltf"]) >= 12, report
          skin_uv = report["skin_uv_diagnostic"]
          assert skin_uv["image_name"] and skin_uv["uv_map_name"], skin_uv
          assert skin_uv["export_material"]["image"] == skin_uv["image_name"], skin_uv
          assert skin_uv["export_material"]["uv_map"] == skin_uv["uv_map_name"], skin_uv
          assert skin_uv["export_material"]["name"] == "V341_GltfCompatibleSkin", skin_uv
          assert all(item["alpha_enabled"] in (True, False) for item in report["face_accessory_material_audits"]), report
          assert "baked" in report["body_skinning"].lower(), report
          assert report["material_count_gltf"] >= 1, report
          assert set(report["morph_names_gltf"]).issuperset(expected), report
          assert "Lam_Idle_GentleSway" in report["animation_names_gltf"], report
          assert abs(report["character_bounds_m"]["size"][2] - 1.60) < 0.06, report
          assert 1_000_000 < report["glb_bytes"] < 200_000_000, report
          assert len(report["renders"]) >= 4, report
          adjustment = report["body_shape_adjustment"]
          assert adjustment["status"] == "APPLIED", adjustment
          roles = {item["role"] for item in adjustment["edited_meshes"]}
          assert {"body", "clothing"}.issubset(roles), adjustment
          assert all(item["edited_coordinate_count"] > 0 for item in adjustment["edited_meshes"]), adjustment
          zones = adjustment["zones"]
          assert zones["hips"]["max_lateral_scale"] == 1.10, adjustment
          assert zones["upper_thigh"]["max_lateral_scale"] == 1.08, adjustment
          assert zones["mid_thigh"]["max_lateral_scale"] == 1.06, adjustment
          assert zones["posterior_hip_projection"]["max_shift_m"] == 0.025, adjustment
          assert zones["hips"]["central_x_falloff_m"] == [0.22, 0.30], adjustment
          assert zones["upper_thigh"]["central_x_falloff_m"] == [0.21, 0.29], adjustment
          assert zones["mid_thigh"]["central_x_falloff_m"] == [0.20, 0.28], adjustment
          assert zones["posterior_hip_projection"]["x_gated"] is True, adjustment

          assert report["macro_parameters"]["weight"] == 0.56, report["macro_parameters"]
          hair = report["hair_material_audit"]
          gltf_hair = report["gltf_hair_material_audit"]
          assert hair["image"]["image_name"] == "V341_HairDiffuse_Darkened", hair
          assert hair["image"]["alpha_preserved"] is True, hair
          assert len(hair["hair_objects"]) >= 1, hair
          assert all(item["uv_map_name"] and item["alpha_enabled"] for item in hair["hair_objects"]), hair
          assert all(item["roughness"] == 0.86 and item["specular_ior_level"] == 0.12 for item in hair["hair_objects"]), hair
          assert gltf_hair["name"] == "V341_GltfCompatibleHair", gltf_hair
          assert "V341_HairDiffuse_Darkened" in gltf_hair["base_color_image_name"], gltf_hair
          assert float(gltf_hair["roughness_factor"]) >= 0.80, gltf_hair
          assert gltf_hair["alpha_mode"] == "BLEND", gltf_hair
          profile = report["morphometric_audit"]
          assert profile["vertex_count"] > 100, profile
          assert abs(profile["height_m"] - 1.60) < 0.06, profile
          expected_regions = {"head", "neck", "shoulders", "upper_torso", "waist", "hips", "upper_thigh", "mid_thigh"}
          assert set(profile["regions"]) == expected_regions, profile
          assert all(
            region.get("status") == "MEASURED"
            and region.get("vertex_count", 0) > 20
            and region.get("robust_width_x_m", 0) > 0
            and region.get("robust_depth_y_m", 0) > 0
            for region in profile["regions"].values()
          ), profile

          print("V341_GLTFSKIN_FACE_ACCESSORY_GATE=PASS_EXPERIMENTAL_ONLY")
          print(json.dumps({
            "blender_version": report["blender_version"],
            "mpfb_version": report["mpfb_version"],
            "height_m": report["character_bounds_m"]["size"][2],
            "mesh_count": report["mesh_count_gltf"],
            "skin_count": report["skin_count_gltf"],
            "texture_count": report["texture_count_gltf"],
            "morph_count": len(report["morph_names_gltf"]),
            "animations": report["animation_names_gltf"],
            "glb_bytes": report["glb_bytes"],
            "glb_sha256": report["glb_sha256"],
            "renders": report["renders"],
            "morphometric_audit": report["morphometric_audit"],
            "macro_parameters": report["macro_parameters"],
            "body_shape_adjustment": report["body_shape_adjustment"],
            "hair_material_audit": report["hair_material_audit"],
            "gltf_hair_material_audit": report["gltf_hair_material_audit"]
          }, ensure_ascii=False, indent=2))
          PY

      - name: Install browser-test dependencies
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/v314-playwright" --no-save --package-lock=false playwright pngjs
          "$RUNNER_TEMP/v314-playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: Check V341 GLB in mobile-sized Three.js viewer
        env:
          NODE_PATH: ${{ runner.temp }}/v314-playwright/node_modules
          V314_VIEWER_ROOT: ${{ runner.temp }}/v341-viewer
          V314_VIEWER_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/v341-browser-test
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v341-viewer" artifacts/v341-browser-test
          cp -a v312-work/. "$RUNNER_TEMP/v341-viewer/"
          cp artifacts/v341-gltf-face-accessories/lam-v341-gltf-materials-full-face-candidate.glb "$RUNNER_TEMP/v341-viewer/lam-default.glb"
          node --check tools/v314_candidate_webgl_smoke.cjs
          node tools/v314_candidate_webgl_smoke.cjs
          test -s artifacts/v341-browser-test/v314-candidate-browser-report.json
          test -s artifacts/v341-browser-test/v314-candidate-canvas.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/v341-browser-test/v314-candidate-browser-report.json").read_text(encoding="utf-8"))
          assert report["status"] == "PASS_BROWSER_WEBGL_CANDIDATE_ONLY", report
          assert report["state"]["booted"] is True, report
          assert report["state"]["rendererReady"] is True, report
          assert report["state"]["webgl"] is True, report
          assert report["state"]["activeAnimationName"] == "Lam_Idle_GentleSway", report
          assert report["state"]["animationTime"] > 0.05, report
          assert report["pageErrors"] == [] and report["consoleErrors"] == [], report
          print("V341_BROWSER_WEBGL_AND_MORPHS=PASS_EXPERIMENTAL_ONLY")
          print(json.dumps({"state": report["state"], "avatarDiagnostics": report.get("avatarDiagnostics"), "visualFraming": report["visualFraming"]}, ensure_ascii=False, indent=2))
          PY

      - name: Package experimental V341 Windows preview and SHA-256
        if: success()
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/ly-lam-lam-v341-preview-stage"
          package="$RUNNER_TEMP/ly-lam-lam-v341-experimental-windows.zip"
          mkdir -p "$stage/v312-work"
          cp -a v312-work/. "$stage/v312-work/"
          cp artifacts/v341-gltf-face-accessories/lam-v341-gltf-materials-full-face-candidate.glb "$stage/v312-work/lam-default.glb"
          cat > "$stage/v312-work/V341-EXPERIMENTAL-AVATAR.md" <<'MD'
          # V341 Experimental Real Human-Topology Avatar — Not Yet Approved

          This package preserves the V340 accepted body silhouette and replaces the hair's source material with a direct glTF-compatible material using a processed diffuse texture. The texture's bright baked highlights are luminance-compressed and warmed; alpha and UV mapping are preserved. Roughness is raised to 0.86 and specular IOR level lowered to 0.12. Body, face accessories, clothing, morphs and idle animation remain unchanged. This is a diagnostic candidate, not the final avatar.

          - This is an experimental human-mesh candidate, not a claim of final photorealism.
          - It includes a subtle Lam_Idle_GentleSway common-root animation and 12 base-mesh facial morph names. The five separate face accessory meshes are restored with export-safe materials so the browser image can be compared against the V335 texture-only diagnostic.
          - Voice/chat integration is not included in this avatar-only package.
          - The production lam-default.glb in the main branch is unchanged.
          - Compare V341's hair closeup, front render and browser screenshot against V340 to confirm the pale rim is reduced without black seams, alpha halos or changes to the silhouette. Do not promote without visual approval.
          - Launch on Windows by double-clicking START-LAM-WINDOWS.bat after installing Node.js LTS; keep the console open.
          MD
          (
            cd "$stage/v312-work"
            node --check tools/start-windows-preview.cjs
            node tools/start-windows-preview.cjs --check
          )
          python3 - "$stage" "$package" <<'PY'
          import hashlib, pathlib, sys, zipfile
          stage, package = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(package, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=8) as archive:
              for path in sorted(stage.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(stage).as_posix())
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          package.with_suffix(package.suffix + ".sha256").write_text(f"{digest}  {package.name}\n", encoding="ascii")
          with zipfile.ZipFile(package, "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"ZIP integrity failed: {bad}")
              names = archive.namelist()
              for required in (
                "v312-work/START-LAM-WINDOWS.bat",
                "v312-work/V341-EXPERIMENTAL-AVATAR.md",
                "v312-work/lam-default.glb",
                "v312-work/vendor/three/build/three.module.js",
              ):
                  if required not in names:
                      raise SystemExit(f"Missing package file: {required}")
          print(f"V341_WINDOWS_PREVIEW_BYTES={package.stat().st_size}")
          print(f"V341_WINDOWS_PREVIEW_SHA256={digest}")
          print("V341_WINDOWS_PREVIEW_ZIP_INTEGRITY=PASS")
          PY

      - name: Upload V341 model, editable scene, images, reports and preview package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ly-lam-lam-v341-gltf-face-accessory-${{ github.run_id }}
          path: |
            artifacts/v341-gltf-face-accessories/
            artifacts/v341-browser-test/
            ${{ runner.temp }}/ly-lam-lam-v341-experimental-windows.zip
            ${{ runner.temp }}/ly-lam-lam-v341-experimental-windows.zip.sha256
            artifacts-v341-provenance.tmp
          if-no-files-found: warn
          retention-days: 14
