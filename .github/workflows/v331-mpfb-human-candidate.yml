name: V331 Real Human-Topology Avatar Candidate

on:
  push:
    branches:
      - avatar/v313-repair-candidate-20261014
    paths:
      - "tools/blender_v331_photorealistic_candidate.py"
      - ".github/workflows/v331-mpfb-human-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v331-mpfb-human-candidate
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build textured human candidate with MPFB and test GLB
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        name: Check out Lam repository

      - name: Install Blender runtime libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils unzip \
            libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 \
            libgl1 libegl1 libx11-6 libxxf86vm1 libxcb1 libxext6 libdbus-1-3
          sudo rm -rf /var/lib/apt/lists/*

      - name: Cache official MakeHuman CC0 asset packs
        uses: actions/cache@v4
        with:
          path: .cache/v331-mpfb-assets
          key: v331-mpfb-assets-${{ runner.os }}-system-b5421278-face-d113107b-visemes-official-v1

      - name: Download and verify official MakeHuman assets
        id: download_assets
        run: |
          set -euo pipefail
          mkdir -p .cache/v331-mpfb-assets
          get_pack() {
            local name="$1" url1="$2" url2="$3"
            local out=".cache/v331-mpfb-assets/$name"
            if [ ! -s "$out" ]; then
              if ! curl -fL --retry 2 --retry-all-errors --connect-timeout 30 --max-time 3600 --speed-time 60 --speed-limit 1024 "$url1" -o "$out"; then
                rm -f "$out"
                curl -fL --retry 2 --retry-all-errors --connect-timeout 30 --max-time 3600 --speed-time 60 --speed-limit 1024 "$url2" -o "$out"
              fi
            fi
            test -s "$out"
          }
          get_pack makehuman_system_assets_cc0.zip \
            https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip \
            https://files.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip
          get_pack faceunits01.zip \
            https://files2.makehumancommunity.org/functional/faceunits01.zip \
            https://files.makehumancommunity.org/functional/faceunits01.zip
          get_pack visemes01.zip \
            https://files2.makehumancommunity.org/functional/visemes01.zip \
            https://files.makehumancommunity.org/functional/visemes01.zip

          echo "b542127a8e25547c7c29c19f2d1d2adb9a664c80396ecd694095dbc8028a0107  .cache/v331-mpfb-assets/makehuman_system_assets_cc0.zip" | sha256sum -c -
          echo "d113107bd7eb59f3af4df6fc0ec29bfcc593f496d0b336aec14f086a80ce7146  .cache/v331-mpfb-assets/faceunits01.zip" | sha256sum -c -
          for archive in .cache/v331-mpfb-assets/*.zip; do unzip -tq "$archive"; done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          root = Path(".cache/v331-mpfb-assets")
          report = {}
          for path in sorted(root.glob("*.zip")):
              with zipfile.ZipFile(path) as archive:
                  bad = archive.testzip()
                  if bad:
                      raise SystemExit(f"Invalid ZIP entry in {path.name}: {bad}")
                  names = archive.namelist()
              report[path.name] = {
                  "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "entries": len(names),
                  "contains_pack_manifest": any(name.startswith("packs/") for name in names),
              }
          assert report["makehuman_system_assets_cc0.zip"]["bytes"] > 250_000_000, report
          assert report["makehuman_system_assets_cc0.zip"]["contains_pack_manifest"], report
          assert report["faceunits01.zip"]["contains_pack_manifest"], report
          print(json.dumps(report, ensure_ascii=False, indent=2))
          Path("artifacts-v331-provenance.tmp").write_text(json.dumps(report, indent=2), encoding="utf-8")
          PY

      - name: Persist verified asset packs even if later build steps fail
        if: steps.download_assets.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .cache/v331-mpfb-assets
          key: v331-mpfb-assets-${{ runner.os }}-system-b5421278-face-d113107b-visemes-official-v1

      - name: Download Blender 4.5.3
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz \
            -o "$RUNNER_TEMP/blender.tar.xz"
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          "$RUNNER_TEMP/blender/blender" --background --factory-startup --python-expr \
            "import bpy; print('BLENDER_VERSION=' + bpy.app.version_string)"
          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"

      - name: Fetch MPFB source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/makehumancommunity/mpfb2.git "$RUNNER_TEMP/mpfb2"
          echo "MPFB_COMMIT=$(git -C "$RUNNER_TEMP/mpfb2" rev-parse HEAD)" >> "$GITHUB_ENV"
          test -s "$RUNNER_TEMP/mpfb2/src/mpfb/blender_manifest.toml"
          test -s "$RUNNER_TEMP/mpfb2/src/mpfb/__init__.py"

      - name: Install MPFB into Blender user extension repository
        run: |
          set -euo pipefail
          extension_root="$HOME/.config/blender/4.5/extensions/user_default"
          extension_package="$extension_root/mpfb"
          mkdir -p "$extension_root"
          rm -rf "$extension_package"
          cp -a "$RUNNER_TEMP/mpfb2/src/mpfb" "$extension_package"
          test -s "$extension_package/blender_manifest.toml"
          test -s "$extension_package/__init__.py"
          printf 'MPFB_EXTENSION_PATH=%s\n' "$extension_package" >> "$GITHUB_ENV"
          echo "Installed MPFB extension at $extension_package"

      - name: Preflight MPFB extension namespace
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender/blender" --background --factory-startup --python-expr \
            "import bpy, importlib.util; module='bl_ext.user_default.mpfb'; spec=importlib.util.find_spec(module); print('MPFB_EXTENSION_SPEC=', spec); assert spec is not None, 'MPFB extension is not discoverable from user_default'; result=bpy.ops.preferences.addon_enable(module=module); print('MPFB_ADDON_ENABLE=', result); assert 'FINISHED' in result; import bl_ext.user_default.mpfb as mpfb; print('MPFB_READY_VERSION=', mpfb.VERSION)"

      - name: Build actual human-topology Lam candidate and render references
        run: |
          set -euo pipefail
          mkdir -p artifacts/v331-real-human-candidate
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python tools/blender_v331_photorealistic_candidate.py -- \
            --mpfb-src "$RUNNER_TEMP/mpfb2/src" \
            --system-pack "$GITHUB_WORKSPACE/.cache/v331-mpfb-assets/makehuman_system_assets_cc0.zip" \
            --face-pack "$GITHUB_WORKSPACE/.cache/v331-mpfb-assets/faceunits01.zip" \
            --viseme-pack "$GITHUB_WORKSPACE/.cache/v331-mpfb-assets/visemes01.zip" \
            --output-dir "$GITHUB_WORKSPACE/artifacts/v331-real-human-candidate" \
            2>&1 | tee artifacts/v331-real-human-candidate/v331-build.log
          if grep -q "Traceback (most recent call last)" artifacts/v331-real-human-candidate/v331-build.log; then
            echo "Blender Python traceback detected in V331 builder output."
            exit 1
          fi
          test -s artifacts/v331-real-human-candidate/lam-v331-candidate-report.json
          test -s artifacts/v331-real-human-candidate/lam-v331-real-human-candidate.glb
          test -s artifacts/v331-real-human-candidate/lam-v331-real-human-candidate.blend
          test -s artifacts/v331-real-human-candidate/v331-front.png
          test -s artifacts/v331-real-human-candidate/v331-three-quarter.png
          test -s artifacts/v331-real-human-candidate/v331-side.png
          test -s artifacts/v331-real-human-candidate/v331-face-closeup.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/v331-real-human-candidate/lam-v331-candidate-report.json").read_text(encoding="utf-8"))
          expected = {
            "smile", "blink_left", "blink_right", "mouth_open", "jaw_open", "jaw_hinge",
            "brow_raise", "cheek_raise", "lip_press", "lip_fv", "lip_round", "tongue_tip"
          }
          assert report["status"] == "EXPERIMENTAL_V331_REAL_HUMAN_TOPOLOGY_CANDIDATE_NOT_APPROVED", report
          assert report["version"] == "V331", report
          assert report["skin_count_gltf"] >= 1 and report["texture_count_gltf"] >= 1, report
          assert report["material_count_gltf"] >= 1, report
          assert set(report["morph_names_gltf"]).issuperset(expected), report
          assert "Lam_Idle_GentleSway" in report["animation_names_gltf"], report
          assert abs(report["character_bounds_m"]["size"][2] - 1.60) < 0.06, report
          assert 1_000_000 < report["glb_bytes"] < 200_000_000, report
          assert len(report["renders"]) >= 4, report
          print("V331_REAL_HUMAN_GLTF_GATE=PASS_EXPERIMENTAL_ONLY")
          print(json.dumps({
            "blender_version": report["blender_version"],
            "mpfb_version": report["mpfb_version"],
            "height_m": report["character_bounds_m"]["size"][2],
            "mesh_count": report["mesh_count_gltf"],
            "skin_count": report["skin_count_gltf"],
            "texture_count": report["texture_count_gltf"],
            "morph_count": len(report["morph_names_gltf"]),
            "animations": report["animation_names_gltf"],
            "glb_bytes": report["glb_bytes"],
            "glb_sha256": report["glb_sha256"],
            "renders": report["renders"]
          }, ensure_ascii=False, indent=2))
          PY

      - name: Install browser-test dependencies
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/v314-playwright" --no-save --package-lock=false playwright pngjs
          "$RUNNER_TEMP/v314-playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: Check V331 GLB in mobile-sized Three.js viewer
        env:
          NODE_PATH: ${{ runner.temp }}/v314-playwright/node_modules
          V314_VIEWER_ROOT: ${{ runner.temp }}/v331-viewer
          V314_VIEWER_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/v331-browser-test
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v331-viewer" artifacts/v331-browser-test
          cp -a v312-work/. "$RUNNER_TEMP/v331-viewer/"
          cp artifacts/v331-real-human-candidate/lam-v331-real-human-candidate.glb "$RUNNER_TEMP/v331-viewer/lam-default.glb"
          node --check tools/v314_candidate_webgl_smoke.cjs
          node tools/v314_candidate_webgl_smoke.cjs
          test -s artifacts/v331-browser-test/v314-candidate-browser-report.json
          test -s artifacts/v331-browser-test/v314-candidate-canvas.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/v331-browser-test/v314-candidate-browser-report.json").read_text(encoding="utf-8"))
          assert report["status"] == "PASS_BROWSER_WEBGL_CANDIDATE_ONLY", report
          assert report["state"]["booted"] is True, report
          assert report["state"]["rendererReady"] is True, report
          assert report["state"]["webgl"] is True, report
          assert report["state"]["activeAnimationName"] == "Lam_Idle_GentleSway", report
          assert report["state"]["animationTime"] > 0.05, report
          assert report["pageErrors"] == [] and report["consoleErrors"] == [], report
          print("V331_BROWSER_WEBGL_AND_SKELETAL_IDLE=PASS_EXPERIMENTAL_ONLY")
          print(json.dumps({"state": report["state"], "avatarDiagnostics": report.get("avatarDiagnostics"), "visualFraming": report["visualFraming"]}, ensure_ascii=False, indent=2))
          PY

      - name: Package experimental V331 Windows preview and SHA-256
        if: success()
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/ly-lam-lam-v331-preview-stage"
          package="$RUNNER_TEMP/ly-lam-lam-v331-experimental-windows.zip"
          mkdir -p "$stage/v312-work"
          cp -a v312-work/. "$stage/v312-work/"
          cp artifacts/v331-real-human-candidate/lam-v331-real-human-candidate.glb "$stage/v312-work/lam-default.glb"
          cat > "$stage/v312-work/V331-EXPERIMENTAL-AVATAR.md" <<'MD'
          # V331 Experimental Real Human-Topology Avatar — Not Yet Approved

          This package uses a MakeHuman/MPFB human-topology model with CC0 system assets, a skeletal rig, and twelve composite facial targets. It replaces the stylized blockout inside this ZIP only.

          - This is an experimental human-mesh candidate, not a claim of final photorealism.
          - It includes a subtle Lam_Idle_GentleSway skeletal animation and 12 runtime-facing morph names.
          - Voice/chat integration is not included in this avatar-only package.
          - The production lam-default.glb in the main branch is unchanged.
          - Inspect the front, side, three-quarter and face-closeup images in the Actions artifact before approving a production replacement.
          - Launch on Windows by double-clicking START-LAM-WINDOWS.bat after installing Node.js LTS; keep the console open.
          MD
          (
            cd "$stage/v312-work"
            node --check tools/start-windows-preview.cjs
            node tools/start-windows-preview.cjs --check
          )
          python3 - "$stage" "$package" <<'PY'
          import hashlib, pathlib, sys, zipfile
          stage, package = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(package, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=8) as archive:
              for path in sorted(stage.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(stage).as_posix())
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          package.with_suffix(package.suffix + ".sha256").write_text(f"{digest}  {package.name}\n", encoding="ascii")
          with zipfile.ZipFile(package, "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"ZIP integrity failed: {bad}")
              names = archive.namelist()
              for required in (
                "v312-work/START-LAM-WINDOWS.bat",
                "v312-work/V331-EXPERIMENTAL-AVATAR.md",
                "v312-work/lam-default.glb",
                "v312-work/vendor/three/build/three.module.js",
              ):
                  if required not in names:
                      raise SystemExit(f"Missing package file: {required}")
          print(f"V331_WINDOWS_PREVIEW_BYTES={package.stat().st_size}")
          print(f"V331_WINDOWS_PREVIEW_SHA256={digest}")
          print("V331_WINDOWS_PREVIEW_ZIP_INTEGRITY=PASS")
          PY

      - name: Upload V331 model, editable scene, images, reports and preview package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ly-lam-lam-v331-real-human-candidate-${{ github.run_id }}
          path: |
            artifacts/v331-real-human-candidate/
            artifacts/v331-browser-test/
            ${{ runner.temp }}/ly-lam-lam-v331-experimental-windows.zip
            ${{ runner.temp }}/ly-lam-lam-v331-experimental-windows.zip.sha256
            artifacts-v331-provenance.tmp
          if-no-files-found: warn
          retention-days: 14
