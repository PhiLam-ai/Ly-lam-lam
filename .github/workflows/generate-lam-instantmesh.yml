name: Generate Lam textured 3D candidate with InstantMesh

on:
  push:
    branches:
      - experiment/github-auto-avatar
    paths:
      - "references/lam-reference.png"
      - "references/lam-reference.png.png"
      - ".github/workflows/generate-lam-instantmesh.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lam-instantmesh-candidate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4

      - name: Prepare single front-view crop
        id: reference
        run: |
          python -m pip install --upgrade pillow
          python - <<'PY'
          import os
          from PIL import Image
          candidates = ["references/lam-reference.png", "references/lam-reference.png.png"]
          source = next((p for p in candidates if os.path.isfile(p)), None)
          if not source:
              raise SystemExit("Lam reference image not found in expected references directory.")
          im = Image.open(source).convert("RGB")
          w, h = im.size
          # Reference is a multi-panel sheet. Keep the left front full-body panel and remove the detail panels.
          crop = im.crop((0, 0, max(1, int(w * 0.50)), h))
          crop.save("lam-reference-front.png", quality=95)
          print("REFERENCE_SOURCE=" + source)
          print("REFERENCE_SIZE=" + str(im.size))
          print("FRONT_CROP_SIZE=" + str(crop.size))
          print("FRONT_CROP_CREATED=PASS")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Gradio client
        run: python -m pip install --upgrade gradio_client pillow

      - name: Generate and export using InstantMesh
        run: |
          python - <<'PY'
          import os, json, shutil
          from gradio_client import Client, handle_file

          def local_path(value):
              if isinstance(value, str):
                  return value
              if isinstance(value, dict):
                  for key in ("path", "value", "name"):
                      p = value.get(key)
                      if isinstance(p, str):
                          return p
              return None

          print("Connecting to TencentARC/InstantMesh public demo.")
          client = Client("TencentARC/InstantMesh", verbose=True)

          print("STEP=preprocess")
          pre = client.predict(
              input_image=handle_file("lam-reference-front.png"),
              do_remove_background=True,
              api_name="/preprocess",
          )
          print("PREPROCESS_RESULT=" + json.dumps(pre, default=str)[:2000])
          p0 = pre[0] if isinstance(pre, (tuple, list)) else pre
          processed_path = local_path(p0)
          if not processed_path or not os.path.isfile(processed_path):
              raise SystemExit("InstantMesh preprocess did not return a local image file.")

          print("STEP=generate_mvs")
          mvs = client.predict(
              input_image=handle_file(processed_path),
              sample_steps=75,
              sample_seed=42,
              api_name="/generate_mvs",
          )
          print("MVS_RESULT=" + json.dumps(mvs, default=str)[:2000])
          m0 = mvs[0] if isinstance(mvs, (tuple, list)) else mvs
          mvs_path = local_path(m0)
          if not mvs_path or not os.path.isfile(mvs_path):
              raise SystemExit("InstantMesh multi-view generation did not return a local file.")

          print("STEP=make3d")
          result = client.predict(api_name="/make3d")
          print("MAKE3D_RESULT=" + json.dumps(result, default=str)[:4000])
          candidates = list(result) if isinstance(result, (tuple, list)) else [result]
          glb_path = None
          for item in candidates:
              p = local_path(item)
              if p and os.path.isfile(p) and p.lower().endswith(".glb"):
                  glb_path = p
                  break
          if not glb_path:
              raise SystemExit("InstantMesh did not return a local GLB file.")
          shutil.copy2(glb_path, "lam-avatar-instantmesh-candidate.glb")
          size = os.path.getsize("lam-avatar-instantmesh-candidate.glb")
          with open("lam-avatar-instantmesh-candidate.glb", "rb") as f:
              header = f.read(4)
          if size < 1024 or header != b"glTF":
              raise SystemExit("InstantMesh GLB candidate failed file-integrity checks.")
          print("INSTANTMESH_GLB_CREATED=PASS")
          print("GLB_BYTES=" + str(size))
          print("SOURCE_GLB=" + os.path.basename(glb_path))
          PY

      - name: Install Blender 3.6 for vertex-color texture baking
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl xz-utils libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libgl1 libegl1 libx11-6 libxxf86vm1 libxcb1 libxext6 libdbus-1-3
          sudo rm -rf /var/lib/apt/lists/*
          curl --fail --location --retry 3 https://download.blender.org/release/Blender3.6/blender-3.6.23-linux-x64.tar.xz --output /tmp/blender.tar.xz
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf /tmp/blender.tar.xz -C "$RUNNER_TEMP/blender" --strip-components=1
          "$RUNNER_TEMP/blender/blender" --background --factory-startup --python-expr "import bpy; print('BLENDER_VERSION=' + bpy.app.version_string)"

      - name: Bake InstantMesh vertex colors into a UV base-color texture
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender/blender" --background --factory-startup --python-expr '
          import bpy, os, json, traceback
          src=os.path.abspath("lam-avatar-instantmesh-candidate.glb")
          out=os.path.abspath("lam-avatar-instantmesh-textured-candidate.glb")
          texpath=os.path.abspath("lam-avatar-instantmesh-baked-color.png")
          if not os.path.isfile(src): raise FileNotFoundError(src)
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.import_scene.gltf(filepath=src)
          meshes=[o for o in bpy.context.scene.objects if o.type=="MESH"]
          if not meshes: raise RuntimeError("No mesh found in InstantMesh GLB")
          bpy.ops.object.select_all(action="DESELECT")
          for o in meshes: o.select_set(True)
          bpy.context.view_layer.objects.active=meshes[0]
          if len(meshes)>1:
              bpy.ops.object.join()
          obj=bpy.context.view_layer.objects.active
          color_attrs=list(obj.data.color_attributes) if hasattr(obj.data,"color_attributes") else []
          if not color_attrs and hasattr(obj.data,"vertex_colors"):
              color_attrs=list(obj.data.vertex_colors)
          if not color_attrs:
              raise RuntimeError("No vertex/color attribute found to bake; original candidate remains available")
          attr=color_attrs[0]
          print("COLOR_ATTRIBUTE_NAME="+attr.name)
          print("COLOR_ATTRIBUTE_DOMAIN="+str(getattr(attr,"domain","legacy")))
          print("COLOR_ATTRIBUTE_DATA_TYPE="+str(getattr(attr,"data_type","legacy")))
          mesh=obj.data
          if not mesh.uv_layers:
              mesh.uv_layers.new(name="UVMap")
          else:
              mesh.uv_layers.clear()
              mesh.uv_layers.new(name="UVMap")
          bpy.ops.object.mode_set(mode="EDIT")
          bpy.ops.mesh.select_all(action="SELECT")
          bpy.ops.uv.smart_project(island_margin=0.018)
          bpy.ops.object.mode_set(mode="OBJECT")
          mat=bpy.data.materials.new("Lam InstantMesh baked base color")
          mat.use_nodes=True
          obj.data.materials.clear()
          obj.data.materials.append(mat)
          for poly in mesh.polygons: poly.material_index=0
          nodes=mat.node_tree.nodes
          nodes.clear()
          outnode=nodes.new("ShaderNodeOutputMaterial")
          emission=nodes.new("ShaderNodeEmission")
          try:
              source=nodes.new("ShaderNodeVertexColor")
              source.layer_name=attr.name
              source_output=source.outputs.get("Color")
          except Exception:
              source=nodes.new("ShaderNodeAttribute")
              source.attribute_name=attr.name
              source_output=source.outputs.get("Color")
          if source_output is None: raise RuntimeError("Could not connect vertex color output")
          mat.node_tree.links.new(source_output, emission.inputs["Color"])
          mat.node_tree.links.new(emission.outputs["Emission"], outnode.inputs["Surface"])
          image=bpy.data.images.new("Lam Base Color", width=2048, height=2048, alpha=True)
          image.filepath_raw=texpath
          image.file_format="PNG"
          texnode=nodes.new("ShaderNodeTexImage")
          texnode.image=image
          nodes.active=texnode
          for n in nodes: n.select=False
          texnode.select=True
          scene=bpy.context.scene
          scene.render.engine="CYCLES"
          scene.cycles.samples=1
          scene.render.resolution_percentage=100
          scene.view_settings.view_transform="Standard"
          scene.view_settings.look="Medium High Contrast" if "Medium High Contrast" in {x.name for x in scene.view_settings.bl_rna.properties["look"].enum_items} else "None"
          scene.render.bake.margin=8
          bpy.ops.object.select_all(action="DESELECT")
          obj.select_set(True)
          bpy.context.view_layer.objects.active=obj
          print("BAKE_TYPE=EMIT")
          bpy.ops.object.bake(type="EMIT", use_clear=True, margin=8)
          image.save()
          image.pack()
          # Replace the baking graph with a standard PBR texture graph.
          nodes.clear()
          output=nodes.new("ShaderNodeOutputMaterial")
          principled=nodes.new("ShaderNodeBsdfPrincipled")
          texture=nodes.new("ShaderNodeTexImage")
          texture.image=image
          texture.interpolation="Linear"
          mat.node_tree.links.new(texture.outputs["Color"], principled.inputs["Base Color"])
          mat.node_tree.links.new(principled.outputs["BSDF"], output.inputs["Surface"])
          principled.inputs["Roughness"].default_value=0.72
          # Keep the baked texture as the single source of base color, preventing double tint from COLOR_0.
          if hasattr(mesh,"color_attributes"):
              for a in list(mesh.color_attributes): mesh.color_attributes.remove(a)
          elif hasattr(mesh,"vertex_colors"):
              for a in list(mesh.vertex_colors): mesh.vertex_colors.remove(a)
          bpy.ops.object.select_all(action="DESELECT")
          obj.select_set(True)
          bpy.context.view_layer.objects.active=obj
          bpy.ops.export_scene.gltf(filepath=out, export_format="GLB", use_selection=True, export_materials="EXPORT", export_texcoords=True, export_normals=True)
          if not os.path.isfile(out) or os.path.getsize(out)<1024: raise RuntimeError("Textured GLB export is missing or too small")
          with open(out,"rb") as f: header=f.read(4)
          if header!=b"glTF": raise RuntimeError("Exported GLB header check failed")
          with open(texpath,"rb") as f: png=f.read(8)
          if png!=b"\x89PNG\r\n\x1a\n": raise RuntimeError("Baked texture is not a valid PNG")
          print("TEXTURE_BAKE_STATUS=PASS")
          print("TEXTURE_BYTES="+str(os.path.getsize(texpath)))
          print("TEXTURED_GLB_BYTES="+str(os.path.getsize(out)))
          '
          python - <<'PY'
          import json, struct
          p="lam-avatar-instantmesh-textured-candidate.glb"
          data=open(p,"rb").read()
          magic,version,total=struct.unpack_from("<4sII",data,0)
          assert magic==b"glTF" and version==2 and total==len(data), (magic,version,total,len(data))
          chunk_len,chunk_type=struct.unpack_from("<I4s",data,12)
          assert chunk_type==b"JSON"
          doc=json.loads(data[20:20+chunk_len].decode("utf-8").rstrip("\x00 "))
          images=doc.get("images",[])
          textures=doc.get("textures",[])
          base_refs=sum(1 for m in doc.get("materials",[]) if ((m.get("pbrMetallicRoughness") or {}).get("baseColorTexture")))
          report={"glb_bytes":len(data),"images":len(images),"textures":len(textures),"materials_with_base_color_texture":base_refs,"meshes":len(doc.get("meshes",[])),"accessors":len(doc.get("accessors",[]))}
          print("TEXTURED_GLB_AUDIT="+json.dumps(report))
          assert images and textures and base_refs, "Export does not contain a usable base color texture"
          PY

      - name: Upload InstantMesh candidate (do not replace production avatar)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lam-avatar-instantmesh-candidate
          path: |
            lam-avatar-instantmesh-candidate.glb
            lam-avatar-instantmesh-textured-candidate.glb
            lam-avatar-instantmesh-baked-color.png
          if-no-files-found: error
          retention-days: 7
