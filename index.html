<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lý Lâm Lam — Avatar 3D</title>
<style>
html,body,#stage{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:#fff;font:14px system-ui,sans-serif}#status{position:absolute;left:12px;right:12px;bottom:10px;padding:9px 12px;border-radius:10px;background:#172235ee;color:#e5e7eb;pointer-events:none;z-index:3;line-height:1.45;white-space:pre-wrap}#diagnostics{display:none;position:absolute;top:10px;left:10px;right:10px;max-height:45%;overflow:auto;padding:10px;border-radius:12px;background:#172235ee;color:#fff;z-index:2}#diagnostics button{margin:3px;padding:7px 9px;border:1px solid #718096;border-radius:8px;background:#26364d;color:#fff}#diagnostics button:active{background:#49658c}#preset-buttons{padding:4px 0 8px}#mesh-buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:4px;margin:6px 0}#mesh-buttons label{display:flex;gap:6px;align-items:center;overflow-wrap:anywhere;padding:4px;border:1px solid #46566d;border-radius:6px;font-size:12px}#mesh-buttons input{flex-shrink:0}#diag-result{margin-top:6px;font-size:12px;line-height:1.4}#vertex-manifest{display:block;margin:7px 0;max-width:100%;font-size:12px}#trace-controls{display:grid;grid-template-columns:1fr;gap:5px;margin:8px 0;padding:8px;border:1px solid #46566d;border-radius:8px}#trace-time{width:100%}canvas{display:block}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body><div id="stage"></div><div id="diagnostics"><strong>Kiểm tra biểu cảm trực tiếp</strong><p>Chế độ này chỉ bật với ?diagnostics=1.</p><div id="preset-buttons"><strong>Thử tổ hợp</strong><br><button data-preset="smile">Nụ cười</button><button data-preset="blink">Chớp mắt</button><button data-preset="talk">Mở miệng nói</button><button data-preset="fv">Âm F/V</button><button data-preset="round">Môi tròn</button></div><strong>Thử từng morph</strong><div id="morph-buttons"></div><hr><strong>Kiểm tra hình học (ẩn/hiện mesh)</strong><div id="camera-buttons"><button data-camera="front">Camera +Z</button><button data-camera="back">Camera −Z</button><button data-camera="left">Camera −X</button><button data-camera="right">Camera +X</button></div><div id="mesh-buttons"></div><hr><strong>Tô sáng vertex cần kiểm tra</strong><input id="vertex-manifest" type="file" accept="application/json,.json"><div id="trace-controls"><label for="trace-animation">Animation GLTF cần phát và kiểm tra</label><select id="trace-animation" disabled><option value="">Chọn animation</option></select><label for="trace-time">Thời điểm (giây): <output id="trace-time-label">0.00</output></label><input id="trace-time" type="range" min="0" max="1" step="0.01" value="0" disabled><button id="apply-time-trace" disabled>Chuyển animation đến thời điểm và tô sáng</button></div><button id="clear-vertex-highlights">Xóa tô sáng vertex</button><button id="api-mode">Trở lại điều khiển API</button><button id="neutral-mode">Đưa về trung tính</button><div id="diag-result" aria-live="polite"></div></div><div id="status" role="status" aria-live="polite">Đang khởi tạo trình kết xuất 3D…</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import './avatar_expression_motion.js';
import './avatar_api_recovery.js';
import './avatar_expression_composer.js';
import './avatar_morph_transition.js';
import './avatar_mesh_inspector.js';
const stage=document.querySelector('#stage'), status=document.querySelector('#status');
const setStatus=(s)=>{status.textContent=s;};
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101827);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.01,1000);camera.position.set(0,1.2,3.2);
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);}
catch(error){setStatus('Không khởi tạo được WebGL. Hãy cập nhật Chrome và bật tăng tốc phần cứng.\nChi tiết: '+(error?.message||error));throw error;}
scene.add(new THREE.HemisphereLight(0xdce8ff,0x252c3a,2));const key=new THREE.DirectionalLight(0xffe5cf,2.2);key.position.set(2,4,3);scene.add(key);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.25,0);controls.enableDamping=true;controls.minDistance=.15;controls.maxDistance=100;
let bindings=new Map(),targets={},last=performance.now(),targetUrl=new URL('./lam-default.glb',location.href).href;
const morphTransition=globalThis.AvatarMorphTransition.createMorphTransition({timeConstantSeconds:.12});
let pollTimer=null,viewerReady=false,disposed=false,debugWeights=null;
const retryPolicy=globalThis.AvatarApiRecovery.createRetryPolicy({baseDelayMs:1200,maxDelayMs:12000,factor:2});
const blinkController=globalThis.AvatarExpressionMotion.createBlinkController();
const diagnosticsEnabled=new URLSearchParams(location.search).get('diagnostics')==='1';
const diagnostics=document.querySelector('#diagnostics'),morphButtons=document.querySelector('#morph-buttons'),diagResult=document.querySelector('#diag-result'),meshButtons=document.querySelector('#mesh-buttons');
let avatarScene=null,meshEntries=[],cameraDistance=3,vertexHighlightRecords=[],loadedVertexManifest=null,animationMixer=null,loadedAnimations=[],loadedGltf=null;
if(diagnosticsEnabled)diagnostics.style.display='block';
const expectedMorphs=['smile','blink_left','blink_right','mouth_open','jaw_open','jaw_hinge','brow_raise','cheek_raise','lip_press','lip_fv','lip_round','tongue_tip'];
function clamp(v){v=Number(v);return Number.isFinite(v)?Math.max(0,Math.min(1,v)):0}
function collect(root){const m=new Map();root.traverse(n=>{if(!n.morphTargetDictionary||!n.morphTargetInfluences)return;for(const [name,raw] of Object.entries(n.morphTargetDictionary)){const i=Number(raw);if(Number.isInteger(i)&&i>=0&&i<n.morphTargetInfluences.length){if(!m.has(name))m.set(name,[]);m.get(name).push({node:n,index:i})}}});return m}
function apply(weights){for(const [name,list] of bindings){const goal=clamp(weights?.[name]);for(const {node,index} of list)node.morphTargetInfluences[index]=goal;}}
async function getState(){targets={};setStatus(`Avatar đã tải và đang hiển thị · ${bindings.size} morph · API chưa kết nối (chế độ xem cục bộ)`);}
if(diagnosticsEnabled){
 const presets={smile:{smile:.82,cheek_raise:.25},blink:{blink_left:1,blink_right:1},talk:{mouth_open:.62,jaw_open:.5,jaw_hinge:.35},fv:{lip_fv:.9,lip_press:.12},round:{lip_round:.9,mouth_open:.12}};
 document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{const p=presets[b.dataset.preset]||{};debugWeights=Object.fromEntries(expectedMorphs.map(k=>[k,p[k]||0]));diagResult.textContent='Đang thử: '+b.textContent;}));
 for(const name of expectedMorphs){const b=document.createElement('button');b.type='button';b.textContent=name;b.addEventListener('click',()=>{debugWeights=Object.fromEntries(expectedMorphs.map(k=>[k,k===name?.85:0]));diagResult.textContent=bindings.has(name)?'Đang thử '+name:'Không tìm thấy morph '+name;});morphButtons.appendChild(b);}
 document.querySelector('#api-mode').addEventListener('click',()=>{debugWeights=null;diagResult.textContent='Đã trở về trọng số API.'});
 document.querySelector('#neutral-mode').addEventListener('click',()=>{debugWeights=Object.fromEntries(expectedMorphs.map(n=>[n,0]));diagResult.textContent='Đã đặt morph về trung tính.'});
 const traceAnimation=document.querySelector('#trace-animation'),traceTime=document.querySelector('#trace-time'),traceTimeLabel=document.querySelector('#trace-time-label'),applyTimeTrace=document.querySelector('#apply-time-trace');
 function refreshTimeTrace(){if(!loadedVertexManifest||!loadedGltf)return;const selected=traceAnimation.value,time=Number(traceTime.value);if(selected&&animationMixer){const seek=globalThis.AvatarMeshInspector.resolveAnimationSeek(loadedAnimations,selected,time);if(!seek.ok){diagResult.textContent='Không thể phát animation: '+seek.reason;return;}animationMixer.stopAllAction();const action=animationMixer.clipAction(seek.clip);action.reset();action.play();animationMixer.setTime(seek.time);}const filtered=globalThis.AvatarMeshInspector.filterManifestAtTime(loadedVertexManifest,selected,time);globalThis.AvatarMeshInspector.clearVertexHighlights(vertexHighlightRecords);const result=globalThis.AvatarMeshInspector.applyVertexHighlights(THREE,loadedGltf,filtered.manifest);vertexHighlightRecords=result.records;diagResult.textContent=result.error||('Đã tô sáng '+result.matchedVertices+' vertex.');}
 function updateTraceDuration(){const seek=globalThis.AvatarMeshInspector.resolveAnimationSeek(loadedAnimations,traceAnimation.value,Number(traceTime.value));const max=seek.ok?seek.duration:1;traceTime.max=String(Math.max(max,.01));traceTime.value=String(Math.min(Number(traceTime.value),max));traceTimeLabel.value=Number(traceTime.value).toFixed(2);}
 document.querySelector('#vertex-manifest').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f||!avatarScene)return;try{const m=JSON.parse(await f.text()),c=globalThis.AvatarMeshInspector.validateManifestCompatibility(m,targetUrl,loadedAnimations);if(!c.ok)throw Error('Manifest không tương thích: '+c.reason);loadedVertexManifest=m;traceAnimation.replaceChildren(new Option('Tất cả animation',''));for(const clip of loadedAnimations)traceAnimation.add(new Option(clip.name,clip.name));traceAnimation.disabled=traceTime.disabled=applyTimeTrace.disabled=false;updateTraceDuration();refreshTimeTrace();}catch(err){diagResult.textContent='Không đọc được manifest: '+err.message;}});
 traceAnimation.addEventListener('change',()=>{updateTraceDuration();refreshTimeTrace()});traceTime.addEventListener('input',()=>traceTimeLabel.value=Number(traceTime.value).toFixed(2));applyTimeTrace.addEventListener('click',refreshTimeTrace);
 document.querySelector('#clear-vertex-highlights').addEventListener('click',()=>{globalThis.AvatarMeshInspector.clearVertexHighlights(vertexHighlightRecords);vertexHighlightRecords=[];diagResult.textContent='Đã xóa tô sáng vertex.'});
 document.querySelectorAll('[data-camera]').forEach(b=>b.addEventListener('click',()=>{const p=globalThis.AvatarMeshInspector.getCameraPreset(b.dataset.camera,cameraDistance,0);if(p){camera.position.set(p.x,p.y,p.z);controls.target.set(0,0,0);controls.update();}}));
}
const manager=new THREE.LoadingManager();
manager.onStart=()=>setStatus('Đang tải thư viện và mô hình avatar…');
manager.onProgress=(url,loaded,total)=>setStatus('Đang tải tệp: '+url.split('/').pop()+' ('+loaded+'/'+total+')');
manager.onError=url=>setStatus('Không tìm thấy tài nguyên: '+url);
const loader=new GLTFLoader(manager);
const loadTimer=setTimeout(()=>{if(!viewerReady&&!disposed)setStatus('Đang chờ mô hình quá 15 giây. Kiểm tra lam-default.glb, mạng hoặc Console (F12 → Console). Tệp cần tải: '+targetUrl);},15000);
loader.load(targetUrl,gltf=>{
 if(disposed)return;clearTimeout(loadTimer);loadedGltf=gltf;loadedAnimations=Array.isArray(gltf.animations)?gltf.animations:[];animationMixer=new THREE.AnimationMixer(gltf.scene);avatarScene=gltf.scene;
 const box=new THREE.Box3().setFromObject(gltf.scene),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
 if(box.isEmpty()||![size.x,size.y,size.z].every(Number.isFinite)||Math.max(size.x,size.y,size.z)<.001){setStatus('Tệp GLB tải được nhưng không có hình học hiển thị.');console.error('GLB has empty/invalid bounds',size);return;}
 gltf.scene.position.sub(center);scene.add(gltf.scene);
 const radius=Math.max(size.x,size.y,size.z,.1);cameraDistance=radius*1.8/Math.tan(THREE.MathUtils.degToRad(camera.fov/2));camera.near=Math.max(.001,cameraDistance/10000);camera.far=Math.max(100,cameraDistance*10);camera.updateProjectionMatrix();camera.position.set(0,0,cameraDistance);controls.target.set(0,0,0);controls.minDistance=radius*.25;controls.maxDistance=radius*12;controls.update();
 bindings=collect(gltf.scene);viewerReady=true;
 if(diagnosticsEnabled){meshEntries=globalThis.AvatarMeshInspector.collectMeshEntries(avatarScene);meshButtons.replaceChildren();for(const [i,entry] of meshEntries.entries()){const label=document.createElement('label'),input=document.createElement('input'),caption=document.createElement('span');input.type='checkbox';input.checked=entry.visible;input.addEventListener('change',()=>globalThis.AvatarMeshInspector.setMeshVisibility(entry.node,input.checked));caption.textContent=(i+1)+'. '+entry.name;label.append(input,caption);meshButtons.appendChild(label);}const missing=expectedMorphs.filter(n=>!bindings.has(n));diagResult.textContent='Đã tải '+bindings.size+' morph; thiếu '+missing.length+': '+missing.join(', ');}
 setStatus('Avatar đã tải thành công · '+size.y.toFixed(2)+' m chiều cao mô hình · '+bindings.size+' morph · API chưa kết nối (xem thử cục bộ)');getState();
},xhr=>{if(xhr.total>0)setStatus('Đang tải avatar: '+Math.round(xhr.loaded/xhr.total*100)+'%');},error=>{clearTimeout(loadTimer);console.error('Avatar GLB load failed:',error);setStatus('Tải avatar thất bại. Kiểm tra mạng/đường dẫn tệp và mở F12 → Console.\nTệp: '+targetUrl+'\nLỗi: '+(error?.message||'Không rõ nguyên nhân'));});
function frame(now){if(disposed)return;requestAnimationFrame(frame);const dt=(now-last)/1000;last=now;const base=debugWeights===null?targets:debugWeights;const blink=blinkController.update(now,!document.hidden&&debugWeights===null);const composed=globalThis.AvatarExpressionComposer.composeAvatarFrame(base,blink);apply(morphTransition.update(composed,dt));if(animationMixer&&loadedAnimations.length&&diagnosticsEnabled&&traceAnimation?.value){}controls.update();renderer.render(scene,camera)}
requestAnimationFrame(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.addEventListener('visibilitychange',()=>{if(document.hidden){blinkController.reset();targets={};morphTransition.reset();if(pollTimer){clearTimeout(pollTimer);pollTimer=null;}}else if(viewerReady&&!pollTimer){retryPolicy.reset();getState();}});
window.addEventListener('pagehide',()=>{disposed=true;clearTimeout(loadTimer);if(pollTimer)clearTimeout(pollTimer);globalThis.AvatarMeshInspector.clearVertexHighlights(vertexHighlightRecords);if(animationMixer)animationMixer.stopAllAction();renderer.dispose();});
</script></body></html>
